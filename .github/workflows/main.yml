name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Restart Service
        run: |
          # Disable NLA + allow RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0
          
          # Enable firewall rule
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          # IMPORTANT: Restart TermService so registry changes take effect
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 10

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Verify RDP Is Listening on 3389
        run: |
          Write-Host "--- Checking RDP listener on port 3389 ---"
          $listening = $false
          for ($i = 1; $i -le 15; $i++) {
              $conn = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
              if ($conn) {
                  $listening = $true
                  Write-Host "RDP is LISTENING on port 3389." -ForegroundColor Green
                  $conn | Format-Table -AutoSize
                  break
              }
              Write-Host "  Waiting for RDP listener... ($i/15)"
              Start-Sleep -Seconds 3
          }
          if (-not $listening) {
              Write-Host "RDP is NOT listening. Attempting to force-enable..." -ForegroundColor Red
              # Force the RDP listener to be recreated
              $rdpListener = Get-CimInstance -ClassName Win32_TSNetworkAdapterSetting -Namespace "root\cimv2\terminalservices" -ErrorAction SilentlyContinue
              Restart-Service TermService -Force
              Start-Sleep -Seconds 10
              Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
          }

      - name: 4. Install & Start Bore Tunnel for RDP
        run: |
          # --- Download bore (v0.6.0 - correct URL) ---
          $url = "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile "C:\bore.zip"
          Expand-Archive -Path "C:\bore.zip" -DestinationPath "C:\bore" -Force
          Write-Host "Bore downloaded."

          $logFile = "C:\bore_output.log"
          $errorLogFile = "C:\bore_error.log"
          Remove-Item $logFile, $errorLogFile -Force -ErrorAction SilentlyContinue

          # Bind to 127.0.0.1:3389 explicitly
          $boreArgs = "local 3389 --to bore.pub --local-host 127.0.0.1"

          $boreProcess = Start-Process -FilePath "C:\bore\bore.exe" `
            -ArgumentList $boreArgs `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errorLogFile `
            -PassThru -NoNewWindow

          Write-Host "Bore started (PID: $($boreProcess.Id))."

          $publicAddr = $null
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                  if ($content -match "listening at (bore\.pub:\d+)") {
                      $publicAddr = $Matches[1]
                      break
                  }
              }
              Write-Host "  Waiting... ($i/30)"
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          if ($publicAddr) {
              Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
              Write-Host "  Public Address : $publicAddr" -ForegroundColor Yellow
              Write-Host "  Username       : CynetAdmin" -ForegroundColor Yellow
              Write-Host "  Password       : Cynet@2026" -ForegroundColor Yellow
              Write-Host ""
              Write-Host "  If mstsc hangs on 'Initializing connection...'" -ForegroundColor Magenta
              Write-Host "  try these fixes on YOUR client machine:" -ForegroundColor Magenta
              Write-Host "    1. Disable UDP for RDP (see notes below)" -ForegroundColor Magenta
              Write-Host "    2. Or use an SSH tunnel instead (more reliable)" -ForegroundColor Magenta
          } else {
              Write-Host "  Failed to detect bore address." -ForegroundColor Red
              Get-Content $logFile -ErrorAction SilentlyContinue
              Get-Content $errorLogFile -ErrorAction SilentlyContinue
          }
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Server Alive & Monitor Bore (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            $ts = Get-Date -Format "HH:mm:ss"
            $boreRunning = Get-Process -Name "bore" -ErrorAction SilentlyContinue
            $rdpUp = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
            if (-not $boreRunning) {
              Write-Host "[$i/360] $ts - WARNING: Bore died!" -ForegroundColor Red
            } elseif (-not $rdpUp) {
              Write-Host "[$i/360] $ts - WARNING: RDP listener gone!" -ForegroundColor Red
            } else {
              Write-Host "[$i/360] $ts - OK (bore + RDP listening)" -ForegroundColor Green
            }
          }
