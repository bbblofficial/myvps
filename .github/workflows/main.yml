name: Windows Cloud RDP - Free Tunnel Multi-Options (No Auth Required)

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Choose Tunnel Provider (All Free - No API Keys Needed)'
        required: true
        default: 'pinggy-free'
        type: choice
        options:
          - 'pinggy-free'
          - 'cloudflare'
          - 'playit-free'
          - 'bore-pub'
          - 'serveo'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup RDP and User
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "Setting up Remote Desktop..." -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Write-Host "Verifying RDP Port 3389..." -ForegroundColor Yellow
          $portReady = $false
          for ($i = 0; $i -lt 15; $i++) {
              $check = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
              if ($check.TcpTestSucceeded) {
                  $portReady = $true
                  Write-Host "Port 3389 is OPEN and READY!" -ForegroundColor Green
                  break
              }
              Start-Sleep -Seconds 1
          }
          if (-not $portReady) {
              Write-Host "[!] Port 3389 failed to bind." -ForegroundColor Red
              exit 1
          }

      # ======================================================================
      # Option 1: Pinggy Free TCP (FIXED: BatchMode + SSH key, no hang)
      # ======================================================================
      - name: 2a. Launch Pinggy Free Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'pinggy-free' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Pinggy Free SSH Tunnel (TCP)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          if (-not (Test-Path "$env:USERPROFILE\.ssh\id_ed25519")) {
              Write-Host "Generating SSH key (needed to avoid password prompt)..." -ForegroundColor Yellow
              ssh-keygen -t ed25519 -f "$env:USERPROFILE\.ssh\id_ed25519" -N '""' -q
          }

          $logOut = "C:\pinggy_out.log"
          $logErr = "C:\pinggy_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          $sshArgs = @(
            "-p", "443",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-o", "BatchMode=yes",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=3",
            "-o", "ExitOnForwardFailure=yes",
            "-R", "0:127.0.0.1:3389",
            "tcp@free.pinggy.io"
          )

          Write-Host "Establishing SSH connection to free.pinggy.io..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for Pinggy tunnel address (up to 120s)..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(120)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "SSH process exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $logErr) { Get-Content $logErr }
                  exit 1
              }
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "tcp://([a-zA-Z0-9\.\-]+:\d+)") {
                  $tunnelAddr = $matches[1]; break
              }
              if ($fullText -match "([a-zA-Z0-9\.\-]+\.pinggy\.(io|link):\d+)") {
                  $tunnelAddr = $matches[1]; break
              }
              if ($attempts % 10 -eq 0) {
                  Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray
              }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) {
              Write-Host "[X] Could not get Pinggy tunnel address" -ForegroundColor Red
              if (Test-Path $logOut) { Write-Host "--- STDOUT ---"; Get-Content $logOut }
              if (Test-Path $logErr) { Write-Host "--- STDERR ---"; Get-Content $logErr }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] PINGGY FREE RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Connect Remote Desktop to: $tunnelAddr" -ForegroundColor White
          Write-Host "Username: CynetAdmin  Password: Cynet@2026" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      # ======================================================================
      # Option 2: Cloudflare TryCloudflare (with fixes, but known limitations)
      # ======================================================================
      - name: 2b. Launch Cloudflare TryCloudflare Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'cloudflare' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Cloudflare TryCloudflare Tunnel" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "[!] WARNING: TryCloudflare Quick Tunnels have known" -ForegroundColor Yellow
          Write-Host "    limitations with RDP and may fail with a" -ForegroundColor Yellow
          Write-Host "    'websocket: bad handshake' error." -ForegroundColor Yellow
          Write-Host "    Consider using pinggy-free or bore-pub instead." -ForegroundColor Yellow
          Write-Host ""

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe" -ErrorAction Stop

          $logFile = "C:\cloudflared.log"
          if (Test-Path $logFile) { Remove-Item $logFile -Force }

          Write-Host "Starting cloudflared tunnel with rdp:// protocol..." -ForegroundColor Cyan
          # Use rdp:// for RDP, but be aware of the handshake limitation
          $cfArgs = "tunnel --url rdp://127.0.0.1:3389 --protocol http2 --logfile $logFile --no-autoupdate"
          $proc = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList $cfArgs -NoNewWindow -PassThru

          Write-Host "Waiting for Cloudflare tunnel URL..." -ForegroundColor Yellow
          $cfDomain = $null
          $timeout = [DateTime]::Now.AddSeconds(60)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "Cloudflared exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $logFile) { Get-Content $logFile }
                  exit 1
              }
              if (Test-Path $logFile) {
                  $content = Get-Content -Path $logFile -Raw -ErrorAction SilentlyContinue
                  if ($content -match "https://([a-zA-Z0-9-]+\.trycloudflare\.com)") {
                      $cfDomain = $matches[1]; break
                  }
              }
              if ($attempts % 10 -eq 0) { Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray }
              Start-Sleep -Seconds 1
          }

          if (-not $cfDomain) {
              Write-Host "[X] Failed to get Cloudflare tunnel URL" -ForegroundColor Red
              if (Test-Path $logFile) { Get-Content $logFile }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] CLOUDFLARE TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Domain   : $cfDomain" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "IMPORTANT: Download cloudflared on YOUR PC FIRST:" -ForegroundColor Red
          Write-Host "  https://github.com/cloudflare/cloudflared/releases/latest" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "On YOUR PC, run (try tcp instead of rdp first):" -ForegroundColor Magenta
          Write-Host "  cloudflared access tcp --hostname $cfDomain --url localhost:13389" -ForegroundColor Cyan
          Write-Host "  (If that fails, try: cloudflared access rdp --hostname $cfDomain --url rdp://localhost:13389)" -ForegroundColor Cyan
          Write-Host "Then connect RDP to: localhost:13389" -ForegroundColor White
          Write-Host "Username: CynetAdmin  Password: Cynet@2026" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[!] If 'websocket: bad handshake' persists:" -ForegroundColor Yellow
          Write-Host "    1. Update cloudflared: cloudflared update" -ForegroundColor White
          Write-Host "    2. Ensure hostname is ALL LOWERCASE" -ForegroundColor White
          Write-Host "    3. Check WebSockets is enabled in Cloudflare dashboard" -ForegroundColor White
          Write-Host "    4. Disable Super Bot Fight Mode for this subdomain" -ForegroundColor White
          Write-Host "    5. If all else fails, use pinggy-free or bore-pub instead" -ForegroundColor White

      # ======================================================================
      # Option 3: Playit Free (anonymous TCP tunnel, works for RDP)
      # ======================================================================
      - name: 2c. Launch Playit Free Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'playit-free' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Playit Free Tunnel" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "C:\playit.exe" -ErrorAction Stop

          $playitOut = "C:\playit_out.log"
          $playitErr = "C:\playit_err.log"
          Remove-Item $playitOut, $playitErr -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath "C:\playit.exe" `
              -RedirectStandardOutput $playitOut -RedirectStandardError $playitErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for Playit claim URL..." -ForegroundColor Yellow
          $claimUrl = $null
          $timeout = [DateTime]::Now.AddSeconds(120)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "Playit exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $playitErr) { Get-Content $playitErr }
                  exit 1
              }
              $outText = if (Test-Path $playitOut) { Get-Content -Path $playitOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $playitErr) { Get-Content -Path $playitErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "(https://playit\.gg/claim/[a-zA-Z0-9_\-]+)") {
                  $claimUrl = $matches[1]; break
              }
              if ($attempts % 10 -eq 0) { Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray }
              Start-Sleep -Seconds 1
          }

          if (-not $claimUrl) {
              Write-Host "[X] Could not get Playit claim URL" -ForegroundColor Red
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] PLAYIT FREE TUNNEL CLAIM URL" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Claim Link      : $claimUrl" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "1. Open: $claimUrl" -ForegroundColor White
          Write-Host "2. Click 'Claim Tunnel'" -ForegroundColor White
          Write-Host "3. Set port 3389 (RDP)" -ForegroundColor White
          Write-Host "4. Connect RDP to the address Playit gives you" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      # ======================================================================
      # Option 4: bore.pub (simple TCP tunnel, no auth)
      # ======================================================================
      - name: 2d. Launch bore.pub Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'bore-pub' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting bore.pub Tunnel (TCP)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          $zip = "C:\bore.zip"
          $dir = "C:\bore"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile $zip -ErrorAction Stop
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $boreExe = Get-ChildItem -Path $dir -Filter "bore.exe" -Recurse | Select-Object -First 1
          if (-not $boreExe) { Write-Host "bore.exe not found" -ForegroundColor Red; exit 1 }

          $logOut = "C:\bore_out.log"
          $logErr = "C:\bore_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          Write-Host "Starting bore local 3389 --to bore.pub ..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath $boreExe.FullName -ArgumentList @("local","3389","--to","bore.pub") `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr -NoNewWindow -PassThru

          Write-Host "Waiting for bore tunnel address..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(60)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) { Write-Host "bore exited"; exit 1 }
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "bore\.pub:(\d+)") {
                  $tunnelAddr = "bore.pub:$($matches[1])"; break
              }
              if ($attempts % 10 -eq 0) { Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) { Write-Host "[X] Could not get bore address" -ForegroundColor Red; exit 1 }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] BORE.PUB RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Connect Remote Desktop to: $tunnelAddr" -ForegroundColor White

      # ======================================================================
      # Option 5: Serveo (SSH reverse tunnel, no auth, TCP)
      # ======================================================================
      - name: 2e. Launch Serveo Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'serveo' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Serveo Tunnel (TCP over SSH)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          $logOut = "C:\serveo_out.log"
          $logErr = "C:\serveo_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "$env:USERPROFILE\.ssh\id_ed25519")) {
              ssh-keygen -t ed25519 -f "$env:USERPROFILE\.ssh\id_ed25519" -N '""' -q
          }

          $sshArgs = @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-o", "BatchMode=yes",
            "-o", "ServerAliveInterval=30",
            "-o", "ExitOnForwardFailure=yes",
            "-R", "0:127.0.0.1:3389",
            "serveo.net"
          )

          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr -NoNewWindow -PassThru

          Write-Host "Waiting for Serveo tunnel address..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(60)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) { Write-Host "SSH exited"; if (Test-Path $logErr) { Get-Content $logErr }; exit 1 }
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "serveo\.net:(\d+)") {
                  $tunnelAddr = "serveo.net:$($matches[1])"; break
              }
              if ($attempts % 10 -eq 0) { Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) { Write-Host "[X] Could not get Serveo address" -ForegroundColor Red; exit 1 }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] SERVEO RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Connect Remote Desktop to: $tunnelAddr" -ForegroundColor White

      - name: 3. Keep Tunnel Alive
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ""
          Write-Host "Tunnel is active! Session will remain open..." -ForegroundColor Green
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/350 min] Tunnel still active" -ForegroundColor Green
          }
          Write-Host "Workflow timeout reached. Tunnel session ending." -ForegroundColor Yellow
