name: Windows Cloud RDP Multi-Tunnel

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Choose Tunnel Provider'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - 'cloudflare'
          - 'pinggy-key'
          - 'ngrok'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    
    # Add secrets to the environment
    env:
      PINGGY_KEY: ${{ secrets.PINGGY_KEY }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

    steps:
      # ======================================================================
      # Step 1: Setup RDP and ensure port 3389 is open
      # ======================================================================
      - name: 1. Setup RDP and User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0;
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop";
          Restart-Service TermService -Force;

          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force;
          if (-not (Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires;
          }
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue;
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CynetAdmin" -ErrorAction SilentlyContinue;

          Write-Host "Verifying RDP Port 3389...";
          $portReady = $false;
          for ($i = 0; $i -lt 15; $i++) {
              $check = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue;
              if ($check.TcpTestSucceeded) {
                  $portReady = $true;
                  Write-Host "Port 3389 is OPEN and READY!" -ForegroundColor Green;
                  break;
              }
              Start-Sleep -Seconds 1;
          }
          if (-not $portReady) {
              Write-Host "[!] Port 3389 failed to bind." -ForegroundColor Red;
              exit 1;
          }

      # ======================================================================
      # Option 1: Cloudflare TryCloudflare (NO AUTH REQUIRED - RECOMMENDED)
      # Free, no setup needed, works in CI/CD without credentials
      # ======================================================================
      - name: 2. Launch Cloudflare Tunnel (No Auth Required)
        if: ${{ github.event.inputs.tunnel_provider == 'cloudflare' }}
        shell: powershell
        run: |
          Write-Host "Downloading cloudflared..." -ForegroundColor Cyan;
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe";
          
          $logFile = "C:\cloudflared.log";
          if (Test-Path $logFile) { Remove-Item $logFile -Force; }

          # HTTP/2 protocol avoids UDP/QUIC blockage on GitHub Actions
          Write-Host "Starting Cloudflare tunnel (TryCloudflare)..." -ForegroundColor Cyan;
          $cfArgs = "tunnel --url tcp://localhost:3389 --protocol http2 --logfile $logFile --no-autoupdate";
          $proc = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList $cfArgs -NoNewWindow -PassThru;

          Write-Host "Waiting for TryCloudflare URL..." -ForegroundColor Yellow;
          $domain = $null;
          $timeout = [DateTime]::Now.AddSeconds(60);

          while ([DateTime]::Now -lt $timeout) {
              if ($proc.HasExited) {
                  Write-Host "Cloudflared process terminated with code: $($proc.ExitCode)" -ForegroundColor Red;
                  if (Test-Path $logFile) {
                      Write-Host "--- LOG ---";
                      Get-Content $logFile;
                  }
                  exit 1;
              }

              if (Test-Path $logFile) {
                  $content = Get-Content -Path $logFile -Raw -ErrorAction SilentlyContinue;
                  if ($content -match "https://([a-zA-Z0-9-]+\.trycloudflare\.com)") {
                      $domain = $matches[1];
                      break;
                  }
              }
              Start-Sleep -Seconds 1;
          }

          if ($domain) {
              Write-Host "";
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host ">>> CLOUDFLARE RDP READY <<<" -ForegroundColor Cyan;
              Write-Host "Domain   : $domain" -ForegroundColor Yellow;
              Write-Host "Username : CynetAdmin" -ForegroundColor Yellow;
              Write-Host "Password : Cynet@2026" -ForegroundColor Yellow;
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host "";
              Write-Host "[1] Run on your PC (requires cloudflared):" -ForegroundColor Magenta;
              Write-Host "cloudflared access rdp --hostname $domain --url rdp://localhost:13389" -ForegroundColor White;
              Write-Host "";
              Write-Host "[2] Connect Remote Desktop (mstsc) to: localhost:13389" -ForegroundColor Magenta;
              Write-Host "==================================================" -ForegroundColor Green;
          } else {
              Write-Host "[!] Failed to get Cloudflare tunnel URL." -ForegroundColor Red;
              if (Test-Path $logFile) { Get-Content $logFile; }
              exit 1;
          }

      # ======================================================================
      # Option 2: Pinggy (WITH API KEY - Requires PINGGY_KEY secret)
      # ======================================================================
      - name: 3. Launch Pinggy Tunnel (With Authentication Key)
        if: ${{ github.event.inputs.tunnel_provider == 'pinggy-key' }}
        shell: powershell
        run: |
          # Verify Pinggy API key is configured
          if (-not $env:PINGGY_KEY) {
              Write-Host "[!] PINGGY_KEY secret is not configured!" -ForegroundColor Red;
              Write-Host "Add PINGGY_KEY to GitHub repository secrets:" -ForegroundColor Yellow;
              Write-Host "  1. Go to Settings > Secrets and variables > Actions" -ForegroundColor White;
              Write-Host "  2. Click 'New repository secret'" -ForegroundColor White;
              Write-Host "  3. Name: PINGGY_KEY" -ForegroundColor White;
              Write-Host "  4. Value: Your Pinggy API key from https://pinggy.io" -ForegroundColor White;
              exit 1;
          }

          $logOut = "C:\pinggy_out.log";
          $logErr = "C:\pinggy_err.log";
          if (Test-Path $logOut) { Remove-Item $logOut -Force; }
          if (Test-Path $logErr) { Remove-Item $logErr -Force; }

          Write-Host "Connecting to Pinggy with authentication..." -ForegroundColor Cyan;
          # Use Pinggy token authentication instead of publickey
          $sshArgs = "-p 443 -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o BatchMode=yes -o ServerAliveInterval=30 -L 4300:localhost:4300 -R 0:localhost:3389 `"$env:PINGGY_KEY`@a.pinggy.io";
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs -RedirectStandardOutput $logOut -RedirectStandardError $logErr -NoNewWindow -PassThru;

          Write-Host "Waiting for Pinggy direct TCP address..." -ForegroundColor Yellow;
          $directUrl = $null;
          $timeout = [DateTime]::Now.AddSeconds(60);

          while ([DateTime]::Now -lt $timeout) {
              if ($proc.HasExited) {
                  Write-Host "SSH process exited with code: $($proc.ExitCode)" -ForegroundColor Red;
                  Write-Host "--- ERROR OUTPUT ---" -ForegroundColor Red;
                  if (Test-Path $logErr) { Get-Content $logErr; }
                  exit 1;
              }

              # Check via Pinggy web debugger on localhost
              try {
                  $resp = Invoke-RestMethod -Uri "http://localhost:4300/urls" -TimeoutSec 1 -ErrorAction SilentlyContinue;
                  if ($resp -and $resp.tcp) {
                      $directUrl = $resp.tcp -replace '^tcp://', '';
                      break;
                  }
              } catch {}

              # Fallback: check output files for TCP address
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" };
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" };
              $cleanText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', '';

              if ($cleanText -match "tcp://([a-zA-Z0-9\.\-]+:\d+)") {
                  $directUrl = $matches[1];
                  break;
              } elseif ($cleanText -match "([a-zA-Z0-9\.\-]+\.pinggy\.[a-z]+:\d+)") {
                  $directUrl = $matches[1];
                  break;
              } elseif ($cleanText -match "([a-zA-Z0-9\.\-]+\.pinggy\.link:\d+)") {
                  $directUrl = $matches[1];
                  break;
              }

              Start-Sleep -Seconds 1;
          }

          if ($directUrl) {
              Write-Host "";
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host ">>> PINGGY RDP READY <<<" -ForegroundColor Cyan;
              Write-Host "Address  : $directUrl" -ForegroundColor Yellow;
              Write-Host "Username : CynetAdmin" -ForegroundColor Yellow;
              Write-Host "Password : Cynet@2026" -ForegroundColor Yellow;
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host "Connect directly via mstsc to: $directUrl" -ForegroundColor White;
          } else {
              Write-Host "[!] Could not fetch Pinggy URL." -ForegroundColor Red;
              if (Test-Path $logOut) { Write-Host "--- STDOUT ---"; Get-Content $logOut; }
              if (Test-Path $logErr) { Write-Host "--- STDERR ---"; Get-Content $logErr; }
              exit 1;
          }

      # ======================================================================
      # Option 3: Ngrok (Requires NGROK_AUTHTOKEN secret)
      # Free tier available, direct TCP support
      # ======================================================================
      - name: 4. Launch Ngrok Tunnel (With Auth Token)
        if: ${{ github.event.inputs.tunnel_provider == 'ngrok' }}
        shell: powershell
        run: |
          # Verify Ngrok auth token is configured
          if (-not $env:NGROK_AUTHTOKEN) {
              Write-Host "[!] NGROK_AUTHTOKEN secret is not configured!" -ForegroundColor Red;
              Write-Host "Add NGROK_AUTHTOKEN to GitHub repository secrets:" -ForegroundColor Yellow;
              Write-Host "  1. Go to Settings > Secrets and variables > Actions" -ForegroundColor White;
              Write-Host "  2. Click 'New repository secret'" -ForegroundColor White;
              Write-Host "  3. Name: NGROK_AUTHTOKEN" -ForegroundColor White;
              Write-Host "  4. Value: Your token from https://dashboard.ngrok.com" -ForegroundColor White;
              exit 1;
          }

          Write-Host "Downloading ngrok..." -ForegroundColor Cyan;
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok.zip";
          Expand-Archive -Path "C:\ngrok.zip" -DestinationPath "C:\" -Force;

          Write-Host "Configuring ngrok auth token..." -ForegroundColor Cyan;
          & "C:\ngrok.exe" config add-authtoken $env:NGROK_AUTHTOKEN;

          $logFile = "C:\ngrok.log";
          if (Test-Path $logFile) { Remove-Item $logFile -Force; }

          Write-Host "Starting ngrok tunnel..." -ForegroundColor Cyan;
          $proc = Start-Process -FilePath "C:\ngrok.exe" -ArgumentList "tcp", "3389", "--log", $logFile --log-level debug" -NoNewWindow -PassThru;

          Write-Host "Waiting for ngrok public address..." -ForegroundColor Yellow;
          $publicAddr = $null;
          $timeout = [DateTime]::Now.AddSeconds(60);

          while ([DateTime]::Now -lt $timeout) {
              if ($proc.HasExited) {
                  Write-Host "Ngrok process terminated unexpectedly." -ForegroundColor Red;
                  if (Test-Path $logFile) {
                      Write-Host "--- LOG ---";
                      Get-Content $logFile;
                  }
                  exit 1;
              }

              # Query ngrok API for tunnel status
              try {
                  $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 1 -ErrorAction SilentlyContinue;
                  if ($resp.tunnels -and $resp.tunnels.Count -gt 0) {
                      $tunnel = $resp.tunnels[0];
                      if ($tunnel.public_url -match "tcp://(.+)") {
                          $publicAddr = $matches[1];
                          break;
                      }
                  }
              } catch {}

              Start-Sleep -Seconds 1;
          }

          if ($publicAddr) {
              Write-Host "";
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host ">>> NGROK RDP READY <<<" -ForegroundColor Cyan;
              Write-Host "Address  : $publicAddr" -ForegroundColor Yellow;
              Write-Host "Username : CynetAdmin" -ForegroundColor Yellow;
              Write-Host "Password : Cynet@2026" -ForegroundColor Yellow;
              Write-Host "==================================================" -ForegroundColor Green;
              Write-Host "Connect directly via mstsc to: $publicAddr" -ForegroundColor White;
          } else {
              Write-Host "[!] Could not fetch ngrok URL." -ForegroundColor Red;
              if (Test-Path $logFile) { Get-Content $logFile; }
              exit 1;
          }

      # ======================================================================
      # Step 5: Keep session alive until workflow timeout
      # ======================================================================
      - name: 5. Keep Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60;
              Write-Host "[$i/350 min] Runner session active...";
          }
