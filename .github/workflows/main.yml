name: Windows Cloud RDP via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Restart-Service TermService -Force
          Start-Sleep -Seconds 10

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue

      - name: 3. Setup Cloudflare Tunnel
        run: |
          # Download cloudflared
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "C:\cloudflared.exe"
          
          # Start the tunnel in a new process
          $logFile = "C:\cloudflared.log"
          Start-Process -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --url rdp://localhost:3389 --no-tls-verify" `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError "C:\cloudflared_error.log" `
            -PassThru -WindowStyle Hidden
          
          # Wait for the tunnel URL to appear in the log
          Write-Host "Waiting for Cloudflare Tunnel to start..."
          $publicUrl = $null
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                  # The URL looks like: https://random-words.trycloudflare.com
                  if ($content -match "(https://[a-z0-9-]+\.trycloudflare\.com)") {
                      $publicUrl = $Matches[1]
                      break
                  }
              }
              Write-Host "  Waiting... ($i/30)"
          }
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          if ($publicUrl) {
              Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
              Write-Host "  Tunnel URL     : $publicUrl" -ForegroundColor Yellow
              Write-Host "  Username       : CynetAdmin" -ForegroundColor Yellow
              Write-Host "  Password       : Cynet@2026" -ForegroundColor Yellow
              Write-Host ""
              Write-Host "  == HOW TO CONNECT ==" -ForegroundColor Magenta
              Write-Host "  1. Install 'cloudflared' on your PC." -ForegroundColor Magenta
              Write-Host "  2. Run this command in your terminal:" -ForegroundColor Magenta
              Write-Host "     cloudflared access rdp --hostname $publicUrl --url rdp://localhost:13389" -ForegroundColor White
              Write-Host "  3. Open mstsc and connect to: localhost:13389" -ForegroundColor Magenta
          } else {
              Write-Host "  Failed to get Cloudflare Tunnel URL." -ForegroundColor Red
              Get-Content $logFile -ErrorAction SilentlyContinue
              Get-Content "C:\cloudflared_error.log" -ErrorAction SilentlyContinue
          }
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Alive
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
