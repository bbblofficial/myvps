name: Windows Cloud RDP - Free Tunnel Multi-Options (No Auth Required)

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Choose Tunnel Provider (All Free - No API Keys Needed)'
        required: true
        default: 'pinggy-free'
        type: choice
        options:
          - 'pinggy-free'
          - 'playit-free'
          - 'bore-pub'
          - 'serveo'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ======================================================================
      # Step 1: Setup RDP and ensure port 3389 is open
      # ======================================================================
      - name: 1. Setup RDP and User
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "Setting up Remote Desktop..." -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Write-Host "Verifying RDP Port 3389..." -ForegroundColor Yellow
          $portReady = $false
          for ($i = 0; $i -lt 15; $i++) {
              $check = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
              if ($check.TcpTestSucceeded) {
                  $portReady = $true
                  Write-Host "Port 3389 is OPEN and READY!" -ForegroundColor Green
                  break
              }
              Start-Sleep -Seconds 1
          }
          if (-not $portReady) {
              Write-Host "[!] Port 3389 failed to bind." -ForegroundColor Red
              exit 1
          }

      # ======================================================================
      # Option 1: Pinggy Free TCP (SSH reverse tunnel, no auth)
      # ======================================================================
      - name: 2a. Launch Pinggy Free Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'pinggy-free' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Pinggy Free SSH Tunnel (TCP)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Endpoint: a.pinggy.io (No API key required)" -ForegroundColor Yellow
          Write-Host "Method: SSH reverse TCP tunnel" -ForegroundColor Yellow

          $logOut = "C:\pinggy_out.log"
          $logErr = "C:\pinggy_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          $sshArgs = "-p 443 -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -R 0:127.0.0.1:3389 tcp@a.pinggy.io"

          Write-Host "Establishing SSH connection to a.pinggy.io..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for Pinggy tunnel address..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(90)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "SSH process exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $logOut) { Write-Host "--- STDOUT ---" -ForegroundColor Red; Get-Content $logOut }
                  if (Test-Path $logErr) { Write-Host "--- STDERR ---" -ForegroundColor Red; Get-Content $logErr }
                  exit 1
              }

              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "tcp://([a-zA-Z0-9\.\-]+:\d+)") {
                  $tunnelAddr = $matches[1]
                  Write-Host "Tunnel address received!" -ForegroundColor Green
                  break
              }
              if ($fullText -match "([a-zA-Z0-9\.\-]+\.pinggy\.(io|link):\d+)") {
                  $tunnelAddr = $matches[1]
                  Write-Host "Tunnel address received (alt format)!" -ForegroundColor Green
                  break
              }

              if ($attempts % 10 -eq 0) {
                  Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray
              }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) {
              Write-Host "[X] Could not get Pinggy tunnel address" -ForegroundColor Red
              if (Test-Path $logOut) { Write-Host "--- STDOUT ---" -ForegroundColor Red; Get-Content $logOut }
              if (Test-Path $logErr) { Write-Host "--- STDERR ---" -ForegroundColor Red; Get-Content $logErr }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] PINGGY FREE RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Connection Method:" -ForegroundColor Magenta
          Write-Host "  1. Open Remote Desktop (mstsc)" -ForegroundColor White
          Write-Host "  2. Connect to: $tunnelAddr" -ForegroundColor White
          Write-Host "  3. Username: CynetAdmin" -ForegroundColor White
          Write-Host "  4. Password: Cynet@2026" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[!] NOTE: Pinggy free has a 60-minute timeout" -ForegroundColor Yellow
          Write-Host "If disconnected, restart the workflow" -ForegroundColor Yellow

      # ======================================================================
      # Option 2: Playit Free (anonymous TCP tunnel, works for RDP)
      # ======================================================================
      - name: 2b. Launch Playit Free Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'playit-free' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Playit Free Tunnel" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          Write-Host "Downloading Playit agent..." -ForegroundColor Cyan
          try {
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" `
                  -OutFile "C:\playit.exe" -ErrorAction Stop
              Write-Host "Playit agent downloaded successfully" -ForegroundColor Green
          } catch {
              Write-Host "Failed to download Playit: $_" -ForegroundColor Red
              exit 1
          }

          $playitOut = "C:\playit_out.log"
          $playitErr = "C:\playit_err.log"
          Remove-Item $playitOut, $playitErr -Force -ErrorAction SilentlyContinue

          Write-Host "Starting Playit agent..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath "C:\playit.exe" `
              -RedirectStandardOutput $playitOut -RedirectStandardError $playitErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for Playit claim URL..." -ForegroundColor Yellow
          $claimUrl = $null
          $timeout = [DateTime]::Now.AddSeconds(120)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "Playit process exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $playitErr) { Get-Content $playitErr }
                  exit 1
              }
              $outText = if (Test-Path $playitOut) { Get-Content -Path $playitOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $playitErr) { Get-Content -Path $playitErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "(https://playit\.gg/claim/[a-zA-Z0-9_\-]+)") {
                  $claimUrl = $matches[1]
                  Write-Host "Playit claim URL received!" -ForegroundColor Green
                  break
              }
              if ($attempts % 10 -eq 0) {
                  Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray
              }
              Start-Sleep -Seconds 1
          }

          if (-not $claimUrl) {
              Write-Host "[X] Could not get Playit claim URL" -ForegroundColor Red
              if (Test-Path $playitOut) { Write-Host "=== PLAYIT STDOUT ===" -ForegroundColor Red; Get-Content $playitOut }
              if (Test-Path $playitErr) { Write-Host "=== PLAYIT STDERR ===" -ForegroundColor Red; Get-Content $playitErr }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] PLAYIT FREE TUNNEL CLAIM URL" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Claim Link      : $claimUrl" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Setup Instructions:" -ForegroundColor Magenta
          Write-Host "  1. Open this link in browser:" -ForegroundColor White
          Write-Host "     $claimUrl" -ForegroundColor Cyan
          Write-Host "  2. Click 'Claim Tunnel'" -ForegroundColor White
          Write-Host "  3. Set port 3389 (RDP)" -ForegroundColor White
          Write-Host "  4. You will get a direct address (e.g. x.tcp.playit.gg:12345)" -ForegroundColor White
          Write-Host "  5. Connect RDP to that address" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      # ======================================================================
      # Option 3: bore.pub (simple TCP tunnel, no auth)
      # ======================================================================
      - name: 2c. Launch bore.pub Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'bore-pub' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting bore.pub Tunnel (TCP)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          $zip = "C:\bore.zip"
          $dir = "C:\bore"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Downloading bore..." -ForegroundColor Cyan
          try {
              Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" `
                  -OutFile $zip -ErrorAction Stop
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              Write-Host "bore downloaded and extracted" -ForegroundColor Green
          } catch {
              Write-Host "Failed to download bore: $_" -ForegroundColor Red
              exit 1
          }

          $boreExe = Get-ChildItem -Path $dir -Filter "bore.exe" -Recurse | Select-Object -First 1
          if (-not $boreExe) {
              Write-Host "bore.exe not found in archive" -ForegroundColor Red
              Get-ChildItem $dir -Recurse | Format-Table
              exit 1
          }

          $logOut = "C:\bore_out.log"
          $logErr = "C:\bore_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          Write-Host "Starting bore local 3389 --to bore.pub ..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath $boreExe.FullName -ArgumentList @("local","3389","--to","bore.pub") `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for bore tunnel address..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(60)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "bore process exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $logErr) { Get-Content $logErr }
                  exit 1
              }
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "bore\.pub:(\d+)") {
                  $tunnelAddr = "bore.pub:$($matches[1])"
                  Write-Host "Tunnel address received!" -ForegroundColor Green
                  break
              }
              if ($attempts % 10 -eq 0) {
                  Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray
              }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) {
              Write-Host "[X] Could not get bore tunnel address" -ForegroundColor Red
              if (Test-Path $logOut) { Write-Host "--- STDOUT ---" -ForegroundColor Red; Get-Content $logOut }
              if (Test-Path $logErr) { Write-Host "--- STDERR ---" -ForegroundColor Red; Get-Content $logErr }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] BORE.PUB RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  1. Open Remote Desktop (mstsc)" -ForegroundColor White
          Write-Host "  2. Connect to: $tunnelAddr" -ForegroundColor White
          Write-Host "  3. Username: CynetAdmin" -ForegroundColor White
          Write-Host "  4. Password: Cynet@2026" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      # ======================================================================
      # Option 4: Serveo (SSH reverse tunnel, no auth, TCP)
      # ======================================================================
      - name: 2d. Launch Serveo Tunnel
        if: ${{ github.event.inputs.tunnel_provider == 'serveo' }}
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=====================================================" -ForegroundColor Green
          Write-Host "Starting Serveo Tunnel (TCP over SSH)" -ForegroundColor Cyan
          Write-Host "=====================================================" -ForegroundColor Green

          $logOut = "C:\serveo_out.log"
          $logErr = "C:\serveo_err.log"
          Remove-Item $logOut, $logErr -Force -ErrorAction SilentlyContinue

          $sshArgs = "-T -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -R 0:127.0.0.1:3389 serveo.net"

          Write-Host "Establishing SSH connection to serveo.net..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
              -NoNewWindow -PassThru

          Write-Host "Waiting for Serveo tunnel address..." -ForegroundColor Yellow
          $tunnelAddr = $null
          $timeout = [DateTime]::Now.AddSeconds(60)
          $attempts = 0

          while ([DateTime]::Now -lt $timeout) {
              $attempts++
              if ($proc.HasExited) {
                  Write-Host "SSH process exited with code: $($proc.ExitCode)" -ForegroundColor Red
                  if (Test-Path $logErr) { Get-Content $logErr }
                  exit 1
              }
              $outText = if (Test-Path $logOut) { Get-Content -Path $logOut -Raw -ErrorAction SilentlyContinue } else { "" }
              $errText = if (Test-Path $logErr) { Get-Content -Path $logErr -Raw -ErrorAction SilentlyContinue } else { "" }
              $fullText = "$outText`n$errText" -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

              if ($fullText -match "serveo\.net:(\d+)") {
                  $tunnelAddr = "serveo.net:$($matches[1])"
                  Write-Host "Tunnel address received!" -ForegroundColor Green
                  break
              }
              if ($attempts % 10 -eq 0) {
                  Write-Host "[Waiting...] $attempts seconds elapsed" -ForegroundColor Gray
              }
              Start-Sleep -Seconds 1
          }

          if (-not $tunnelAddr) {
              Write-Host "[X] Could not get Serveo tunnel address" -ForegroundColor Red
              if (Test-Path $logOut) { Write-Host "--- STDOUT ---" -ForegroundColor Red; Get-Content $logOut }
              if (Test-Path $logErr) { Write-Host "--- STDERR ---" -ForegroundColor Red; Get-Content $logErr }
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "[OK] SERVEO RDP TUNNEL ACTIVE" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tunnel Address  : $tunnelAddr" -ForegroundColor Yellow
          Write-Host "RDP Username    : CynetAdmin" -ForegroundColor Yellow
          Write-Host "RDP Password    : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  1. Open Remote Desktop (mstsc)" -ForegroundColor White
          Write-Host "  2. Connect to: $tunnelAddr" -ForegroundColor White
          Write-Host "  3. Username: CynetAdmin" -ForegroundColor White
          Write-Host "  4. Password: Cynet@2026" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      # ======================================================================
      # Step 3: Keep tunnel process and session alive until timeout
      # ======================================================================
      - name: 3. Keep Tunnel Alive
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ""
          Write-Host "Tunnel is active! Session will remain open..." -ForegroundColor Green
          Write-Host ""
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/350 min] Tunnel still active - RDP session available" -ForegroundColor Green
          }
          Write-Host "Workflow timeout reached. Tunnel session ending." -ForegroundColor Yellow
