          .send:hover:not(:disabled){background:var(--accent-h)}
          .send:active:not(:disabled){transform:scale(.93)}
          .send:disabled{opacity:.35;cursor:not-allowed}
          .send.stop{background:var(--text);color:var(--bg)}
          .fine{text-align:center;font-size:12px;color:var(--text3);margin-top:9px}

          .page{flex:1;overflow-y:auto}
          .page-in{max-width:960px;margin:0 auto;padding:10px 24px 60px}
