name: PolyGuard Web + Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: polyguard-deploy
  cancel-in-progress: true

env:
  # ✅ PyTorch-compatible multilingual model (supports Persian)
  MODEL_ID: unitary/multilingual-toxic-xlm-roberta
  MODEL_DIR: ${{ github.workspace }}/models/polyguard

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ FIXED: protobuf is required by sentencepiece to parse the tokenizer
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet fastapi "uvicorn[standard]" transformers sentencepiece protobuf tiktoken

      - name: Download model to local folder
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir=os.environ["MODEL_DIR"],
              ignore_patterns=["*.h5", "*.msgpack", "*.onnx", "*.tflite", "*.ot"],
          )
          print("✔ Model downloaded")
          PY
          ls -lh "$MODEL_DIR"
          du -sh "$MODEL_DIR"

      - name: Create PolyGuard app files
        run: |
          mkdir -p app/static

          # ---------- backend ----------
          cat > app/main.py << 'PYEOF'
          import os
          os.environ["TOKENIZERS_PARALLELISM"] = "false"
          os.environ["HF_HUB_OFFLINE"] = "1"
          os.environ["TRANSFORMERS_OFFLINE"] = "1"

          from contextlib import asynccontextmanager
          from pathlib import Path
          from fastapi import FastAPI
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import FileResponse
          from pydantic import BaseModel
          from transformers import pipeline

          BASE_DIR  = Path(__file__).resolve().parent
          MODEL_DIR = Path(os.environ["POLYGUARD_MODEL_DIR"])
          TOXIC_THRESHOLD = float(os.environ.get("TOXIC_THRESHOLD", "0.5"))

          class TextIn(BaseModel):
              text: str

          state = {"classifier": None, "error": None}

          def load_classifier():
              print(f"[PolyGuard] Loading model from {MODEL_DIR}", flush=True)
              state["classifier"] = pipeline(
                  "text-classification",
                  model=str(MODEL_DIR),
                  tokenizer=str(MODEL_DIR),
                  top_k=None,
              )
              print("[PolyGuard] Model loaded ✔", flush=True)

          @asynccontextmanager
          async def lifespan(app: FastAPI):
              try:
                  load_classifier()
              except Exception as exc:
                  state["error"] = str(exc)
                  print(f"[PolyGuard] Model failed to load: {exc}", flush=True)
              yield

          app = FastAPI(title="PolyGuard Web", lifespan=lifespan)

          @app.get("/health")
          def health():
              if state["error"]:
                  return {"status": "error", "detail": state["error"]}
              if state["classifier"] is None:
                  return {"status": "loading"}
              return {"status": "ok"}

          @app.post("/api/check")
          async def check(data: TextIn):
              if state["classifier"] is None:
                  return {"error": state["error"] or "model still loading"}
              results = state["classifier"](data.text, truncation=True, max_length=512)[0]
              # For multi-label models, find the highest score
              top = max(results, key=lambda r: r["score"])
              is_toxic = top["score"] >= TOXIC_THRESHOLD
              return {"toxic": is_toxic, "label": top["label"], "score": float(top["score"])}

          @app.get("/")
          def index():
              return FileResponse(BASE_DIR / "static" / "index.html")

          app.mount("/static", StaticFiles(directory=str(BASE_DIR / "static")), name="static")
          PYEOF

          # ---------- frontend ----------
          cat > app/static/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>PolyGuard — تشخیص محتوای سمی</title>
            <link rel="stylesheet" href="/static/style.css" />
          </head>
          <body>
            <div class="card">
              <header>
                <h1>🛡️ PolyGuard</h1>
                <p>تشخیص محتوای سمی و غیراخلاقی در چند زبان</p>
              </header>
              <textarea id="txt" placeholder="متن خود را اینجا بنویسید..."></textarea>
              <button id="btn">بررسی کن</button>
              <div id="out" class="out hidden"></div>
              <footer>Powered by unitary/multilingual-toxic-xlm-roberta</footer>
            </div>
            <script src="/static/script.js"></script>
          </body>
          </html>
          HTMLEOF

          cat > app/static/style.css << 'CSSEOF'
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
          .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:700px;width:100%;padding:40px}
          header{text-align:center;margin-bottom:24px}
          h1{font-size:2.2rem;color:#222;margin-bottom:8px}
          header p{color:#666}
          textarea{width:100%;height:150px;padding:14px;border:2px solid #e0e0e0;border-radius:12px;font-size:1rem;font-family:inherit;resize:vertical;transition:.3s}
          textarea:focus{outline:0;border-color:#667eea}
          button{width:100%;padding:14px;margin-top:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:0;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s}
          button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.35)}
          button:disabled{opacity:.6;cursor:wait}
          .out{margin-top:20px;padding:16px;border-radius:12px;font-weight:600;text-align:center}
          .out.hidden{display:none}
          .out.safe{background:#e6ffed;color:#046b2b;border:1px solid #b7f0c8}
          .out.toxic{background:#ffe6e6;color:#a30000;border:1px solid #ffb3b3}
          footer{text-align:center;margin-top:24px;color:#999;font-size:.85rem}
          CSSEOF

          cat > app/static/script.js << 'JSEOF'
          const txt = document.getElementById("txt");
          const btn = document.getElementById("btn");
          const out = document.getElementById("out");

          async function check() {
            const text = txt.value.trim();
            if (!text) return;
            btn.disabled = true;
            out.className = "out";
            out.textContent = "⏳ در حال بررسی...";
            try {
              const r = await fetch("/api/check", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
              });
              const d = await r.json();
              if (d.error) {
                out.className = "out toxic";
                out.textContent = `⚠ ${d.error}`;
                return;
              }
              const pct = (d.score * 100).toFixed(1);
              out.className = d.toxic ? "out toxic" : "out safe";
              out.textContent = d.toxic
                ? `🚫 محتوای سمی (اطمینان: ${pct}%)`
                : `✅ محتوای سالم (اطمینان: ${pct}%)`;
            } catch (e) {
              out.className = "out toxic";
              out.textContent = "خطا در ارتباط با سرور";
            } finally {
              btn.disabled = false;
            }
          }
          btn.addEventListener("click", check);
          txt.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "Enter") check();
          });
          JSEOF

          echo "✔ All files created"

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start FastAPI server
        env:
          POLYGUARD_MODEL_DIR: ${{ env.MODEL_DIR }}
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo "Waiting for server..."
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(curl -fs http://localhost:8000/health 2>/dev/null || true)
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "✔ Server healthy after ${i} checks"; break
            fi
            if echo "$STATUS" | grep -q '"status":"error"'; then
              echo "❌ Model failed to load:"; echo "$STATUS"
              tail -n 60 server.log || true; exit 1
            fi
            sleep 2
          done
          echo "$STATUS"
          echo "$STATUS" | grep -q '"status":"ok"' || { tail -n 60 server.log; exit 1; }

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "❌ No tunnel URL"; cat tunnel.log; exit 1; }
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "### 🌐 PolyGuard is live at: $URL" >> $GITHUB_STEP_SUMMARY
          echo "🔗 $URL"

      - name: Keep service alive
        env:
          POLYGUARD_MODEL_DIR: ${{ env.MODEL_DIR }}
        run: |
          echo "Running at: $PUBLIC_URL"
          for i in $(seq 1 300); do
            sleep 60
            pgrep -f "uvicorn app.main:app" >/dev/null || {
              echo "⚠ Uvicorn died, restarting..."
              POLYGUARD_MODEL_DIR="$POLYGUARD_MODEL_DIR" \
                nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 >> server.log 2>&1 &
            }
            pgrep -f "cloudflared tunnel" >/dev/null || {
              echo "⚠ Cloudflared died, restarting..."
              nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate >> tunnel.log 2>&1 &
            }
          done
