          .chat-scroll{flex:1;overflow-y:auto}
          .chat-col{max-width:760px;margin:0 auto;padding:8px 24px 28px;min-height:100%;display:flex;flex-direction:column}
          .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6vh 0 4vh;text-align:center;animation:rise .5s var(--ease)}
          .hero-logo{width:44px;height:44px;color:var(--accent);stroke-width:2}
          .hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,42px);letter-spacing:-.015em;line-height:1.15}
          .hero p{color:var(--text2);max-width:440px;line-height:1.55}
          .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
          .chip{padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text2);font-size:13.5px;transition:all .15s}
          .chip:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px)}
          .notice{display:flex;align-items:center;gap:14px;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;max-width:480px;box-shadow:var(--shadow)}
          .notice b{font-weight:600}
          .notice div{flex:1;font-size:14px;color:var(--text2);line-height:1.5}
          .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:500;font-size:13.5px;transition:opacity .15s,transform .15s,background .15s;white-space:nowrap}
          .btn:hover{opacity:.88}
          .btn:active{transform:scale(.97)}
          .btn.accent{background:var(--accent);color:#fff}
          .btn.accent:hover{background:var(--accent-h);opacity:1}
          .btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
          .btn.ghost:hover{background:var(--hover);color:var(--text);opacity:1}
          .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border2)}
          .btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);opacity:1}
          .btn:disabled{opacity:.45;cursor:not-allowed}

          .turn{margin:14px 0;animation:rise .35s var(--ease)}
          @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          .u-bubble{background:var(--user);border-radius:18px;padding:10px 16px;width:fit-content;max-width:88%;margin-left:auto;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
          .a-body{font-family:var(--serif);font-size:16.5px;line-height:1.72;overflow-wrap:anywhere}
          .md>*:first-child{margin-top:0}
          .md p{margin:0 0 14px}
          .md p:last-child{margin-bottom:0}
          .md h1,.md h2,.md h3,.md h4{font-family:var(--serif);font-weight:600;line-height:1.3;margin:22px 0 8px}
          .md h1{font-size:1.45em}.md h2{font-size:1.28em}.md h3{font-size:1.12em}.md h4{font-size:1em}
          .md ul,.md ol{margin:0 0 14px 1.4em}
          .md li{margin:4px 0;padding-left:2px}
          .md li>p{margin:0}
          .md blockquote{border-left:3px solid var(--border2);padding:2px 0 2px 16px;color:var(--text2);margin:0 0 14px}
          .md a{color:var(--accent);text-underline-offset:3px}
          .md hr{border:none;border-top:1px solid var(--border);margin:20px 0}
          .md strong{font-weight:600}
          .md :not(pre)>code{font-family:var(--mono);font-size:.84em;background:var(--hover);border:1px solid var(--border);padding:1px 6px;border-radius:6px}
          .table-wrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--border);border-radius:12px}
          .md table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14px}
