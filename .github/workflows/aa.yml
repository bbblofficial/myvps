                          <div class="flex justify-between items-center p-3 bg-gray-100 dark:bg-gpt-main rounded-xl">
                              <span class="text-gray-500 dark:text-gray-400">Voting mode</span>
                              <span class="font-mono font-semibold">max_weighted</span>
                          </div>
                          <div class="p-3 bg-gray-100 dark:bg-gpt-main rounded-xl">
                              <div class="text-gray-500 dark:text-gray-400 mb-2">Loaded models</div>
                              <div id="cfg-models" class="space-y-1 text-[11px] font-mono"></div>
                          </div>
                      </div>
                      <div class="pt-2 border-t border-gray-200 dark:border-white/10 flex items-center justify-between">
                          <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-400 font-medium flex items-center gap-1.5">
                              <i class="fa-regular fa-trash-can"></i>
                              <span>Clear history</span>
                          </button>
                          <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-xl bg-gpt-accent text-white text-xs font-semibold hover:opacity-95 transition">Close</button>
                      </div>
                  </div>
              </div>

              <!-- Toast -->
              <div id="toast" class="fixed top-4 right-4 z-50 hidden bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2">
                  <i class="fa-solid fa-circle-check text-emerald-500"></i>
                  <span id="toast-message">Copied</span>
              </div>

              <script src="/static/script.js"></script>
          </body>
          </html>
          HTMLEOF

          # ============================================================
          # FRONTEND SCRIPT
          # ============================================================
          cat > app/static/script.js << 'JSEOF'
          /**************************************************************
           * STATE
           **************************************************************/
          const state = {
            history: [],
            activeId: null,
            sidebarOpen: true,
            isAnalyzing: false,
            health: null
          };

          const STORAGE_KEY = 'polyguard_history_v1';

          /**************************************************************
           * INIT
           **************************************************************/
          window.onload = function () {
            loadHistory();
            renderHistoryList();
            renderActive();
            setupScrollWatcher();
            checkHealth();
            setInterval(checkHealth, 15000);
            if (window.innerWidth > 768) document.getElementById('prompt-input').focus();
          };

          /**************************************************************
           * PERSISTENCE
           **************************************************************/
          function loadHistory() {
            try {
              const saved = localStorage.getItem(STORAGE_KEY);
              if (saved) {
                const parsed = JSON.parse(saved);
                state.history = parsed.history || [];
                state.activeId = parsed.activeId || null;
              }
            } catch (e) { console.warn(e); }
          }
          function saveHistory() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({
                history: state.history, activeId: state.activeId
              }));
            } catch (e) { console.warn(e); }
          }

          /**************************************************************
           * HEALTH CHECK
           **************************************************************/
          async function checkHealth() {
            const dot = document.getElementById('health-dot');
            const txt = document.getElementById('health-text');
            try {
              const r = await fetch('/health');
              const d = await r.json();
              state.health = d;
              if (d.status === 'ok') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                txt.textContent = `${d.loaded_models.length}/5 models ready`;
              } else if (d.status === 'loading') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
                txt.textContent = `loading… (${(d.loaded||[]).length}/5)`;
              } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500';
                txt.textContent = 'error';
              }
              // Update settings modal
              const cfgT = document.getElementById('cfg-toxic');
              const cfgS = document.getElementById('cfg-suspect');
              const cfgM = document.getElementById('cfg-models');
              if (cfgT && d.toxic_threshold) cfgT.textContent = d.toxic_threshold;
              if (cfgS && d.suspect_threshold) cfgS.textContent = d.suspect_threshold;
              if (cfgM && d.loaded_models) {
                cfgM.innerHTML = d.loaded_models.map(m => `✅ ${m}`).join('<br>') +
                  (d.errors && Object.keys(d.errors).length ? '<br>❌ ' + Object.keys(d.errors).join(', ') : '');
              }
            } catch (e) {
              dot.className = 'w-2 h-2 rounded-full bg-red-500';
              txt.textContent = 'offline';
            }
          }

          /**************************************************************
           * SIDEBAR
           **************************************************************/
          function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('mobile-backdrop');
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
              const hidden = sidebar.classList.contains('-translate-x-full');
              if (hidden) { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); }
              else { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); }
            } else {
              state.sidebarOpen = !state.sidebarOpen;
              if (state.sidebarOpen) sidebar.classList.remove('md:-ml-[260px]');
              else sidebar.classList.add('md:-ml-[260px]');
            }
          }

          function createNewAnalysis() {
            if (state.isAnalyzing) return;
            state.activeId = null;
            saveHistory();
            renderHistoryList();
            renderActive();
            document.getElementById('prompt-input').focus();
          }

          function selectAnalysis(id) {
            if (state.isAnalyzing) return;
            state.activeId = id;
            saveHistory();
            renderHistoryList();
            renderActive();
            if (window.innerWidth < 768) toggleSidebar();
          }

          function deleteAnalysis(event, id) {
            event.stopPropagation();
            state.history = state.history.filter(h => h.id !== id);
            if (state.activeId === id) state.activeId = null;
            saveHistory();
            renderHistoryList();
            renderActive();
            showToast('Deleted');
          }

          function clearHistory() {
            if (!confirm('Clear all history?')) return;
            state.history = [];
            state.activeId = null;
            saveHistory();
            renderHistoryList();
            renderActive();
            closeSettingsModal();
            showToast('History cleared');
          }

          function renderHistoryList() {
            const el = document.getElementById('history-list');
            const q = (document.getElementById('search-chats').value || '').toLowerCase().trim();
            const filtered = state.history
              .filter(h => (h.text || '').toLowerCase().includes(q))
              .sort((a, b) => b.ts - a.ts);

            if (!filtered.length) {
              el.innerHTML = `<div class="text-center py-8 px-3 text-xs text-gray-400">
                ${q ? 'No matching analyses' : 'No history yet'}</div>`;
              return;
            }

            let html = `<div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-gray-400">Recent analyses</div>`;
            filtered.forEach(h => {
              const isActive = h.id === state.activeId;
              const icon = h.result?.decision === 'TOXIC' ? '🚫'
                         : h.result?.decision === 'SUSPECT' ? '⚠️' : '✅';
              const preview = (h.text || '').slice(0, 32) + ((h.text || '').length > 32 ? '…' : '');
              html += `
                <div onclick="selectAnalysis('${h.id}')" class="group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition-colors ${isActive ? 'bg-gray-200 dark:bg-gpt-hover text-gray-900 dark:text-white font-medium' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gpt-hover/60'}">
                  <div class="flex items-center gap-2.5 truncate pr-2">
                    <span class="text-xs">${icon}</span>
                    <span class="truncate text-xs sm:text-sm">${escapeHtml(preview || 'analysis')}</span>
                  </div>
                  <button onclick="deleteAnalysis(event, '${h.id}')" class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-400">
                    <i class="fa-regular fa-trash-can text-xs"></i>
                  </button>
                </div>`;
            });
            el.innerHTML = html;
          }

          /**************************************************************
           * RENDER
           **************************************************************/
          function renderActive() {
            const welcome = document.getElementById('welcome-screen');
            const stream  = document.getElementById('chat-stream');
            const active  = state.history.find(h => h.id === state.activeId);
            if (!active) {
              welcome.classList.remove('hidden');
              stream.classList.add('hidden');
              stream.innerHTML = '';
              return;
            }
            welcome.classList.add('hidden');
            stream.classList.remove('hidden');
            stream.innerHTML = buildAnalysisHTML(active);
            scrollToBottom(false);
          }

          function buildAnalysisHTML(item) {
            const userBubble = `
              <div class="flex flex-col items-end w-full animate-fadeIn">
                <div class="max-w-[85%] sm:max-w-[75%] bg-gray-100 dark:bg-gpt-userBubble text-gray-800 dark:text-gray-100 px-4 py-3 rounded-3xl rounded-br-lg text-sm sm:text-base leading-relaxed whitespace-pre-wrap break-words rtl">${escapeHtml(item.text)}</div>
              </div>`;

            const r = item.result;
            if (!r || r.error) {
              return userBubble + `
                <div class="flex animate-fadeIn">
                  <div class="max-w-full bg-red-500/10 border border-red-500/30 text-red-500 px-4 py-3 rounded-2xl text-sm">
                    ⚠ ${escapeHtml(r?.error || 'no result')}
                  </div>
                </div>`;
            }

            const colorMap = {
              TOXIC:   { bg: 'bg-red-500/10',    border: 'border-red-500/30',    text: 'text-red-500',    icon: '🚫', label: 'محتوای سمی' },
              SUSPECT: { bg: 'bg-amber-500/10',  border: 'border-amber-500/30',  text: 'text-amber-500',  icon: '⚠️', label: 'مشکوک — نیاز به بازبینی' },
              SAFE:    { bg: 'bg-emerald-500/10',border: 'border-emerald-500/30',text: 'text-emerald-500',icon: '✅', label: 'محتوای سالم' }
            };
            const c = colorMap[r.decision];

            // Decision banner
            const banner = `
              <div class="${c.bg} ${c.border} border rounded-2xl px-5 py-4 animate-fadeIn">
                <div class="flex items-center justify-between flex-wrap gap-3">
                  <div class="flex items-center gap-3">
                    <span class="text-3xl">${c.icon}</span>
                    <div>
                      <div class="${c.text} font-bold text-lg">${c.label}</div>
                      <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                        حداکثر امتیاز وزنی: <span class="font-mono font-semibold">${(r.max_weighted*100).toFixed(1)}%</span>
                        · آستانه سمی: <span class="font-mono">${r.toxic_threshold}</span>
                        · ${r.total_models} مدل
                      </div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-[10px] uppercase tracking-wider text-gray-400">Max weighted</div>
                    <div class="font-mono font-bold ${c.text} text-xl">${(r.max_weighted*100).toFixed(1)}%</div>
                  </div>
                </div>
              </div>`;

            // Per-model breakdown
            const rows = Object.keys(r.raw_scores).map(name => {
              const raw = r.raw_scores[name];
              const w   = r.weighted_scores[name];
              const lbl = r.labels?.[name] || name;
              const flagged = w >= r.toxic_threshold;
              const suspect = !flagged && w >= r.suspect_threshold;
              const cls   = flagged ? 'text-red-500' : suspect ? 'text-amber-500' : 'text-emerald-500';
              const bgbar = flagged ? 'bg-red-500' : suspect ? 'bg-amber-500' : 'bg-emerald-500';
              const pct   = Math.min(100, w * 100);
              const rawPct = Math.min(100, raw * 100);
              return `
                <div class="py-3 border-b border-gray-200 dark:border-white/5 last:border-0">
                  <div class="flex items-center justify-between mb-2">
                    <div class="text-xs font-semibold text-gray-700 dark:text-gray-200">${escapeHtml(lbl)}</div>
                    <div class="flex items-center gap-3 text-[11px] font-mono">
                      <span class="text-gray-400">raw ${(raw*100).toFixed(1)}%</span>
                      <span class="${cls} font-bold">${(w*100).toFixed(1)}%</span>
                    </div>
                  </div>
                  <div class="w-full h-1.5 bg-gray-200 dark:bg-white/5 rounded-full overflow-hidden">
                    <div class="${bgbar} h-full score-bar" style="width: ${rawPct}%"></div>
                  </div>
                </div>`;
            }).join('');

            const breakdown = `
              <div class="bg-gray-50 dark:bg-gpt-input/40 border border-gray-200 dark:border-white/10 rounded-2xl p-4 animate-fadeIn">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Model breakdown</h3>
                  <button onclick="copyJSON('${item.id}')" class="text-[11px] text-gray-400 hover:text-gpt-accent flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> copy JSON
                  </button>
                </div>
                ${rows}
              </div>`;

            const meta = `
              <div class="text-[10px] text-gray-400 dark:text-gray-500 text-center">
                ${new Date(item.ts).toLocaleString()}
              </div>`;

            return `
              ${userBubble}
              <div class="flex flex-col gap-3 animate-fadeIn">${banner}${breakdown}${meta}</div>`;
          }

          /**************************************************************
           * ANALYZE
           **************************************************************/
          async function analyze() {
            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text || state.isAnalyzing) return;

            state.isAnalyzing = true;
            setSendDisabled(true);
            showLoadingBubble(text);

            try {
              const r = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
              });
              const result = await r.json();

              const item = {
                id: 'an_' + Date.now(),
                text,
                result,
                ts: Date.now()
              };
              state.history.unshift(item);
              state.activeId = item.id;
              saveHistory();
              renderHistoryList();
              renderActive();
              input.value = '';
              autoResize(input);
              updateCharCounter();
            } catch (e) {
              showToast('Server error');
            } finally {
              state.isAnalyzing = false;
              setSendDisabled(false);
              document.getElementById('prompt-input').focus();
            }
          }

          function showLoadingBubble(text) {
            const welcome = document.getElementById('welcome-screen');
            const stream  = document.getElementById('chat-stream');
            welcome.classList.add('hidden');
            stream.classList.remove('hidden');
            stream.innerHTML = `
              <div class="flex flex-col items-end w-full">
                <div class="max-w-[85%] bg-gray-100 dark:bg-gpt-userBubble text-gray-800 dark:text-gray-100 px-4 py-3 rounded-3xl rounded-br-lg text-sm whitespace-pre-wrap rtl">${escapeHtml(text)}</div>
              </div>
              <div class="flex items-center gap-2 text-gray-400 text-sm animate-fadeIn">
                <div class="w-2 h-2 rounded-full bg-gpt-accent typing-dot"></div>
                <div class="w-2 h-2 rounded-full bg-gpt-accent typing-dot"></div>
                <div class="w-2 h-2 rounded-full bg-gpt-accent typing-dot"></div>
                <span class="text-xs mr-2">5 models analyzing…</span>
              </div>`;
            scrollToBottom(true);
          }

          /**************************************************************
           * INPUT
           **************************************************************/
          function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 192) + 'px';
            updateCharCounter();
            const btn = document.getElementById('send-btn');
            btn.disabled = !el.value.trim() || state.isAnalyzing;
          }
          function updateCharCounter() {
            const v = document.getElementById('prompt-input').value;
            const c = document.getElementById('char-counter');
            if (v.length > 0) { c.textContent = v.length + ' chars'; c.classList.remove('hidden'); }
            else c.classList.add('hidden');
          }
          function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); analyze(); }
          }
          function setSendDisabled(v) {
            document.getElementById('send-btn').disabled = v;
          }
          function useStarter(text) {
            const input = document.getElementById('prompt-input');
            input.value = text;
            autoResize(input);
            input.focus();
          }

          /**************************************************************
           * UTILITIES
           **************************************************************/
          function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
              '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[ch]));
          }
          function scrollToBottom(smooth) {
            const el = document.getElementById('messages-container');
            el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
          }
          function setupScrollWatcher() {
            const el = document.getElementById('messages-container');
            const btn = document.getElementById('scroll-bottom-btn');
            if (!btn) return;
            el.addEventListener('scroll', () => {
              const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
              btn.classList.toggle('hidden', nearBottom);
            });
          }
          function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2200);
          }
          function copyJSON(id) {
            const item = state.history.find(h => h.id === id);
            if (!item) return;
            navigator.clipboard.writeText(JSON.stringify(item.result, null, 2));
            showToast('Result JSON copied');
          }
          function exportCurrentAnalysis() {
            const item = state.history.find(h => h.id === state.activeId);
            if (!item) { showToast('Nothing to export'); return; }
            const blob = new Blob([JSON.stringify(item, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `polyguard_${item.id}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exported');
          }
          function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.className = root.classList.contains('dark') ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
          }
          function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
          function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
          JSEOF

          echo "✔ All app files created"
          ls -R app

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo "Waiting for 5 models to load (~120-300s)..."
          STATUS=""
          for i in $(seq 1 150); do
            STATUS=$(curl -fs http://localhost:8000/health 2>/dev/null || true)
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "✔ All models loaded after ${i} checks (~$((i*2))s)"
              break
            fi
            if echo "$STATUS" | grep -q '"status":"error"'; then
              echo "❌ All models failed:"
              echo "$STATUS"
              tail -n 80 server.log || true
              exit 1
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "  ... still loading (${i}/150) — $STATUS"
            fi
            sleep 2
          done
          echo "$STATUS"
          if ! echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "❌ Models never became healthy"
            tail -n 100 server.log || true
            exit 1
          fi
          echo "$STATUS" | grep -q '"errors":{}' || echo "⚠ Partial ensemble: $STATUS"

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          echo "Waiting for trycloudflare URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "❌ Could not obtain tunnel URL"
            cat tunnel.log
            exit 1
          fi
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "### 🌐 PolyGuard Ensemble (NexusAI UI) is live at: $URL" >> $GITHUB_STEP_SUMMARY
          echo "🔗 $URL"

      - name: Keep service alive
        run: |
          echo "Service running at: $PUBLIC_URL"
          echo "Will self-terminate after ~5 hours."
          for i in $(seq 1 300); do
            sleep 60
            pgrep -f "uvicorn app.main:app" >/dev/null || {
              echo "⚠ Uvicorn died, restarting..."
              MODELS_ROOT="$MODELS_ROOT" \
              TOXIC_THRESHOLD="$TOXIC_THRESHOLD" \
              SUSPECT_THRESHOLD="$SUSPECT_THRESHOLD" \
                nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 >> server.log 2>&1 &
            }
            pgrep -f "cloudflared tunnel" >/dev/null || {
              echo "⚠ Cloudflared died, restarting..."
              nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate >> tunnel.log 2>&1 &
            }
          done
