name: PolyGuard Web + Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # حداکثر مجاز گیت‌هاب 6 ساعت است

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet fastapi "uvicorn[standard]" transformers torch

      - name: Create PolyGuard app files
        run: |
          mkdir -p app/static

          # ---------- backend ----------
          cat > app/main.py << 'PYEOF'
          from fastapi import FastAPI
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import FileResponse
          from pydantic import BaseModel
          from transformers import pipeline
          import os

          os.environ["TOKENIZERS_PARALLELISM"] = "false"

          app = FastAPI(title="PolyGuard Web")

          class TextIn(BaseModel):
              text: str

          classifier = None

          def get_clf():
              global classifier
              if classifier is None:
                  classifier = pipeline(
                      "text-classification",
                      model="Jayveersinh-Raj/PolyGuard",
                      tokenizer="Jayveersinh-Raj/PolyGuard",
                  )
              return classifier

          @app.on_event("startup")
          def preload():
              get_clf()
              print("[PolyGuard] Model loaded ✔")

          @app.get("/health")
          def health():
              return {"status": "ok"}

          @app.post("/api/check")
          async def check(data: TextIn):
              clf = get_clf()
              res = clf(data.text, truncation=True, max_length=512)[0]
              label = res["label"]
              score = float(res["score"])
              is_toxic = label.upper() in ("LABEL_1", "TOXIC", "1", "TOXICITY")
              return {"toxic": is_toxic, "label": label, "score": score}

          @app.get("/")
          def index():
              return FileResponse("app/static/index.html")

          app.mount("/static", StaticFiles(directory="app/static"), name="static")
          PYEOF

          # ---------- frontend ----------
          cat > app/static/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>PolyGuard — تشخیص محتوای سمی</title>
            <link rel="stylesheet" href="/static/style.css" />
          </head>
          <body>
            <div class="card">
              <header>
                <h1>🛡️ PolyGuard</h1>
                <p>تشخیص محتوای سمی و غیراخلاقی در ۱۰۰+ زبان</p>
              </header>
              <textarea id="txt" placeholder="متن خود را اینجا بنویسید..."></textarea>
              <button id="btn">بررسی کن</button>
              <div id="out" class="out hidden"></div>
              <footer>Powered by Jayveersinh-Raj/PolyGuard</footer>
            </div>
            <script src="/static/script.js"></script>
          </body>
          </html>
          HTMLEOF

          cat > app/static/style.css << 'CSSEOF'
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
          .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:700px;width:100%;padding:40px}
          header{text-align:center;margin-bottom:24px}
          h1{font-size:2.2rem;color:#222;margin-bottom:8px}
          header p{color:#666}
          textarea{width:100%;height:150px;padding:14px;border:2px solid #e0e0e0;border-radius:12px;font-size:1rem;font-family:inherit;resize:vertical;transition:.3s}
          textarea:focus{outline:0;border-color:#667eea}
          button{width:100%;padding:14px;margin-top:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:0;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s}
          button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.35)}
          button:disabled{opacity:.6;cursor:wait}
          .out{margin-top:20px;padding:16px;border-radius:12px;font-weight:600;text-align:center}
          .out.hidden{display:none}
          .out.safe{background:#e6ffed;color:#046b2b;border:1px solid #b7f0c8}
          .out.toxic{background:#ffe6e6;color:#a30000;border:1px solid #ffb3b3}
          footer{text-align:center;margin-top:24px;color:#999;font-size:.85rem}
          CSSEOF

          cat > app/static/script.js << 'JSEOF'
          const txt = document.getElementById("txt");
          const btn = document.getElementById("btn");
          const out = document.getElementById("out");

          async function check() {
            const text = txt.value.trim();
            if (!text) return;
            btn.disabled = true;
            out.className = "out";
            out.textContent = "⏳ در حال بررسی...";
            try {
              const r = await fetch("/api/check", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
              });
              const d = await r.json();
              const pct = (d.score * 100).toFixed(1);
              if (d.toxic) {
                out.className = "out toxic";
                out.textContent = `🚫 محتوای سمی (اطمینان: ${pct}%)`;
              } else {
                out.className = "out safe";
                out.textContent = `✅ محتوای سالم (اطمینان: ${pct}%)`;
              }
            } catch (e) {
              out.className = "out toxic";
              out.textContent = "خطا در ارتباط با سرور";
            } finally {
              btn.disabled = false;
            }
          }

          btn.addEventListener("click", check);
          txt.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "Enter") check();
          });
          JSEOF

          echo "✔ All files created"
          ls -R app

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo "Waiting for server to become healthy..."
          for i in $(seq 1 120); do
            if curl -fs http://localhost:8000/health >/dev/null 2>&1; then
              echo "✔ Server is up after ${i} checks"
              break
            fi
            sleep 3
          done
          curl -s http://localhost:8000/health
          echo
          echo "--- server.log (tail) ---"
          tail -n 30 server.log || true

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          echo "Waiting for trycloudflare URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "❌ Could not obtain tunnel URL"
            cat tunnel.log
            exit 1
          fi

          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "### 🌐 PolyGuard is live at: $URL" >> $GITHUB_STEP_SUMMARY
          echo "🔗 $URL"

      - name: Keep service alive
        run: |
          echo "Service running at: $PUBLIC_URL"
          echo "This job will self-terminate after ~5 hours."
          # به مدت ~5 ساعت زنده نگه دار (زیر سقف 6 ساعته Actions)
          for i in $(seq 1 300); do
            sleep 60
            if ! pgrep -f "uvicorn app.main:app" >/dev/null; then
              echo "⚠ Uvicorn died. Restarting..."
              nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 >> server.log 2>&1 &
            fi
            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "⚠ Cloudflared died. Restarting..."
              nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate >> tunnel.log 2>&1 &
            fi
          done
