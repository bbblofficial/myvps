                              <span id="cfg-toxic" class="font-mono font-semibold">0.05</span>
                          </div>
                          <div class="flex justify-between items-center p-3 bg-gray-100 dark:bg-gpt-main rounded-xl">
                              <span class="text-gray-500 dark:text-gray-400">Suspect threshold</span>
