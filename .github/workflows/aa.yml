            <div id="backdrop" class="backdrop" onclick="toggleSidebar()"></div>

            <!-- ============ MAIN ============ -->
            <main id="main" class="main welcome">
              <header class="topbar">
                <div class="tb-start">
                  <button id="open-sidebar-btn" class="icon-btn" onclick="toggleSidebar()" title="باز کردن نوار کناری"><i data-i="sidebar"></i></button>
                  <button id="new-chat-top-btn" class="icon-btn" onclick="createNewThread()" title="گفتگوی جدید"><i data-i="edit"></i></button>

                  <div class="dd-wrap">
                    <button class="model-btn" onclick="toggleModelDropdown(event)">
                      <span class="model-name">PolyGuard</span>
                      <span class="model-sub">5-Ensemble</span>
