              case 'copy-msg': {
                const turn = el.closest('.turn'); const md = $('.md', turn);
                if(await copyText(md.innerText)) toast('Copied');
                break;
              }
              case 'retry': case 'retry-error': regenerate(); break;
              case 'generate': generateImage(); break;
              case 'custom-install': customInstall(); break;
              case 'pull': pullModel(el.dataset.tag); break;
              case 'cancel-pull': { const st = S.pulls[el.dataset.tag]; if(st && st.ctrl) st.ctrl.abort(); break; }
              case 'del-chat': {
                if(!confirm('Delete ' + el.dataset.name + '?')) break;
                try{ await jfetch('/api/delete', { method:'DELETE', headers:JSON_H, body:JSON.stringify({ model:el.dataset.name }) }); }catch(err){ toast(err.message); }
                await refreshChat(); renderModels(); break;
              }
              case 'img-install': installImage({ id:el.dataset.id }); break;
              case 'cancel-img': try{ await jfetch('/image/models/cancel', { method:'POST', headers:JSON_H, body:JSON.stringify({ key:el.dataset.key }) }); }catch(err){} break;
              case 'use-img': S.imageModel = el.dataset.file; store.set('ua_image_model', S.imageModel); fillImgSelect(); { const m = S.imgInstalled.find(x => x.file === S.imageModel); if(m){ $('#imgSteps').value = m.steps; $('#imgCfg').value = m.cfg; } } renderModels(); break;
              case 'del-img': {
                if(!confirm('Delete ' + el.dataset.file + '?')) break;
                try{ await jfetch('/image/models/delete', { method:'POST', headers:JSON_H, body:JSON.stringify({ file:el.dataset.file }) }); }catch(err){ toast(err.message); }
                await refreshImage(); renderModels(); break;
              }
            }
          });
          document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });

          (async function init(){
            renderChat(); renderConvList(); updateSend();
            await refreshChat();
            if(!S.history.length) chatCol.innerHTML = heroHTML();
            refreshImage();
            if(S.imgInstalled.length){ const m = S.imgInstalled.find(x => x.file === S.imageModel); if(m){ $('#imgSteps').value = m.steps; $('#imgCfg').value = m.cfg; } }
