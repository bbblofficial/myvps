name: PolyGuard Ensemble Web + Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: polyguard-deploy
  cancel-in-progress: true

env:
  # ---- 5-model roster ----
  PERSIAN_MODEL_ID:      HamidRezaei/Persian-Offensive-Language-Detection
  TEXTDETOX_LARGE_ID:    textdetox/twitter-xlmr-toxicity-classifier
  TEXTDETOX_BASE_ID:     textdetox/xlmr-base-toxicity-classifier
  MULTILINGUAL_MODEL_ID: unitary/multilingual-toxic-xlm-roberta
  TWITTER_OFFENSIVE_ID:  cardiffnlp/twitter-roberta-base-offensive

  MODELS_ROOT: ${{ github.workspace }}/models

  # ---- CONCURRENCY: 1 thread per inference ----
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet fastapi "uvicorn[standard]" gunicorn transformers sentencepiece protobuf huggingface_hub anyio

      - name: Download all models to local folders
        run: |
          mkdir -p "$MODELS_ROOT/persian" "$MODELS_ROOT/textdetox_large" "$MODELS_ROOT/textdetox_base" "$MODELS_ROOT/multilingual" "$MODELS_ROOT/twitter_offensive"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          jobs = [
              ("PERSIAN_MODEL_ID",      "persian"),
              ("TEXTDETOX_LARGE_ID",    "textdetox_large"),
              ("TEXTDETOX_BASE_ID",     "textdetox_base"),
              ("MULTILINGUAL_MODEL_ID", "multilingual"),
              ("TWITTER_OFFENSIVE_ID",  "twitter_offensive"),
          ]
          root = os.environ["MODELS_ROOT"]
          for env_key, sub in jobs:
              repo_id = os.environ[env_key]
              target = os.path.join(root, sub)
              print(f"\n⬇  Downloading {repo_id} → {target}", flush=True)
              snapshot_download(
                  repo_id=repo_id,
                  local_dir=target,
                  ignore_patterns=["*.h5", "*.msgpack", "*.onnx", "*.tflite", "*.ot", "*.mlmodelc"],
              )
              print(f"✔  Done {repo_id}", flush=True)
          PY
          echo "--- model sizes ---"
          du -sh "$MODELS_ROOT"/*

      - name: Create PolyGuard app files
        run: |
          mkdir -p app/static

          # ==================================================================
          # BACKEND — FastAPI + consensus voting + language routing
          # + Fingilish (romanized Persian) → Persian transliteration layer
          # + Full concurrency (def endpoints + semaphore + 1-thread inference)
          # ==================================================================
          cat > app/main.py << 'PYEOF'
          import os

          os.environ.setdefault("TOKENIZERS_PARALLELISM", "false")
          os.environ.setdefault("OMP_NUM_THREADS", "1")
          os.environ.setdefault("MKL_NUM_THREADS", "1")
          os.environ.setdefault("OPENBLAS_NUM_THREADS", "1")
          os.environ.setdefault("NUMEXPR_NUM_THREADS", "1")
          os.environ.setdefault("HF_HUB_OFFLINE", "1")
          os.environ.setdefault("TRANSFORMERS_OFFLINE", "1")

          import re
          import time
          import threading
          from contextlib import asynccontextmanager
          from pathlib import Path
          from typing import Dict

          import torch
          torch.set_num_threads(1)

          from anyio import to_thread
          from fastapi import FastAPI
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import FileResponse
          from pydantic import BaseModel
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          # ------------------------------------------------------------------
          # Concurrency control
          # ------------------------------------------------------------------
          CPU_COUNT = os.cpu_count() or 4
          MAX_CONCURRENT_INFERENCES = max(2, CPU_COUNT)
          MAX_THREADPOOL_TOKENS     = 200

          _infer_sem = threading.Semaphore(MAX_CONCURRENT_INFERENCES)
          _state_lock = threading.Lock()

          BASE_DIR    = Path(__file__).resolve().parent
          MODELS_ROOT = Path(os.environ["MODELS_ROOT"])


          class TextIn(BaseModel):
              text: str   # no length limit


          state = {"models": {}, "errors": {}, "ready": False, "inflight": 0, "peak": 0}

          MODEL_SPECS = {
              "persian":      {"dir": MODELS_ROOT / "persian",           "mode": "multilabel", "weight": 2.0, "lang": "fa",    "label": "Persian ParsBERT (تخصصی فارسی)",  "label_en": "Persian ParsBERT"},
              "textdetox_lg": {"dir": MODELS_ROOT / "textdetox_large",   "mode": "binary",     "weight": 2.0, "lang": "multi", "label": "TextDetox XLM-R Large (۱۵ زبان)", "label_en": "TextDetox XLM-R Large"},
              "textdetox_sm": {"dir": MODELS_ROOT / "textdetox_base",    "mode": "binary",     "weight": 1.5, "lang": "multi", "label": "TextDetox XLM-R Base (۱۵ زبان)",  "label_en": "TextDetox XLM-R Base"},
              "multilingual": {"dir": MODELS_ROOT / "multilingual",      "mode": "multilabel", "weight": 1.0, "lang": "multi", "label": "Unitary XLM-R (چندزبانه ۱۰۰+)",   "label_en": "Unitary XLM-R"},
              "twitter_off":  {"dir": MODELS_ROOT / "twitter_offensive", "mode": "binary",     "weight": 1.0, "lang": "en",    "label": "Twitter RoBERTa Offensive (انگلیسی)", "label_en": "Twitter RoBERTa Offensive"},
          }

          PER_MODEL_VOTE_THRESHOLD = 0.50
          MIN_VOTES_FOR_TOXIC      = 2
          STRONG_SINGLE_MODEL      = 0.90
          WEAK_SUSPECT_THRESHOLD   = 0.60

          # ==================================================================
          # FINGILISH → PERSIAN TRANSLITERATION (letters only, no words)
          # ==================================================================
          FINGILISH_TO_PERSIAN = [
              # multi-char combos first
              ('kh', 'خ'), ('gh', 'ق'), ('ch', 'چ'), ('sh', 'ش'), ('zh', 'ژ'),
              ('aa', 'آ'), ('ee', 'ی'), ('oo', 'و'), ('ou', 'و'), ('ei', 'ی'),
              ('ay', 'ی'), ('ey', 'ی'), ('ck', 'ک'), ('ph', 'ف'), ('th', 'ت'),
              ('ss', 'س'), ('tt', 'ت'), ('nn', 'ن'), ('mm', 'م'), ('ll', 'ل'),
              ('rr', 'ر'), ('dd', 'د'), ('bb', 'ب'), ('pp', 'پ'), ('kk', 'ک'),
              ('gg', 'گ'),
              # single chars
              ('a', 'ا'), ('b', 'ب'), ('c', 'ک'), ('d', 'د'), ('e', 'ه'),
              ('f', 'ف'), ('g', 'گ'), ('h', 'ه'), ('i', 'ی'), ('j', 'ج'),
              ('k', 'ک'), ('l', 'ل'), ('m', 'م'), ('n', 'ن'), ('o', 'و'),
              ('p', 'پ'), ('q', 'ق'), ('r', 'ر'), ('s', 'س'), ('t', 'ت'),
              ('u', 'و'), ('v', 'و'), ('w', 'و'), ('x', 'کس'), ('y', 'ی'),
              ('z', 'ز'),
          ]


          def _fingilish_to_persian(text: str) -> str:
              """Transliterate Latin (Fingilish) into Persian letters.
              Letters only — no dictionary, no profanity list."""
              t = text.lower().strip()
              # strip decoration between letters: k.i.r → kir
              t = re.sub(r'[.\-_*^•]+', '', t)
              # collapse single-letter tokens: "k i r" → "kir"
              tokens = t.split()
              if len(tokens) > 1 and all(len(tok) == 1 and tok.isalpha() for tok in tokens):
                  t = ''.join(tokens)

              result = []
              i = 0
              n = len(t)
              while i < n:
                  matched = False
                  for src, dst in FINGILISH_TO_PERSIAN:
                      if t.startswith(src, i):
                          result.append(dst)
                          i += len(src)
                          matched = True
                          break
                  if not matched:
                      result.append(t[i])
                      i += 1
              return ''.join(result)


          # ==================================================================
          # MODEL LOADING
          # ==================================================================
          def _load_one(name, spec):
              try:
                  print(f"[Ensemble] Loading '{name}'", flush=True)
                  tok = AutoTokenizer.from_pretrained(str(spec["dir"]), local_files_only=True)
                  mdl = AutoModelForSequenceClassification.from_pretrained(
                      str(spec["dir"]), local_files_only=True
                  )
                  mdl.eval()
                  with _state_lock:
                      state["models"][name] = (
                          mdl, tok, spec["mode"], spec["weight"],
                          spec["lang"], spec["label"], spec["label_en"]
                      )
                  print(f"[Ensemble] ✔ '{name}' loaded", flush=True)
              except Exception as exc:
                  with _state_lock:
                      state["errors"][name] = str(exc)
                  print(f"[Ensemble] ✖ '{name}' FAILED: {exc}", flush=True)


          def load_all():
              for name, spec in MODEL_SPECS.items():
                  _load_one(name, spec)
              with _state_lock:
                  state["ready"] = True
              print(f"[Ensemble] All done. Loaded: {list(state['models'].keys())}", flush=True)


          # ==================================================================
          # SCORING
          # ==================================================================
          def _score_multilabel(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.inference_mode():
                  logits = model(**inputs).logits
              return float(torch.sigmoid(logits).squeeze(0).max().item())


          def _score_binary(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.inference_mode():
                  logits = model(**inputs).logits
              probs = torch.softmax(logits, dim=-1).squeeze(0)
              if probs.numel() == 1:
                  return float(probs.item())
              return float(probs[1].item())


          def _detect_script(text: str) -> str:
              fa = len(re.findall(r'[\u0600-\u06FF]', text))
              en = len(re.findall(r'[A-Za-z]', text))
              total = fa + en
              if total == 0:
                  return "mixed"
              if fa / total >= 0.6:
                  return "fa"
              if en / total >= 0.6:
                  return "en"
              return "mixed"


          # ==================================================================
          # ENSEMBLE VOTING (single script pass)
          # ==================================================================
          def _run_ensemble(text: str, script: str) -> Dict:
              with _state_lock:
                  models_snapshot = list(state["models"].items())

              raw, weighted, labels, labels_en, skipped = {}, {}, {}, {}, []
              for name, (mdl, tok, mode, weight, lang, label, label_en) in models_snapshot:
                  if script == "fa" and lang == "en":
                      skipped.append(name)
                      continue
                  if script == "en" and lang == "fa":
                      skipped.append(name)
                      continue

                  try:
                      s = _score_binary(mdl, tok, text) if mode == "binary" \
                          else _score_multilabel(mdl, tok, text)
                  except Exception as exc:
                      print(f"[Ensemble] inference error in {name}: {exc}", flush=True)
                      s = 0.0

                  raw[name]       = round(s, 4)
                  weighted[name]  = round(s * weight, 4)
                  labels[name]    = label
                  labels_en[name] = label_en

              if not raw:
                  return {"error": "no models applicable", "details": state["errors"]}

              votes = {name: (s >= PER_MODEL_VOTE_THRESHOLD) for name, s in raw.items()}
              votes_count  = sum(votes.values())
              max_raw      = max(raw.values())
              max_weighted = max(weighted.values())

              if votes_count >= MIN_VOTES_FOR_TOXIC:
                  decision = "TOXIC"
              elif votes_count == 1 and max_raw >= STRONG_SINGLE_MODEL:
                  decision = "TOXIC"
              elif votes_count == 1 and max_raw >= WEAK_SUSPECT_THRESHOLD:
                  decision = "SUSPECT"
              elif max_raw >= WEAK_SUSPECT_THRESHOLD:
                  decision = "SUSPECT"
              else:
                  decision = "SAFE"

              top2 = sorted(raw.values(), reverse=True)[:2]
              confidence = round(sum(top2) / len(top2), 4)

              return {
                  "decision":        decision,
                  "max_weighted":    round(max_weighted, 4),
                  "max_raw":         round(max_raw, 4),
                  "confidence":      confidence,
                  "votes_count":     votes_count,
                  "votes":           votes,
                  "raw_scores":      raw,
                  "weighted_scores": weighted,
                  "labels":          labels,
                  "labels_en":       labels_en,
                  "total_models":    len(raw),
                  "skipped_models":  skipped,
                  "script":          script,
                  "vote_threshold":  PER_MODEL_VOTE_THRESHOLD,
                  "min_votes":       MIN_VOTES_FOR_TOXIC,
                  "errors":          state["errors"],
              }


          # ==================================================================
          # DUAL ANALYSIS — original text + Fingilish-transliterated text
          # ==================================================================
          _ORDER = {"SAFE": 0, "SUSPECT": 1, "TOXIC": 2}

          def ensemble_predict(text: str) -> Dict:
              t0 = time.perf_counter()

              script_original = _detect_script(text)
              persian_text    = _fingilish_to_persian(text)
              script_persian  = _detect_script(persian_text)

              has_fingilish = (
                  script_original == "en" and
                  script_persian == "fa" and
                  persian_text.strip() != ""
              )

              # run original
              result_original = _run_ensemble(text, script_original)

              # run transliterated (only if it looks like Persian now)
              result_fingilish = None
              if has_fingilish:
                  result_fingilish = _run_ensemble(persian_text, script_persian)

              # pick stronger decision
              candidates = [r for r in (result_original, result_fingilish) if r and "decision" in r]
              if not candidates:
                  return {"error": "no models applicable", "details": state["errors"]}

              final_decision = max(candidates, key=lambda r: _ORDER.get(r["decision"], 0))["decision"]

              primary = next((r for r in candidates if r["decision"] == final_decision), candidates[0])
              primary["decision"]          = final_decision
              primary["fingilish_detected"] = has_fingilish
              primary["fingilish_text"]     = persian_text if has_fingilish else None
              primary["analysis"] = {
                  "original":  result_original,
                  "fingilish": result_fingilish,
              }
              primary["latency_ms"] = round((time.perf_counter() - t0) * 1000)
              return primary


          # ==================================================================
          # FASTAPI APP
          # ==================================================================
          @asynccontextmanager
          async def lifespan(app: FastAPI):
              to_thread.current_default_thread_limiter().total_tokens = MAX_THREADPOOL_TOKENS
              threading.Thread(target=load_all, daemon=True).start()
              print(f"[Ensemble] Concurrency: cpu={CPU_COUNT}, "
                    f"parallel_inferences={MAX_CONCURRENT_INFERENCES}, "
                    f"threadpool={MAX_THREADPOOL_TOKENS}", flush=True)
              yield


          app = FastAPI(title="PolyGuard Ensemble", lifespan=lifespan)


          @app.get("/health")
          def health():
              if not state["ready"]:
                  return {
                      "status": "loading",
                      "loaded": list(state["models"].keys()),
                      "inflight": state["inflight"],
                      "peak": state["peak"],
                      "concurrency": MAX_CONCURRENT_INFERENCES,
                  }
              if not state["models"]:
                  return {"status": "error", "detail": state["errors"]}
              return {
                  "status": "ok",
                  "loaded_models": list(state["models"].keys()),
                  "errors": state["errors"],
                  "inflight": state["inflight"],
                  "peak": state["peak"],
                  "concurrency": MAX_CONCURRENT_INFERENCES,
              }


          @app.post("/api/check")
          def check(data: TextIn):     # sync → runs in threadpool, never blocks event loop
              if not state["ready"] or not state["models"]:
                  return {"error": state["errors"] or "no models loaded yet"}

              with _infer_sem:
                  state["inflight"] += 1
                  if state["inflight"] > state["peak"]:
                      state["peak"] = state["inflight"]
                  try:
                      return ensemble_predict(data.text)
                  finally:
                      state["inflight"] -= 1


          @app.get("/")
          def index():
              return FileResponse(BASE_DIR / "static" / "index.html")


          app.mount("/static", StaticFiles(directory=str(BASE_DIR / "static")), name="static")
          PYEOF

          # ==================================================================
          # FRONTEND
          # ==================================================================
          cat > app/static/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl" class="dark">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PolyGuard</title>

              <script src="https://cdn.tailwindcss.com"></script>
              <script>
                  tailwind.config = {
                      darkMode: 'class',
                      theme: {
                          extend: {
                              colors: {
                                  token: {
                                      sidebar: 'var(--bg-sidebar)',
                                      main: 'var(--bg-main)',
                                      surface: 'var(--bg-surface)',
                                      hover: 'var(--bg-hover)',
                                      border: 'var(--border-subtle)',
                                      primary: 'var(--text-primary)',
                                      secondary: 'var(--text-secondary)',
                                      tertiary: 'var(--text-tertiary)'
                                  }
                              },
                              fontFamily: {
                                  sans: ['Vazirmatn', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                                  mono: ['Fira Code', 'JetBrains Mono', 'Consolas', 'monospace']
                              }
                          }
                      }
                  }
              </script>

              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

              <style>
                  :root {
                      --bg-main: #ffffff;
                      --bg-sidebar: #f9f9f9;
                      --bg-surface: #f4f4f4;
                      --bg-hover: #ececec;
                      --border-subtle: rgba(0, 0, 0, 0.08);
                      --text-primary: #0d0d0d;
                      --text-secondary: #5d5d5d;
                      --text-tertiary: #8e8ea0;
                  }
                  html.dark {
                      --bg-main: #212121;
                      --bg-sidebar: #171717;
                      --bg-surface: #2f2f2f;
                      --bg-hover: #2a2a2a;
                      --border-subtle: rgba(255, 255, 255, 0.08);
                      --text-primary: #ececec;
                      --text-secondary: #b4b4b4;
                      --text-tertiary: #737373;
                  }

                  * { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif; }
                  .font-mono, code, pre { font-family: 'Fira Code', monospace !important; }

                  ::-webkit-scrollbar { width: 6px; height: 6px; }
                  ::-webkit-scrollbar-track { background: transparent; }
                  ::-webkit-scrollbar-thumb { background: rgba(142, 142, 160, 0.25); border-radius: 9999px; }
                  ::-webkit-scrollbar-thumb:hover { background: rgba(142, 142, 160, 0.45); }

                  @keyframes fadeIn {
                      from { opacity: 0; transform: translateY(4px); }
                      to { opacity: 1; transform: translateY(0); }
                  }
                  .animate-fadeIn { animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

                  .score-bar { transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }

                  .typing-dot { animation: chatgptPulse 1.3s infinite ease-in-out both; }
                  .typing-dot:nth-child(1) { animation-delay: -0.30s; }
                  .typing-dot:nth-child(2) { animation-delay: -0.15s; }
                  @keyframes chatgptPulse {
                      0%, 80%, 100% { transform: scale(0.4); opacity: 0.35; }
                      40% { transform: scale(1); opacity: 1; }
                  }
              </style>
          </head>

          <body class="bg-token-main text-token-primary h-screen w-screen overflow-hidden flex antialiased selection:bg-emerald-500/20">

              <div id="mobile-backdrop" onclick="toggleSidebar()"
                   class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity"></div>

              <aside id="sidebar"
                     class="fixed md:static inset-y-0 right-0 z-40 w-[260px] bg-token-sidebar flex flex-col transition-all duration-200 ease-in-out shrink-0 transform translate-x-full md:translate-x-0 border-l border-token-border select-none">

                  <div class="h-14 px-3 flex items-center justify-between">
                      <button onclick="toggleSidebar()"
                              class="w-9 h-9 rounded-lg text-token-secondary hover:bg-token-hover flex items-center justify-center transition-colors"
                              title="بستن نوار کناری">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                              <line x1="15" y1="3" x2="15" y2="21"></line>
                          </svg>
                      </button>
                      <div class="flex items-center gap-1">
                          <button onclick="toggleSearchInput()"
                                  class="w-9 h-9 rounded-lg text-token-secondary hover:bg-token-hover flex items-center justify-center transition-colors"
                                  title="جستجو در گفتگوها">
                              <i class="fa-solid fa-magnifying-glass text-sm"></i>
                          </button>
                          <button onclick="createNewThread()"
                                  class="w-9 h-9 rounded-lg text-token-secondary hover:bg-token-hover flex items-center justify-center transition-colors"
                                  title="گفتگوی جدید">
                              <i class="fa-regular fa-pen-to-square text-sm"></i>
                          </button>
                      </div>
                  </div>

                  <div id="sidebar-search-box" class="px-3 pb-2 hidden">
                      <div class="relative">
                          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-xs text-token-tertiary"></i>
                          <input id="search-threads" type="text" oninput="renderSidebarThreads()"
                                 placeholder="جستجو در گفتگوها..."
                                 class="w-full bg-token-surface text-xs text-token-primary placeholder-token-tertiary pr-8 pl-7 py-2 rounded-lg focus:outline-none border border-token-border">
                      </div>
                  </div>

                  <div class="px-2 pb-1">
                      <button onclick="createNewThread()"
                              class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-sm text-token-primary hover:bg-token-hover transition-colors group">
                          <div class="flex items-center gap-2.5 truncate">
                              <div class="w-6 h-6 rounded-full bg-token-primary text-token-main flex items-center justify-center text-xs shrink-0">
                                  <i class="fa-solid fa-shield-halved"></i>
                              </div>
                              <span class="font-medium text-[13px] truncate">PolyGuard Ensemble</span>
                          </div>
                          <i class="fa-regular fa-pen-to-square text-xs text-token-tertiary opacity-0 group-hover:opacity-100 transition-opacity"></i>
                      </button>
                      <button onclick="openModelsModal()"
                              class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[13px] text-token-secondary hover:bg-token-hover transition-colors">
                          <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs text-token-secondary">
                              <i class="fa-solid fa-cubes-stacked"></i>
                          </div>
                          <span class="truncate">کاوش مدل‌های ۵گانه</span>
                      </button>
                  </div>

                  <div id="threads-list" class="flex-1 overflow-y-auto px-2 py-2 space-y-4"></div>

                  <div class="p-2 border-t border-token-border space-y-1">
                      <div onclick="openSettingsModal()"
                           class="flex items-center justify-between px-2.5 py-2 rounded-xl hover:bg-token-hover cursor-pointer transition-colors">
                          <div class="flex items-center gap-2.5 min-w-0">
                              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center text-xs font-bold shrink-0">
                                  PG
                              </div>
                              <div class="truncate">
