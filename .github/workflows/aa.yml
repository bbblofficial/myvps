          }

          function updateStatus(){
            $('#dot').className = 'dot ' + (S.ollamaOk ? 'ok' : 'bad');
            $('#statusText').textContent = S.ollamaOk ? (S.installedChat.length + ' model' + (S.installedChat.length === 1 ? '' : 's') + ' installed') : 'Ollama offline';
          }
          async function refreshAll(){ await Promise.all([refreshChat(), refreshImage()]); renderModels(); }

          async function customInstall(){
            const v = $('#customInput').value.trim();
            if(!v) return;
            $('#customInput').value = '';
            if(S.tab === 'chat') pullModel(v);
            else installImage({ url:v });
          }
          $('#customInput').addEventListener('keydown', e => { if(e.key === 'Enter') customInstall(); });

          document.addEventListener('click', async e => {
            const nav = e.target.closest('.nav-item');
            if(nav){ showView(nav.dataset.view); return; }
            const tab = e.target.closest('[data-tab]');
            if(tab){ S.tab = tab.dataset.tab; renderModels(); if(S.tab === 'image') refreshImage().then(renderModels); return; }

            const el = e.target.closest('[data-act]');
            if(!el){ if(!e.target.closest('#pillWrap')) closeMenu(); return; }
            const a = el.dataset.act;
            if(a !== 'model-menu' && !el.closest('#modelMenu')) closeMenu();

            switch(a){
              case 'toggle-sb': toggleSidebar(); break;
              case 'new-chat': newChat(); break;
              case 'theme': { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('ua_theme', t); break; }
              case 'model-menu': $('#modelMenu').hidden ? openMenu() : closeMenu(); break;
              case 'use-chat': S.chatModel = el.dataset.name; store.set('ua_chat_model', S.chatModel); updatePill(); closeMenu(); renderModels(); break;
              case 'goto-models': S.tab = 'chat'; showView('models'); break;
              case 'goto-models-image': S.tab = 'image'; showView('models'); break;
              case 'send': S.streaming ? stopStream() : sendMessage(); break;
              case 'chip': chatInput.value = el.dataset.text; chatInput.dispatchEvent(new Event('input')); sendMessage(); break;
              case 'open-conv': {
                if(e.target.closest('.conv-x')) break;
                const c = S.convs.find(x => x.id === el.dataset.id);
                if(c){ if(S.streaming) stopStream(); S.curId = c.id; S.history = c.messages; renderChat(); renderConvList(); showView('chat'); }
                break;
              }
              case 'del-conv': {
                e.stopPropagation();
