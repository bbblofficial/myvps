          .pill:hover{background:var(--hover)}
          .pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .pill .i{color:var(--text3);width:15px;height:15px}
          .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;max-width:86vw;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:6px;z-index:80;animation:pop .18s var(--ease)}
          @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
          .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-size:14px;transition:background .12s}
          .menu-item:hover{background:var(--hover)}
          .menu-item small{display:block;color:var(--text3);font-size:12px;margin-top:1px}
          .menu-item .grow{flex:1;min-width:0}
          .menu-item .chk{color:var(--accent);width:16px;height:16px}
          .menu-sep{height:1px;background:var(--border);margin:5px 4px}

          .view{display:none;flex:1;min-height:0;flex-direction:column}
