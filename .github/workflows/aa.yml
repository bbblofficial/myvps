          .grid{display:grid;gap:10px}
          .mcard{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:border-color .15s,box-shadow .15s;animation:rise .3s var(--ease)}
