                      </div>
                  </div>

                  <!-- Composer -->
                  <div class="w-full px-4 pb-4 pt-2 bg-gradient-to-t from-white via-white dark:from-gpt-main dark:via-gpt-main to-transparent shrink-0">
                      <div class="max-w-3xl mx-auto">
                          <div class="relative flex flex-col bg-gray-100 dark:bg-gpt-input rounded-3xl border border-gray-200 dark:border-white/10 shadow-sm focus-within:ring-1 focus-within:ring-gray-300 dark:focus-within:ring-white/20 transition-all px-3 py-2.5">
                              <textarea id="prompt-input" rows="1" placeholder="متن را برای بررسی وارد کنید..." oninput="autoResize(this)" onkeydown="handleKey(event)"
                                  class="w-full max-h-48 bg-transparent text-gray-800 dark:text-gray-100 placeholder-gray-400 text-sm sm:text-base px-2 py-1 focus:outline-none resize-none overflow-y-auto leading-relaxed rtl"></textarea>
                              <div class="flex items-center justify-between pt-2 px-1">
                                  <div class="flex items-center gap-1">
                                      <span id="health-dot" class="w-2 h-2 rounded-full bg-gray-400" title="Server status"></span>
                                      <span id="health-text" class="text-[11px] text-gray-400 mr-1">loading…</span>
                                  </div>
                                  <div class="flex items-center gap-2">
                                      <span id="char-counter" class="text-[11px] text-gray-400 hidden sm:inline"></span>
                                      <button id="send-btn" onclick="analyze()" disabled
                                          class="w-8 h-8 rounded-full bg-black dark:bg-white text-white dark:text-black flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-90 transition-opacity">
                                          <i class="fa-solid fa-arrow-up text-sm"></i>
