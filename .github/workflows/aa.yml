          .codebox{margin:4px 0 18px;border-radius:12px;overflow:hidden;background:#1d1d1c;border:1px solid #2e2d2b;font-family:var(--mono)}
          .codebox-head{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 16px;background:#272725;color:#b9b6ab;font-size:12.5px}
          .codebox-lang{letter-spacing:.02em}
          .code-btn{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;color:#b9b6ab;font:500 12.5px var(--ui);transition:background .15s,color .15s}
          .code-btn:hover{background:#363633;color:#fff}
          .code-btn.ok{color:#8ccf9f}
          .code-btn .i{width:14px;height:14px}
          .codebox pre{margin:0;padding:14px 16px;overflow-x:auto;background:transparent}
          .codebox pre code.hljs{display:block;padding:0;background:transparent;font-family:var(--mono);font-size:13.5px;line-height:1.65;color:#d8d6cd;tab-size:4}

          details.think{margin:0 0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-family:var(--ui)}
          details.think summary{cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--text2);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
          details.think summary::-webkit-details-marker{display:none}
          details.think summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--text3);border-bottom:1.6px solid var(--text3);transform:rotate(-45deg);transition:transform .2s}
          details.think[open] summary::before{transform:rotate(45deg)}
