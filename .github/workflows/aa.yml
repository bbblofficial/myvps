name: Unified AI Panel (Claude UI + Qwen2.5-7B + CPU SD)

on:
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 0. Housekeeping
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget jq psmisc python3-venv python3-pip \
                                  unzip libgomp1

      # ============================================================
      # 1. IMAGE ENGINE — stable-diffusion.cpp binary + SD1.5
      # ============================================================
      - name: Download CPU image-gen binary + model
        run: |
          set -euo pipefail
          mkdir -p image-engine
          cd image-engine

          echo "Fetching latest stable-diffusion.cpp release tag..."
          RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest")

          if echo "$RESPONSE" | jq -e '.message' &>/dev/null; then
            echo "::warning::GitHub API error: $(echo "$RESPONSE" | jq -r '.message // "Unknown"')"
            RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/leejet/stable-diffusion.cpp/releases?per_page=10")
            RELEASE_OBJ=$(echo "$RESPONSE" | jq -c '.[0]')
          else
            RELEASE_OBJ="$RESPONSE"
          fi

          LATEST_TAG=$(echo "$RELEASE_OBJ" | jq -r '.tag_name // empty' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Could not determine latest release tag."
            echo "$RESPONSE" | head -c 800
            exit 1
          fi
          echo "Latest release tag: $LATEST_TAG"

          BINARY_ZIP="sd-${LATEST_TAG}-bin-Linux-Ubuntu-24.04-x86_64.zip"
          BINARY_URL="https://github.com/leejet/stable-diffusion.cpp/releases/download/${LATEST_TAG}/${BINARY_ZIP}"
          echo "Trying: $BINARY_URL"

          if ! wget -q "$BINARY_URL" -O sd-bin.zip 2>/dev/null; then
            echo "::warning::Direct asset name failed. Querying API for available assets..."
            ASSET_URL=$(echo "$RELEASE_OBJ" | jq -r '.assets[]? | select(.name | test("bin-linux-ubuntu.*x86_64\\.zip$"; "i")) | .browser_download_url' | head -n1)
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "::error::Could not find a Linux CPU asset in the latest release."
              exit 1
            fi
            wget -q "$ASSET_URL" -O sd-bin.zip || { echo "::error::Failed to download asset"; exit 1; }
          fi

          unzip -o sd-bin.zip
          rm -f sd-bin.zip

          if [ -f ./sd-cli ]; then
            :
          elif [ -f ./sd ]; then
            cp ./sd ./sd-cli
          else
            echo "::error::No sd-cli/sd binary found after extraction."
            find . -type f | head -n 50
            exit 1
          fi
          chmod +x ./sd-cli
          ls -lh sd-cli
          LD_LIBRARY_PATH=. ./sd-cli --help 2>&1 | head -n 15 || true

          echo "Downloading Stable Diffusion 1.5 checkpoint..."
          wget -q "https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5/resolve/main/v1-5-pruned-emaonly.safetensors" \
            -O sd-v1-5.safetensors

          ls -lh
          echo "Image engine setup complete."

      - name: Write image server (matches Claude UI API contract)
        run: |
          mkdir -p server
          cat > server/image_server.py <<'PYEOF'
          import os, base64, time, uuid, threading, traceback, subprocess, re
          import urllib.request
          from fastapi import FastAPI
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.responses import JSONResponse
          from pydantic import BaseModel

          MODEL_DIR = os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "image-engine"))
          SD_BINARY = os.path.join(MODEL_DIR, "sd-cli")
          GEN_TIMEOUT_SECONDS = 12 * 60

          CATALOG = [
              {
                  "id": "sd15",
                  "name": "Stable Diffusion 1.5",
                  "file": "sd-v1-5.safetensors",
                  "size_gb": 4.27,
                  "badges": ["Recommended"],
                  "desc": "Classic SD1.5 base. Balanced quality and CPU speed.",
                  "url": "https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5/resolve/main/v1-5-pruned-emaonly.safetensors",
                  "steps": 15,
                  "cfg": 7.5,
              },
              {
                  "id": "sdturbo",
                  "name": "SD-Turbo",
                  "file": "sd-turbo.safetensors",
                  "size_gb": 4.27,
                  "badges": ["Fastest"],
                  "desc": "Distilled SD. Usable images in 1-4 steps.",
                  "url": "https://huggingface.co/stabilityai/sd-turbo/resolve/main/sd_turbo.safetensors",
                  "steps": 4,
                  "cfg": 1.0,
              },
          ]

          STATE = {"ready": False, "error": None}
          JOBS = {}
          INSTALLS = {}
          JOB_LOCK = threading.Lock()
          JOB_TTL = 3600

          def list_installed():
              out = []
              if not os.path.isdir(MODEL_DIR):
                  return out
              for f in sorted(os.listdir(MODEL_DIR)):
                  if f.endswith((".safetensors", ".ckpt")):
                      path = os.path.join(MODEL_DIR, f)
                      try:
                          size = os.path.getsize(path)
                      except OSError:
                          continue
                      meta = next((c for c in CATALOG if c["file"] == f), None)
                      out.append({
                          "name": meta["name"] if meta else f,
                          "file": f,
                          "size": size,
                          "steps": meta["steps"] if meta else 15,
                          "cfg": meta["cfg"] if meta else 7.5,
                      })
              return out

          def disk_free_gb():
              try:
                  path = MODEL_DIR if os.path.isdir(MODEL_DIR) else "/"
                  s = os.statvfs(path)
                  return round(s.f_bavail * s.f_frsize / 1e9, 1)
              except Exception:
                  return None

          def check_ready():
              missing = []
              if not os.path.isfile(SD_BINARY):
                  missing.append("sd-cli")
              if not list_installed():
                  missing.append("no model checkpoint")
              if missing:
                  STATE["ready"] = False
                  STATE["error"] = "Missing: " + ", ".join(missing)
                  return False
              STATE["ready"] = True
              STATE["error"] = None
              return True

          RUNTIME_ENV = os.environ.copy()
          RUNTIME_ENV["LD_LIBRARY_PATH"] = MODEL_DIR + ":" + RUNTIME_ENV.get("LD_LIBRARY_PATH", "")

          app = FastAPI()
          app.add_middleware(
              CORSMiddleware, allow_origins=["*"],
              allow_methods=["*"], allow_headers=["*"]
          )

          class GenRequest(BaseModel):
              prompt: str
              negative_prompt: str = ""
              model: str = ""
              steps: int = 15
              guidance_scale: float = 7.5
              width: int = 512
              height: int = 512
              seed: int = -1

          class InstallRequest(BaseModel):
              id: str = ""
              url: str = ""

          class KeyRequest(BaseModel):
              key: str = ""
              file: str = ""

          def _purge():
              now = time.time()
              with JOB_LOCK:
                  dead = [k for k, v in JOBS.items() if now - v.get("created", now) > JOB_TTL]
                  for k in dead:
                      JOBS.pop(k, None)

          @app.get("/health")
          def health():
              _purge()
              check_ready()
              return {"ready": STATE["ready"], "error": STATE["error"],
                      "installed": list_installed()}

          @app.get("/models")
          def models():
              check_ready()
              return {
                  "ready": STATE["ready"],
                  "catalog": CATALOG,
                  "installed": list_installed(),
                  "installs": INSTALLS,
                  "disk_free_gb": disk_free_gb(),
              }

          def _download_install(key, url, filename):
              target = os.path.join(MODEL_DIR, filename)
              tmp = target + ".part"
              INSTALLS[key] = {
                  "status": "starting", "total": 0, "downloaded": 0,
                  "started": time.time(), "error": None, "file": filename,
                  "cancel": False,
              }
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      total = int(r.headers.get("Content-Length") or 0)
                      INSTALLS[key]["total"] = total
                      INSTALLS[key]["status"] = "downloading"
                      done = 0
                      with open(tmp, "wb") as f:
                          while True:
                              if INSTALLS[key].get("cancel"):
                                  raise Exception("Cancelled")
                              chunk = r.read(1024 * 256)
                              if not chunk:
                                  break
                              f.write(chunk)
                              done += len(chunk)
                              INSTALLS[key]["downloaded"] = done
                  os.replace(tmp, target)
                  INSTALLS[key]["status"] = "done"
              except Exception as e:
                  INSTALLS[key]["status"] = "error"
                  INSTALLS[key]["error"] = f"{type(e).__name__}: {e}"
                  try:
                      if os.path.exists(tmp):
                          os.remove(tmp)
                  except Exception:
                      pass

          @app.post("/models/install")
          def install(req: InstallRequest):
              os.makedirs(MODEL_DIR, exist_ok=True)
              if req.id:
                  meta = next((c for c in CATALOG if c["id"] == req.id), None)
                  if not meta:
                      return JSONResponse({"error": "Unknown model id"}, status_code=404)
                  key = req.id
                  filename = meta["file"]
                  url = meta["url"]
              elif req.url:
                  key = "custom:" + uuid.uuid4().hex[:8]
                  base = os.path.basename(req.url.split("?")[0]) or ("custom-" + uuid.uuid4().hex[:6] + ".safetensors")
                  if not base.endswith((".safetensors", ".ckpt")):
                      base += ".safetensors"
                  filename = base
                  url = req.url
              else:
                  return JSONResponse({"error": "Provide id or url"}, status_code=400)
              threading.Thread(target=_download_install,
                               args=(key, url, filename), daemon=True).start()
              return {"key": key, "status": "starting"}

          @app.post("/models/cancel")
          def cancel(req: KeyRequest):
              st = INSTALLS.get(req.key)
              if not st:
                  return JSONResponse({"error": "unknown key"}, status_code=404)
              st["cancel"] = True
              st["status"] = "error"
              st["error"] = "Cancelled"
              return {"ok": True}

          @app.post("/models/delete")
          def delete(req: KeyRequest):
              if not req.file:
                  return JSONResponse({"error": "file required"}, status_code=400)
              path = os.path.join(MODEL_DIR, os.path.basename(req.file))
              if os.path.isfile(path):
                  os.remove(path)
              return {"ok": True}

          @app.post("/generate")
          def generate(req: GenRequest):
              if not check_ready():
                  return JSONResponse(
                      {"error": "Model not ready", "state": STATE}, status_code=503)

              model_file = req.model or (list_installed()[0]["file"] if list_installed() else "")
              model_path = os.path.join(MODEL_DIR, os.path.basename(model_file))
              if not os.path.isfile(model_path):
                  return JSONResponse(
                      {"error": f"Model not found: {model_file}"}, status_code=404)

              steps = max(1, min(req.steps, 30))
              width = max(256, min(req.width, 768))
              height = max(256, min(req.height, 768))

              job_id = uuid.uuid4().hex
              with JOB_LOCK:
                  JOBS[job_id] = {
                      "status": "queued",
                      "created": time.time(),
                      "started": time.time(),
                      "progress": None,
                      "prompt": (req.prompt or "")[:120],
                  }

              def run_job():
                  out_png = f"/tmp/{job_id}.png"
                  try:
                      cmd = [
                          SD_BINARY,
                          "-m", model_path,
                          "--type", "q8_0",
                          "-p", req.prompt,
                          "-n", req.negative_prompt,
                          "-W", str(width),
                          "-H", str(height),
                          "--steps", str(steps),
                          "--cfg-scale", str(req.guidance_scale),
                          "-s", str(req.seed) if req.seed != -1 else "-1",
                          "-o", out_png,
                          "-t", "4",
                      ]
                      t0 = time.time()
                      proc = subprocess.Popen(
                          cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          text=True, bufsize=1, cwd=MODEL_DIR, env=RUNTIME_ENV
                      )
                      with JOB_LOCK:
                          JOBS[job_id]["status"] = "running"
                          JOBS[job_id]["started"] = time.time()

                      deadline = time.time() + GEN_TIMEOUT_SECONDS
                      for line in proc.stdout:
                          if time.time() > deadline:
                              proc.kill()
                              raise Exception(
                                  f"Generation exceeded {GEN_TIMEOUT_SECONDS}s")
                          m = re.search(r"(\d+)\s*/\s*(\d+)", line)
                          if m:
                              cur, tot = int(m.group(1)), int(m.group(2))
                              if 0 < cur <= tot <= 200:
                                  with JOB_LOCK:
                                      JOBS[job_id]["progress"] = {"cur": cur, "tot": tot}
                      proc.wait()

                      if proc.returncode != 0:
                          raise Exception(f"sd-cli exited {proc.returncode}")
                      if not os.path.exists(out_png):
                          raise Exception("sd-cli produced no output")

                      with open(out_png, "rb") as f:
                          b64 = base64.b64encode(f.read()).decode()
                      with JOB_LOCK:
                          JOBS[job_id].update({
                              "status": "done",
                              "image": b64,
                              "elapsed": time.time() - t0,
                          })
                  except Exception as e:
                      traceback.print_exc()
                      with JOB_LOCK:
                          JOBS[job_id].update({
                              "status": "error",
                              "error": f"{type(e).__name__}: {e}",
                          })
                  finally:
                      if os.path.exists(out_png):
                          try:
                              os.remove(out_png)
                          except Exception:
                              pass

              threading.Thread(target=run_job, daemon=True).start()
              return {"job_id": job_id, "status": "queued"}

          @app.get("/status/{job_id}")
          def job_status(job_id: str):
              _purge()
              with JOB_LOCK:
                  job = JOBS.get(job_id)
              if not job:
                  return JSONResponse({"error": "unknown job"}, status_code=404)
              return {k: v for k, v in job.items() if k != "image"}

          @app.get("/result/{job_id}")
          def job_result(job_id: str):
              with JOB_LOCK:
                  job = JOBS.get(job_id)
              if not job:
                  return JSONResponse({"error": "unknown job"}, status_code=404)
              if job.get("status") != "done":
                  return JSONResponse(
                      {"error": "not ready", "status": job.get("status")},
                      status_code=409)
              return {"image": job["image"], "elapsed": job.get("elapsed")}
          PYEOF

      - name: Setup Python venv + FastAPI
        run: |
          python3 -m venv $HOME/venv
          $HOME/venv/bin/pip install --upgrade pip
          $HOME/venv/bin/pip install "fastapi[standard]" "uvicorn[standard]" pydantic

      - name: Start image server
        run: |
          cd server
          nohup $HOME/venv/bin/uvicorn image_server:app \
            --host 127.0.0.1 --port 8000 \
            --timeout-keep-alive 900 \
            > ../image_server.log 2>&1 &
          echo "Image server launched."

      # ============================================================
      # 2. CHAT — Ollama + Qwen2.5-7B-Instruct
      # ============================================================
      - name: Install & start Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          sudo tee /etc/systemd/system/ollama.service.d/override.conf >/dev/null <<'SYSEOF'
          [Service]
          Environment="OLLAMA_ORIGINS=*"
          Environment="OLLAMA_HOST=127.0.0.1:11434"
          Environment="OLLAMA_KEEP_ALIVE=30m"
          SYSEOF
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama failed to start"
          sudo journalctl -u ollama --no-pager -n 120 || true
          exit 1

      - name: Pull Qwen2.5-7B-Instruct
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11434
          ollama pull qwen2.5:7b-instruct
          ollama list

      - name: Smoke-test chat model
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5:7b-instruct","messages":[{"role":"user","content":"Say OK"}],"stream":false}' \
            | head -c 400
          echo

      - name: Wait for image server to be ready
        run: |
          for i in $(seq 1 60); do
            S=$(curl -s http://127.0.0.1:8000/health || echo '{}')
            echo "Attempt $i: $S"
            if echo "$S" | grep -q '"ready":true'; then
              echo "Image engine ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::image server never became ready"
          cat image_server.log || true
          exit 1

      # ============================================================
      # 3. WEB UI — Claude-styled single-page app
      # ============================================================
      - name: Build web UI
        run: |
          mkdir -p web
          cat > web/index.html <<'CLAUDE_UI_EOF_9d3f'
          <!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Unified AI</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
          <style>
          :root{
            --sw:272px;
            --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            --serif:"Source Serif 4","Tiempos Text",Georgia,"Times New Roman",serif;
            --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
            --ease:cubic-bezier(.2,.7,.2,1);
            --bg:#faf9f5; --side:#f3f1ea; --surface:#ffffff; --hover:#ebe8de; --active:#e5e2d6;
            --border:#e8e5da; --border2:#d9d5c6;
            --text:#1f1e1d; --text2:#5f5d57; --text3:#8f8c82;
            --accent:#c96442; --accent-h:#b4553a; --accent-soft:rgba(201,100,66,.10);
            --user:#f0ede3; --danger:#c0392b; --ok:#3d8b5f;
            --shadow:0 4px 24px rgba(31,30,29,.06);
          }
          html[data-theme="dark"]{
            --bg:#262624; --side:#1f1e1d; --surface:#30302e; --hover:#3a3935; --active:#42413c;
            --border:#3d3c38; --border2:#54524c;
            --text:#faf9f5; --text2:#c2c0b6; --text3:#8f8d84;
            --accent:#d97757; --accent-h:#e48a6c; --accent-soft:rgba(217,119,87,.14);
            --user:#30302e; --danger:#e57b6d; --ok:#6fbf92;
            --shadow:0 4px 24px rgba(0,0,0,.35);
          }
          *{box-sizing:border-box;margin:0;padding:0}
          [hidden]{display:none!important}
          html,body{height:100%}
          body{font-family:var(--ui);font-size:15px;background:var(--bg);color:var(--text);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
          button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
          input,textarea,select{font:inherit;color:inherit}
          .i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
          .i.sm{width:15px;height:15px}
          ::selection{background:var(--accent-soft)}
          *{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}

          .sidebar{width:var(--sw);background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .3s var(--ease),transform .3s var(--ease),background .25s;z-index:50}
          body.sb-collapsed .sidebar{margin-left:calc(var(--sw) * -1)}
          .sb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px 16px}
          .brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.01em}
          .brand .i{color:var(--accent);width:22px;height:22px;stroke-width:2.2}
          .icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s,color .15s}
          .icon-btn:hover{background:var(--hover);color:var(--text)}
          .new-chat{margin:8px 12px 6px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:500;transition:background .15s,transform .15s}
          .new-chat:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
          .new-chat:active{transform:scale(.98)}
          .nav{padding:4px 8px;display:flex;flex-direction:column;gap:1px}
          .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--text2);text-align:left;transition:background .15s,color .15s}
          .nav-item:hover{background:var(--hover);color:var(--text)}
          .nav-item.active{background:var(--active);color:var(--text);font-weight:500}
          .sb-search{margin:8px 12px 2px}
          .sb-search input{width:100%;border:1px solid transparent;background:var(--hover);border-radius:10px;padding:8px 11px;font-size:13.5px;outline:none;transition:border-color .15s,background .15s}
          .sb-search input:focus{border-color:var(--border2);background:var(--surface)}
          .sb-search input::placeholder{color:var(--text3)}
          .sb-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
          .sb-label{font-size:11.5px;font-weight:600;color:var(--text3);padding:14px 10px 5px;letter-spacing:.02em}
          .conv{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text2);transition:background .12s}
          .conv:hover{background:var(--hover);color:var(--text)}
