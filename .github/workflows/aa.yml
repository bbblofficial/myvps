name: PolyGuard Ensemble — NexusAI UI + Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: polyguard-nexusai-deploy
  cancel-in-progress: true

env:
  # ---- 5-model roster ----
  PERSIAN_MODEL_ID:      HamidRezaei/Persian-Offensive-Language-Detection
  TEXTDETOX_LARGE_ID:    textdetox/twitter-xlmr-toxicity-classifier
  TEXTDETOX_BASE_ID:     textdetox/xlmr-base-toxicity-classifier
  MULTILINGUAL_MODEL_ID: unitary/multilingual-toxic-xlm-roberta
  TWITTER_OFFENSIVE_ID:  cardiffnlp/twitter-roberta-base-offensive

  MODELS_ROOT: ${{ github.workspace }}/models
  TOXIC_THRESHOLD:   "0.05"
  SUSPECT_THRESHOLD: "0.02"

  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet fastapi "uvicorn[standard]" transformers sentencepiece protobuf huggingface_hub

      - name: Download all models to local folders
        run: |
          mkdir -p "$MODELS_ROOT/persian" "$MODELS_ROOT/textdetox_large" "$MODELS_ROOT/textdetox_base" "$MODELS_ROOT/multilingual" "$MODELS_ROOT/twitter_offensive"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          jobs = [
              ("PERSIAN_MODEL_ID",      "persian"),
              ("TEXTDETOX_LARGE_ID",    "textdetox_large"),
              ("TEXTDETOX_BASE_ID",     "textdetox_base"),
              ("MULTILINGUAL_MODEL_ID", "multilingual"),
              ("TWITTER_OFFENSIVE_ID",  "twitter_offensive"),
          ]
          root = os.environ["MODELS_ROOT"]
          for env_key, sub in jobs:
              repo_id = os.environ[env_key]
              target = os.path.join(root, sub)
              print(f"\n⬇  Downloading {repo_id} → {target}", flush=True)
              snapshot_download(
                  repo_id=repo_id,
                  local_dir=target,
                  ignore_patterns=["*.h5", "*.msgpack", "*.onnx", "*.tflite", "*.ot", "*.mlmodelc"],
              )
              print(f"✔  Done {repo_id}", flush=True)
          PY
          echo "--- model sizes ---"
          du -sh "$MODELS_ROOT"/*

      - name: Create PolyGuard app files
        run: |
          mkdir -p app/static

          # ============================================================
          # BACKEND — FastAPI + 5-model weighted ensemble
          # ============================================================
          cat > app/main.py << 'PYEOF'
          import os
          os.environ.setdefault("TOKENIZERS_PARALLELISM", "false")
          os.environ.setdefault("HF_HUB_OFFLINE", "1")
          os.environ.setdefault("TRANSFORMERS_OFFLINE", "1")
          os.environ.setdefault("OMP_NUM_THREADS", "4")
          os.environ.setdefault("MKL_NUM_THREADS", "4")

          import threading
          from contextlib import asynccontextmanager
          from pathlib import Path
          from typing import Dict
          import torch
          from fastapi import FastAPI
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import FileResponse
          from pydantic import BaseModel
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          torch.set_num_threads(4)

          BASE_DIR    = Path(__file__).resolve().parent
          MODELS_ROOT = Path(os.environ["MODELS_ROOT"])

          TOXIC_THRESHOLD   = float(os.environ.get("TOXIC_THRESHOLD",   "0.05"))
          SUSPECT_THRESHOLD = float(os.environ.get("SUSPECT_THRESHOLD", "0.02"))

          class TextIn(BaseModel):
              text: str

          state = {"models": {}, "errors": {}, "ready": False}

          MODEL_SPECS = {
              "persian":      {"dir": MODELS_ROOT / "persian",           "mode": "multilabel", "weight": 2.0, "label": "Persian ParsBERT (تخصصی فارسی)"},
              "textdetox_lg": {"dir": MODELS_ROOT / "textdetox_large",   "mode": "binary",     "weight": 2.0, "label": "TextDetox XLM-R Large (۱۵ زبان)"},
              "textdetox_sm": {"dir": MODELS_ROOT / "textdetox_base",    "mode": "binary",     "weight": 1.5, "label": "TextDetox XLM-R Base (۱۵ زبان)"},
              "multilingual": {"dir": MODELS_ROOT / "multilingual",      "mode": "multilabel", "weight": 1.0, "label": "Unitary XLM-R (چندزبانه ۱۰۰+)"},
              "twitter_off":  {"dir": MODELS_ROOT / "twitter_offensive", "mode": "binary",     "weight": 1.0, "label": "Twitter RoBERTa Offensive"},
          }

          def _load_one(name, spec):
              try:
                  print(f"[Ensemble] Loading '{name}' from {spec['dir']}", flush=True)
                  tok = AutoTokenizer.from_pretrained(str(spec["dir"]), local_files_only=True)
                  mdl = AutoModelForSequenceClassification.from_pretrained(
                      str(spec["dir"]), local_files_only=True
                  )
                  mdl.eval()
                  state["models"][name] = (mdl, tok, spec["mode"], spec["weight"], spec["label"])
                  print(f"[Ensemble] ✔ '{name}' loaded", flush=True)
              except Exception as exc:
                  state["errors"][name] = str(exc)
                  print(f"[Ensemble] ✖ '{name}' FAILED: {exc}", flush=True)

          def load_all():
              for name, spec in MODEL_SPECS.items():
                  _load_one(name, spec)
              state["ready"] = True
              print(f"[Ensemble] All done. Loaded: {list(state['models'].keys())}", flush=True)

          def _score_multilabel(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.no_grad():
                  logits = model(**inputs).logits
              return float(torch.sigmoid(logits).squeeze(0).max().item())

          def _score_binary(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.no_grad():
                  logits = model(**inputs).logits
              probs = torch.softmax(logits, dim=-1).squeeze(0)
              if probs.numel() == 1:
                  return float(probs.item())
              return float(probs[1].item())

          def ensemble_predict(text: str) -> Dict:
              raw, weighted, labels = {}, {}, {}
              for name, (mdl, tok, mode, weight, label) in state["models"].items():
                  try:
                      s = _score_binary(mdl, tok, text) if mode == "binary" \
                          else _score_multilabel(mdl, tok, text)
                  except Exception as exc:
                      print(f"[Ensemble] inference error in {name}: {exc}", flush=True)
                      s = 0.0
                  raw[name]      = round(s, 4)
                  weighted[name] = round(s * weight, 4)
                  labels[name]   = label

              if not weighted:
                  return {"error": "no models loaded", "details": state["errors"]}

              max_weighted = max(weighted.values())

              if max_weighted >= TOXIC_THRESHOLD:
                  decision = "TOXIC"
              elif max_weighted >= SUSPECT_THRESHOLD:
                  decision = "SUSPECT"
              else:
                  decision = "SAFE"

              return {
                  "decision":          decision,
                  "max_weighted":      round(max_weighted, 4),
                  "raw_scores":        raw,
                  "weighted_scores":   weighted,
                  "labels":            labels,
                  "total_models":      len(weighted),
                  "toxic_threshold":   TOXIC_THRESHOLD,
                  "suspect_threshold": SUSPECT_THRESHOLD,
                  "errors":            state["errors"],
              }

          @asynccontextmanager
          async def lifespan(app: FastAPI):
              threading.Thread(target=load_all, daemon=True).start()
              yield

          app = FastAPI(title="PolyGuard Ensemble", lifespan=lifespan)

          @app.get("/health")
          def health():
              if not state["ready"]:
                  return {"status": "loading", "loaded": list(state["models"].keys())}
              if not state["models"]:
                  return {"status": "error", "detail": state["errors"]}
              return {
                  "status": "ok",
                  "loaded_models": list(state["models"].keys()),
                  "errors": state["errors"],
                  "toxic_threshold": TOXIC_THRESHOLD,
                  "suspect_threshold": SUSPECT_THRESHOLD,
              }

          @app.post("/api/check")
          async def check(data: TextIn):
              if not state["models"]:
                  return {"error": state["errors"] or "no models loaded yet"}
              return ensemble_predict(data.text)

          @app.get("/")
          def index():
              return FileResponse(BASE_DIR / "static" / "index.html")

          app.mount("/static", StaticFiles(directory=str(BASE_DIR / "static")), name="static")
          PYEOF

          # ============================================================
          # FRONTEND — NexusAI-style HTML
          # ============================================================
          cat > app/static/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" class="dark">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PolyGuard Ensemble — تشخیص محتوای سمی</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <script>
                  tailwind.config = {
                      darkMode: 'class',
                      theme: {
                          extend: {
                              colors: {
                                  gpt: {
                                      sidebar: '#171717',
                                      main: '#212121',
                                      input: '#2f2f2f',
                                      hover: '#2a2b32',
                                      border: '#383838',
                                      userBubble: '#2f2f2f',
                                      accent: '#10a37f'
                                  }
                              },
                              fontFamily: {
                                  sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                                  mono: ['Fira Code', 'JetBrains Mono', 'Consolas', 'monospace']
                              }
                          }
                      }
                  }
              </script>
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
              <style>
                  ::-webkit-scrollbar { width: 6px; height: 6px; }
                  ::-webkit-scrollbar-track { background: transparent; }
                  ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }
                  ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }

                  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
                  .animate-fadeIn { animation: fadeIn 0.25s ease-out; }

                  .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
                  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
                  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
                  @keyframes typingBounce {
                      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
                      40% { transform: scale(1); opacity: 1; }
                  }

                  /* Score bar animations */
                  .score-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

                  /* RTL text for Persian input */
                  .rtl { direction: rtl; text-align: right; }
              </style>
          </head>
          <body class="bg-white dark:bg-gpt-main text-gray-800 dark:text-gray-100 font-sans antialiased h-screen w-screen overflow-hidden flex select-none">

              <!-- Mobile Backdrop -->
              <div id="mobile-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-xs"></div>

              <!-- ============ SIDEBAR ============ -->
              <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-[260px] bg-gray-50 dark:bg-gpt-sidebar border-r border-gray-200 dark:border-white/10 flex flex-col transition-all duration-300 ease-in-out shrink-0 transform -translate-x-full md:translate-x-0">

                  <div class="p-3 flex items-center justify-between gap-2">
                      <button onclick="toggleSidebar()" class="p-2.5 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gpt-hover transition-colors">
                          <i class="fa-solid fa-table-columns text-base"></i>
                      </button>
                      <button onclick="createNewAnalysis()" class="flex-1 flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gpt-hover transition-colors">
                          <span class="flex items-center gap-2.5">
                              <span class="w-6 h-6 rounded-full bg-gpt-accent text-white flex items-center justify-center text-xs">
                                  <i class="fa-solid fa-shield-halved"></i>
                              </span>
                              <span>New analysis</span>
                          </span>
                          <i class="fa-regular fa-pen-to-square text-gray-400"></i>
                      </button>
                  </div>

                  <div class="px-3 pb-2">
                      <div class="relative">
                          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
                          <input id="search-chats" type="text" oninput="renderHistoryList()" placeholder="Search history..." class="w-full bg-gray-200/70 dark:bg-white/5 text-xs text-gray-800 dark:text-gray-200 placeholder-gray-400 pl-8 pr-3 py-2 rounded-lg focus:outline-none focus:ring-1 focus:ring-gpt-accent transition">
                      </div>
                  </div>

                  <div id="history-list" class="flex-1 overflow-y-auto px-2 py-2 space-y-1"></div>

                  <div class="p-3 border-t border-gray-200 dark:border-white/10 space-y-1">
                      <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gpt-hover transition-colors">
                          <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 text-white flex items-center justify-center font-semibold text-xs">PG</div>
                          <div class="flex-1 text-left truncate">
                              <div class="font-medium text-xs leading-tight">Ensemble Settings</div>
                              <div class="text-[11px] text-gray-400 truncate">5 models · weighted vote</div>
                          </div>
                          <i class="fa-solid fa-sliders text-gray-400 text-xs"></i>
                      </button>
                  </div>
              </aside>

              <!-- ============ MAIN ============ -->
              <main class="flex-1 flex flex-col h-full min-w-0 bg-white dark:bg-gpt-main relative">

                  <!-- Top Bar -->
                  <header class="h-14 px-4 flex items-center justify-between border-b border-gray-100 dark:border-white/5 shrink-0 z-10">
                      <div class="flex items-center gap-2">
