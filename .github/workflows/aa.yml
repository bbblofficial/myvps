                          <div class="text-center mt-2">
                              <p class="text-[11px] text-gray-400 dark:text-gray-500">
                                  PolyGuard Ensemble · weighted voting · strict thresholds
                              </p>
                          </div>
                      </div>
                  </div>
              </main>

              <!-- ============ SETTINGS MODAL ============ -->
              <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
                  <div class="bg-white dark:bg-gpt-input border border-gray-200 dark:border-white/10 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-fadeIn">
                      <div class="flex items-center justify-between border-b border-gray-200 dark:border-white/10 pb-3">
