                              <i class="fa-solid fa-table-columns"></i>
                          </button>
                          <button onclick="createNewAnalysis()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gpt-hover md:hidden">
                              <i class="fa-regular fa-pen-to-square"></i>
                          </button>
                          <div class="flex items-center gap-2 px-3 py-1.5 font-semibold text-base text-gray-800 dark:text-gray-100">
                              <i class="fa-solid fa-shield-halved text-gpt-accent"></i>
                              <span>PolyGuard</span>
                              <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">5 Models</span>
                          </div>
                      </div>
                      <div class="flex items-center gap-1.5">
                          <button onclick="exportCurrentAnalysis()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gpt-hover transition-colors" title="Export as JSON">
                              <i class="fa-solid fa-download text-sm"></i>
                          </button>
                          <button onclick="toggleTheme()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gpt-hover transition-colors" title="Toggle theme">
                              <i id="theme-icon" class="fa-solid fa-sun text-sm"></i>
                          </button>
                      </div>
                  </header>

                  <!-- Messages / Results -->
                  <div id="messages-container" class="flex-1 overflow-y-auto px-4 py-6 scroll-smooth">
                      <div class="max-w-3xl mx-auto h-full flex flex-col">

                          <!-- Welcome -->
                          <div id="welcome-screen" class="my-auto py-8 flex flex-col items-center text-center">
                              <div class="w-14 h-14 rounded-2xl bg-gpt-accent/10 border border-gpt-accent/30 text-gpt-accent flex items-center justify-center text-2xl mb-5">
                                  <i class="fa-solid fa-shield-halved"></i>
                              </div>
                              <h1 class="text-2xl sm:text-3xl font-semibold text-gray-800 dark:text-gray-100 mb-2">
                                  تشخیص محتوای سمی
                              </h1>
                              <p class="text-sm text-gray-500 dark:text-gray-400 max-w-md mb-8">
                                  ۵ مدل هوش مصنوعی با رأی‌گیری وزنی — آستانه سختگیرانه (TOXIC ≥ 0.05، SUSPECT ≥ 0.02)
                              </p>

                              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl text-right" dir="rtl">
                                  <button onclick="useStarter('کصکش')" class="group p-4 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-gpt-input/40 hover:bg-gray-100 dark:hover:bg-gpt-input transition-all flex flex-col gap-2">
                                      <div class="flex items-center justify-between w-full">
                                          <span class="text-xs font-semibold uppercase tracking-wider text-red-500">Test: Toxic FA</span>
                                          <i class="fa-solid fa-flask text-gray-400 group-hover:text-red-500"></i>
                                      </div>
                                      <p class="text-sm font-medium text-gray-700 dark:text-gray-200">فحش فارسی رکیک</p>
                                  </button>

                                  <button onclick="useStarter('You are an idiot')" class="group p-4 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-gpt-input/40 hover:bg-gray-100 dark:hover:bg-gpt-input transition-all flex flex-col gap-2">
                                      <div class="flex items-center justify-between w-full">
                                          <span class="text-xs font-semibold uppercase tracking-wider text-amber-500">Test: Toxic EN</span>
                                          <i class="fa-solid fa-flask text-gray-400 group-hover:text-amber-500"></i>
                                      </div>
                                      <p class="text-sm font-medium text-gray-700 dark:text-gray-200">Insult in English</p>
                                  </button>

                                  <button onclick="useStarter('سلام، حال شما چطور است؟')" class="group p-4 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-gpt-input/40 hover:bg-gray-100 dark:hover:bg-gpt-input transition-all flex flex-col gap-2">
                                      <div class="flex items-center justify-between w-full">
                                          <span class="text-xs font-semibold uppercase tracking-wider text-emerald-500">Test: Safe FA</span>
                                          <i class="fa-solid fa-circle-check text-gray-400 group-hover:text-emerald-500"></i>
                                      </div>
                                      <p class="text-sm font-medium text-gray-700 dark:text-gray-200">جمله محترمانه فارسی</p>
                                  </button>

                                  <button onclick="useStarter('Have a wonderful day!')" class="group p-4 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-gpt-input/40 hover:bg-gray-100 dark:hover:bg-gpt-input transition-all flex flex-col gap-2">
                                      <div class="flex items-center justify-between w-full">
                                          <span class="text-xs font-semibold uppercase tracking-wider text-sky-500">Test: Safe EN</span>
                                          <i class="fa-solid fa-circle-check text-gray-400 group-hover:text-sky-500"></i>
