      # ============================================================
      # 4. CADDY + CLOUDFLARE TUNNEL
      # ============================================================
      - name: Setup Caddy
        run: |
          set -euo pipefail
          wget -qO caddy.tar.gz "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz"
          tar -xzf caddy.tar.gz caddy
          chmod +x caddy

          cat > Caddyfile <<'EOF'
          :3000 {
              handle_path /image/* {
                  reverse_proxy 127.0.0.1:8000 {
                      transport http {
                          read_timeout  900s
                          write_timeout 900s
                          dial_timeout  30s
                      }
                  }
              }
              handle /api/* {
                  reverse_proxy 127.0.0.1:11434 {
                      header_up Host   "127.0.0.1:11434"
                      header_up Origin "http://localhost"
                      transport http {
                          read_timeout  900s
                          write_timeout 900s
                          dial_timeout  30s
                      }
                  }
              }
              handle {
                  root * web
                  file_server
              }
          }
          EOF

          nohup ./caddy run --config Caddyfile > caddy.log 2>&1 &
          for i in $(seq 1 15); do
            curl -s http://127.0.0.1:3000/ >/dev/null && { echo "Caddy up."; break; }
            sleep 1
          done

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://foo.trycloudflare.com' \
            -H 'Content-Type: application/json' \
            -d '{"model":"__probe__","messages":[{"role":"user","content":"x"}],"stream":false}' \
            http://127.0.0.1:3000/api/chat)
          echo "Caddy -> Ollama /api/chat: HTTP $CODE"
          if [ "$CODE" = "403" ]; then
            echo "::error::Origin blocked by Ollama"; cat caddy.log; exit 1
          fi

          CODE2=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/image/health)
          echo "Caddy -> /image/health: HTTP $CODE2"

          CODE3=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          echo "Caddy -> / (UI): HTTP $CODE3"

      - name: Start Cloudflare tunnel
        run: |
          set -euo pipefail
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > cf.log 2>&1 &
          PID=$!
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log 2>/dev/null | head -n1 || true)
            [ -n "$URL" ] && break
            kill -0 $PID 2>/dev/null || { echo "::error::cloudflared died"; cat cf.log; exit 1; }
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; cat cf.log; exit 1; }
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV

          {
            echo "### Unified AI Panel is live"
            echo ""
            echo "**URL:** [$URL]($URL)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Chat | \`qwen2.5:7b-instruct\` |"
            echo "| Image | SD 1.5 on CPU (q8_0) — a few minutes per image |"
            echo "| UI | Claude-style single-page app, dark/light theme, KaTeX, highlight.js |"
            echo ""
            echo "The page supports: Markdown, code highlighting, LaTeX, conversation history, model install/delete, and CPU image generation."
          } >> $GITHUB_STEP_SUMMARY

      - name: Keep alive (6h)
        run: |
          echo "Live at: ${{ env.PUBLIC_URL }}"
          sleep 21600
