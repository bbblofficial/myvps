          .models-list .ok { color: var(--ok); } .models-list .err { color: var(--bad); }
          .modal-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
          .btn-primary { background: var(--btn-bg); color: var(--btn-fg); padding: 8px 20px; border-radius: 9999px; font-size: 14px; font-weight: 500; }
          .btn-primary:hover { opacity: .88; }
          .btn-danger { display: inline-flex; align-items: center; gap: 6px; color: var(--bad); padding: 8px 12px; border-radius: 10px; font-size: 13.5px; }
          .btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
          .btn-danger svg.ic { width: 16px; height: 16px; }

          .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; background: var(--btn-bg); color: var(--btn-fg); padding: 9px 18px; border-radius: 9999px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-pop); }
          .toast svg.ic { width: 15px; height: 15px; color: var(--ok); }

          .backdrop { display: none; }

          /* ---------- mobile ---------- */
          @media (max-width: 767px) {
            .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 280px !important; z-index: 40; transform: translateX(100%); transition: transform .22s ease; box-shadow: var(--shadow-pop); }
            .sidebar-inner { width: 280px; }
            .app.mobile-open .sidebar { transform: none; }
            .app.mobile-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; }
            #open-sidebar-btn, #new-chat-top-btn { display: inline-flex !important; }
            .hero { font-size: 22px; }
            .bubble { max-width: 88%; }
            .dropdown { width: 280px; }
            .main.welcome .composer-area { padding-bottom: 6vh; }
          }
          CSSEOF

          cat > app/static/script.js << 'JSEOF'
          const STORAGE_KEY = 'polyguard_threads_v4';

          const state = {
            threads: [],
            activeThreadId: null,
            isAnalyzing: false,
            viewMode: 'detailed',
            health: null
          };

          /* ---------------- icons (inline SVG, no external dependency) ---------------- */
          const ICONS = {
            shield:  '<path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
            sidebar: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/>',
            edit:    '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4 11.5-11.5z"/>',
            search:  '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
            layers:  '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
            chevron: '<path d="M6 9l6 6 6-6"/>',
            check:   '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
            share:   '<path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/>',
            sun:     '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            moon:    '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
            plus:    '<path d="M12 5v14M5 12h14"/>',
            sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
            arrowup: '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
            smile:   '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9.5h.01M15 9.5h.01"/>',
            globe:   '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9S14.500 18.300 12 21c-2.500-2.700-3.800-5.700-3.800-9S9.500 5.700 12 3z"/>',
            alert:   '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/>',
            x:       '<path d="M6 6l12 12M18 6L6 18"/>',
            trash:   '<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
            copy:    '<rect x="9" y="9" width="11" height="11" rx="2.500"/><path d="M5 15V6a2 2 0 012-2h9"/>',
            code:    '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
            refresh: '<path d="M20 11a8 8 0 10-2.300 5.700"/><path d="M20 5v6h-6"/>',
            lang:    '<path d="M4 5h9M8.500 3v2M6 5c.5 4 3 7 6 8M12 5c-.5 4-3 7-6 8"/><path d="M13 20l4-9 4 9M14.500 17h5"/>'
          };

          function svg(name) {
            return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
          }
          function hydrateIcons(root) {
            (root || document).querySelectorAll('i[data-i]').forEach(el => {
              if (!el.firstChild) el.innerHTML = svg(el.dataset.i);
            });
          }

          /* ---------------- init ---------------- */
          window.addEventListener('DOMContentLoaded', () => {
            hydrateIcons();
            loadState();
            syncThemeIcon();
            renderSidebarThreads();
            renderActiveThread();
            checkHealth();
            setInterval(checkHealth, 12000);
            if (window.innerWidth < 768) document.getElementById('app').classList.remove('collapsed');
            document.getElementById('prompt-input').focus();
            document.addEventListener('click', () => document.getElementById('model-dropdown').classList.add('hidden'));
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettingsModal(); });
          });

          function loadState() {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              if (raw) {
                const p = JSON.parse(raw);
                state.threads = p.threads || [];
                state.activeThreadId = p.activeThreadId || null;
                state.viewMode = p.viewMode || 'detailed';
              }
            } catch (e) { console.warn(e); }
            updateViewModeCheckmarks();
          }

          function saveState() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({
                threads: state.threads, activeThreadId: state.activeThreadId, viewMode: state.viewMode
              }));
            } catch (e) { console.warn(e); }
          }

          /* ---------------- health ---------------- */
          async function checkHealth() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            try {
              const r = await fetch('/health');
              const d = await r.json();
              state.health = d;
              const n = (d.loaded_models || []).length;
              if (d.status === 'ok') {
                dot.className = 'sdot ok';
                txt.textContent = `${n}/5 مدل فعال`;
              } else if (d.status === 'loading') {
                dot.className = 'sdot warn';
                txt.textContent = `بارگذاری مدل‌ها (${n}/5)…`;
              } else {
                dot.className = 'sdot bad';
                txt.textContent = 'خطا در بارگذاری';
              }
              const c = document.getElementById('cfg-concurrency');
              if (c && d.concurrency) c.textContent = `${d.concurrency} (Peak ${d.peak || 0})`;
              const m = document.getElementById('cfg-models');
              if (m) {
                const ok = (d.loaded_models || []).map(x => `<div class="ml"><span>${escapeHtml(x)}</span><span class="ok">● Ready</span></div>`).join('');
                const er = Object.keys(d.errors || {}).map(x => `<div class="ml"><span>${escapeHtml(x)}</span><span class="err">● Error</span></div>`).join('');
                m.innerHTML = (ok + er) || 'مدلی بارگذاری نشده';
              }
            } catch (e) {
              dot.className = 'sdot bad';
              txt.textContent = 'سرور آفلاین';
            }
          }

          /* ---------------- sidebar ---------------- */
          function toggleSidebar() {
            const app = document.getElementById('app');
            if (window.innerWidth < 768) app.classList.toggle('mobile-open');
            else app.classList.toggle('collapsed');
          }
          function closeMobileSidebar() { document.getElementById('app').classList.remove('mobile-open'); }

          function toggleSearchInput() {
            const box = document.getElementById('sidebar-search-box');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) document.getElementById('search-threads').focus();
          }

          function createNewThread() {
            if (state.isAnalyzing) return;
            state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            closeMobileSidebar();
            document.getElementById('prompt-input').focus();
          }

          function selectThread(id) {
            if (state.isAnalyzing) return;
            state.activeThreadId = id;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            closeMobileSidebar();
          }

          function deleteThread(event, id) {
            event.stopPropagation();
            state.threads = state.threads.filter(t => t.id !== id);
            if (state.activeThreadId === id) state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            showToast('گفتگو حذف شد');
          }

          function clearAllHistory() {
            if (!confirm('آیا تمام تاریخچه گفتگوها پاک شود؟')) return;
            state.threads = [];
            state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            closeSettingsModal();
            showToast('تاریخچه پاک شد');
          }

          function renderSidebarThreads() {
            const box = document.getElementById('threads-list');
            const q = (document.getElementById('search-threads')?.value || '').toLowerCase().trim();

            const list = state.threads
              .filter(t => !q || (t.title || '').toLowerCase().includes(q) ||
                           (t.messages || []).some(m => (m.text || '').toLowerCase().includes(q)))
              .sort((a, b) => b.updatedAt - a.updatedAt);

            if (!list.length) {
              box.innerHTML = `<div class="sb-empty">${q ? 'موردی یافت نشد' : 'هنوز گفتگویی ثبت نشده است'}</div>`;
              return;
            }

            const now = Date.now(), day = 86400000;
            const groups = { 'امروز': [], '۷ روز گذشته': [], 'قدیمی‌تر': [] };
            list.forEach(t => {
              const age = now - (t.updatedAt || t.createdAt || now);
              (age < day ? groups['امروز'] : age < day * 7 ? groups['۷ روز گذشته'] : groups['قدیمی‌تر']).push(t);
            });

            let html = '';
            for (const [label, items] of Object.entries(groups)) {
              if (!items.length) continue;
              html += `<div class="sb-group-label">${label}</div>`;
              items.forEach(t => {
                const last = t.messages?.[t.messages.length - 1]?.result?.decision;
                const dotCls = last === 'TOXIC' ? 'dot-bad' : last === 'SUSPECT' ? 'dot-warn' : 'dot-ok';
                html += `
                  <div class="thread ${t.id === state.activeThreadId ? 'active' : ''}" onclick="selectThread('${t.id}')">
                    <div class="t-left"><span class="t-dot ${dotCls}"></span><span class="t-title">${escapeHtml(t.title || 'تحلیل جدید')}</span></div>
                    <button class="t-del" onclick="deleteThread(event,'${t.id}')" title="حذف">${svg('trash')}</button>
                  </div>`;
              });
            }
            box.innerHTML = html;
          }

          /* ---------------- chat rendering ---------------- */
          function setWelcome(on) {
            document.getElementById('main').classList.toggle('welcome', on);
          }

          function renderActiveThread() {
            const stream = document.getElementById('chat-stream');
            const thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread || !thread.messages.length) {
              setWelcome(true);
              stream.innerHTML = '';
              return;
            }
            setWelcome(false);
            stream.innerHTML = thread.messages.map(buildTurnHTML).join('');
            scrollToBottom(false);
          }

          const DECISIONS = {
            TOXIC:   { title: 'محتوای سمی شناسایی شد',   text: 'بر اساس رأی‌گیری اجماعی مدل‌ها، این متن حاوی الفاظ توهین‌آمیز یا سمی است.' },
            SUSPECT: { title: 'محتوای مشکوک',            text: 'برخی مدل‌ها احتمال سمیت متوسطی دیده‌اند اما اجماع کافی وجود ندارد؛ بازبینی انسانی پیشنهاد می‌شود.' },
            SAFE:    { title: 'محتوای سالم',             text: 'هیچ‌یک از مدل‌ها نشانه‌ای از توهین یا سمیت در این متن پیدا نکردند.' }
          };

          function scriptLabel(s) { return s === 'fa' ? 'فارسی' : s === 'en' ? 'انگلیسی' : 'مختلط'; }

          function buildTurnHTML(msg) {
            const user = `<div class="msg user fade"><div class="bubble" dir="auto">${escapeHtml(msg.text)}</div></div>`;
            const r = msg.result;

            if (!r || r.error) {
              const e = r && r.error ? (typeof r.error === 'string' ? r.error : JSON.stringify(r.error)) : 'پاسخی از سرور دریافت نشد';
              return `${user}
                <div class="msg bot fade"><div class="bot-body">
                  <div class="err-box">خطا در پردازش: ${escapeHtml(e)}</div>
                  <div class="actions"><button class="icon-btn" onclick="reAnalyze('${msg.id}')" title="تلاش مجدد">${svg('refresh')}</button></div>
                </div></div>`;
            }

            const meta = DECISIONS[r.decision] || { title: 'نتیجه نامشخص', text: 'پاسخ معتبری از سرور دریافت نشد.' };

            const rows = Object.keys(r.raw_scores || {}).map(key => {
              const raw = r.raw_scores[key];
              const voted = r.votes[key];
              const w = (r.weights && r.weights[key]) || 1;
              const pct = Math.min(100, raw * 100).toFixed(1);
              const fill = voted ? 'f-bad' : raw >= 0.35 ? 'f-warn' : 'f-ok';
              return `
                <div class="mrow">
                  <div class="mrow-top">
                    <div class="mrow-name">
                      <span class="tag ${voted ? 'bad' : 'ok'}">${voted ? 'رأی سمی' : 'سالم'}</span>
                      <span class="n">${escapeHtml(r.labels?.[key] || key)}</span>
                    </div>
                    <div class="mrow-val mono"><span>${pct}%</span><span>×${w}</span></div>
                  </div>
                  <div class="bar"><div class="${fill}" style="width:${pct}%"></div></div>
                </div>`;
            }).join('');

            const skipped = (r.skipped_models && r.skipped_models.length)
              ? `<div class="bd-foot">${svg('alert')}<span>فیلتر زبان (${scriptLabel(r.script)}): مدل‌های <span class="mono">${r.skipped_models.map(escapeHtml).join(', ')}</span> نادیده گرفته شدند.</span></div>`
              : '';

            let fing = '';
            if (r.fingilish_detected && r.fingilish_text) {
              const a = r.analysis || {};
              const o = a.original?.decision, f = a.fingilish?.decision;
              fing = `
                <div class="note">${svg('lang')}
                  <div>
                    <b>این متن فینگیلیش تشخیص داده شد</b> و علاوه بر متن اصلی، به فارسی هم بررسی شد.
                    <div class="fp" dir="rtl">${escapeHtml(r.fingilish_text)}</div>
                    <div class="mono" style="margin-top:2px;font-size:12px;">original: ${escapeHtml(o || '-')} · fingilish: ${escapeHtml(f || '-')}</div>
                  </div>
                </div>`;
            }

            const detailed = state.viewMode === 'detailed';
            const breakdown = `
              <details class="breakdown" ${detailed ? 'open' : ''}>
                <summary>ریز نمرات مدل‌ها ${svg('chevron')}</summary>
                <div class="bd-card">${rows}${skipped}</div>
              </details>`;

            return `${user}
              <div class="msg bot fade"><div class="bot-body">
                <div class="verdict ${r.decision}"><span class="vd"></span>${meta.title}</div>
                <p class="bot-text">${meta.text}</p>
                ${fing}
                <div class="stats">
                  <div class="stat"><div class="k">آرای سمیت</div><div class="v mono">${r.votes_count} / ${r.total_models}</div></div>
                  <div class="stat"><div class="k">بیشترین نمره</div><div class="v mono">${(r.max_raw * 100).toFixed(1)}%</div></div>
                  <div class="stat"><div class="k">اطمینان</div><div class="v mono">${(r.confidence * 100).toFixed(1)}%</div></div>
                  <div class="stat"><div class="k">زبان</div><div class="v">${scriptLabel(r.script)}</div></div>
                </div>
                ${breakdown}
                <div class="actions">
                  <button class="icon-btn" onclick="copyReport('${msg.id}')" title="کپی گزارش">${svg('copy')}</button>
                  <button class="icon-btn" onclick="copyMessageJSON('${msg.id}')" title="کپی JSON">${svg('code')}</button>
                  <button class="icon-btn" onclick="reAnalyze('${msg.id}')" title="تحلیل مجدد">${svg('refresh')}</button>
                  <span class="lat mono">${r.latency_ms ? r.latency_ms + ' ms' : ''}</span>
                </div>
              </div></div>`;
          }

          /* ---------------- analyze ---------------- */
          async function analyze(overrideText) {
            const input = document.getElementById('prompt-input');
            const text = (typeof overrideText === 'string' ? overrideText : input.value).trim();
            if (!text || state.isAnalyzing) return;

            state.isAnalyzing = true;
            document.getElementById('send-btn').disabled = true;
            if (typeof overrideText !== 'string') {
              input.value = '';
              autoResize(input);
            }

            let thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread) {
              thread = {
                id: 'th_' + Date.now(),
                title: text.slice(0, 40) + (text.length > 40 ? '…' : ''),
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: []
              };
              state.threads.unshift(thread);
              state.activeThreadId = thread.id;
            }

            appendPendingTurn(text);

            try {
              const r = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
              });
              let result;
              try { result = await r.json(); }
              catch (_) { result = { error: `پاسخ نامعتبر (HTTP ${r.status})` }; }

              thread.messages.push({ id: 'msg_' + Date.now(), text, result, ts: Date.now() });
              thread.updatedAt = Date.now();
              saveState();
              renderSidebarThreads();
              renderActiveThread();
            } catch (e) {
              showToast('خطا در ارتباط با سرور');
              renderActiveThread();
            } finally {
              state.isAnalyzing = false;
              autoResize(input);
              input.focus();
            }
          }

          function appendPendingTurn(text) {
            setWelcome(false);
            const stream = document.getElementById('chat-stream');
            const old = document.getElementById('pending-turn');
            if (old) old.remove();
            const div = document.createElement('div');
            div.id = 'pending-turn';
            div.style.display = 'contents';
            div.innerHTML = `
              <div class="msg user fade"><div class="bubble" dir="auto">${escapeHtml(text)}</div></div>
              <div class="msg bot fade"><div class="bot-body"><span class="thinking"></span></div></div>`;
            stream.appendChild(div);
            scrollToBottom(true);
          }

          function reAnalyze(msgId) {
            const msg = findMessage(msgId);
            if (msg) analyze(msg.text);
          }

          /* ---------------- composer ---------------- */
          function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
            const c = document.getElementById('char-counter');
            if (el.value.length) { c.textContent = el.value.length; c.classList.remove('hidden'); }
            else c.classList.add('hidden');
            document.getElementById('send-btn').disabled = !el.value.trim() || state.isAnalyzing;
          }

          function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
              e.preventDefault();
              analyze();
            }
          }

          function useStarter(text) { analyze(text); }

          async function pasteClipboard() {
            try {
              const t = await navigator.clipboard.readText();
              if (t) {
                const input = document.getElementById('prompt-input');
                input.value = t;
                autoResize(input);
                input.focus();
              }
            } catch (e) { showToast('دسترسی به کلیپ‌بورد ممکن نیست'); }
          }

          /* ---------------- dropdown / theme / modal ---------------- */
          function toggleModelDropdown(e) {
            e.stopPropagation();
            document.getElementById('model-dropdown').classList.toggle('hidden');
          }

          function setViewMode(mode) {
            state.viewMode = mode;
            saveState();
            updateViewModeCheckmarks();
            renderActiveThread();
            document.getElementById('model-dropdown').classList.add('hidden');
          }

          function updateViewModeCheckmarks() {
            const d = document.getElementById('check-detailed');
            const c = document.getElementById('check-compact');
            if (!d || !c) return;
            d.classList.toggle('hidden', state.viewMode !== 'detailed');
            c.classList.toggle('hidden', state.viewMode === 'detailed');
          }

          function syncThemeIcon() {
            const icon = document.getElementById('theme-icon');
            icon.innerHTML = svg(document.documentElement.classList.contains('dark') ? 'sun' : 'moon');
          }

          function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
            try { localStorage.setItem('polyguard_theme', root.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
            syncThemeIcon();
          }

          function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); checkHealth(); closeMobileSidebar(); }
          function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }

          function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.add('hidden'), 2200);
          }

          /* ---------------- helpers ---------------- */
          function scrollToBottom(smooth) {
            const c = document.getElementById('messages-container');
            c.scrollTo({ top: c.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
          }

          function findMessage(id) {
            for (const t of state.threads) {
              const f = t.messages.find(m => m.id === id);
              if (f) return f;
            }
            return null;
          }

          function copyText(s) {
            if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
            const ta = document.createElement('textarea');
            ta.value = s; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            ta.remove();
            return Promise.resolve();
          }

          function copyMessageJSON(id) {
            const m = findMessage(id);
            if (!m) return;
            copyText(JSON.stringify(m.result, null, 2)).then(() => showToast('JSON کپی شد'));
          }

          function copyReport(id) {
            const m = findMessage(id);
            if (!m || !m.result) return;
            const r = m.result;
            copyText(`متن: "${m.text}"\nنتیجه: ${r.decision} (اطمینان ${(r.confidence * 100).toFixed(1)}% | آرا ${r.votes_count}/${r.total_models})`)
              .then(() => showToast('گزارش کپی شد'));
          }

          function exportCurrentThread() {
            const t = state.threads.find(x => x.id === state.activeThreadId);
            if (!t) { showToast('گفتگویی برای خروجی انتخاب نشده'); return; }
            const blob = new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `polyguard_${t.id}.json`; a.click();
            URL.revokeObjectURL(url);
            showToast('فایل JSON دانلود شد');
          }

          function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
          }
          JSEOF

          echo "All app files created"
          ls -R app

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start FastAPI server (preloaded, multi-worker)
        run: |
          nohup gunicorn app.main:app \
              --workers 2 \
              --worker-class uvicorn.workers.UvicornWorker \
              --preload \
              --bind 0.0.0.0:8000 \
              --timeout 180 \
              --graceful-timeout 30 \
              --keep-alive 5 \
              > server.log 2>&1 &

          echo "Waiting for models to load (~120-300s)..."
          STATUS=""
          for i in $(seq 1 300); do
            STATUS=$(curl -fs http://localhost:8000/health 2>/dev/null || true)
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Ready after ${i} checks (~$((i*2))s)"
              break
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "  ... loading (${i}/300) - $STATUS"
            fi
            sleep 2
          done
          echo "$STATUS"
          if ! echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "Models never became healthy"
            tail -n 120 server.log || true
            exit 1
          fi

      - name: Smoke tests (Fingilish vs English, concurrency)
        continue-on-error: true
        run: |
          check() {
            curl -s -X POST http://localhost:8000/api/check \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$1\"}"
          }
          summarize() {
            python3 -c 'import sys,json; r=json.load(sys.stdin); print({k:r.get(k) for k in ("decision","fingilish_detected","fingilish_text","script","votes_count","max_raw","error")})'
          }

          echo "=== health ==="
          curl -s http://localhost:8000/health | head -c 400; echo

          echo "=== 'kir' (Fingilish, expect TOXIC + fingilish_detected=True) ==="
          check "kir" | summarize

          echo "=== 'Have a wonderful and productive day ahead!' (English, expect SAFE + fingilish_detected=False) ==="
          check "Have a wonderful and productive day ahead!" | summarize

          echo "=== 'hi' (short English, regression for RecursionError) ==="
          check "hi" | summarize

          echo "=== 'You are completely stupid and useless' (English insult, expect TOXIC) ==="
          check "You are completely stupid and useless" | summarize

          echo "=== 8 parallel requests ==="
          time (
            for n in $(seq 1 8); do
              curl -s -X POST http://localhost:8000/api/check \
                -H 'Content-Type: application/json' \
                -d '{"text":"You are crazy"}' \
                -o /tmp/resp_$n.json &
            done
            wait
          )
          head -c 300 /tmp/resp_1.json; echo

          echo "=== RAM usage ==="
          ps -eo pid,rss,cmd | grep -E "gunicorn|uvicorn" | grep -v grep | head -n 20

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          echo "Waiting for trycloudflare URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Could not obtain tunnel URL"
            cat tunnel.log
            exit 1
          fi
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "### PolyGuard Ensemble is live at: $URL" >> $GITHUB_STEP_SUMMARY
          echo "$URL"

      - name: Keep service alive
        run: |
          echo "Service running at: $PUBLIC_URL"
          echo "Will self-terminate after ~5 hours."
          for i in $(seq 1 300); do
            sleep 60
            pgrep -f "gunicorn app.main:app" >/dev/null || {
              echo "Gunicorn died, restarting..."
              nohup gunicorn app.main:app \
                  --workers 2 \
                  --worker-class uvicorn.workers.UvicornWorker \
                  --preload \
                  --bind 0.0.0.0:8000 \
                  --timeout 180 \
                  --graceful-timeout 30 \
                  --keep-alive 5 \
                  >> server.log 2>&1 &
            }
            pgrep -f "cloudflared tunnel" >/dev/null || {
              echo "Cloudflared died, restarting..."
              nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate >> tunnel.log 2>&1 &
            }
          done
