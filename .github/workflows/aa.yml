          cat > app/static/script.js << 'JSEOF'
          const STORAGE_KEY = 'polyguard_chatgpt_threads_v3';

          const state = {
            threads: [],
            activeThreadId: null,
            sidebarOpen: true,
            isAnalyzing: false,
            viewMode: 'detailed',
            health: null
          };

          window.onload = function () {
            loadState();
            renderSidebarThreads();
            renderActiveThread();
            checkHealth();
            setInterval(checkHealth, 12000);
            document.getElementById('prompt-input').focus();

            document.addEventListener('click', (e) => {
              const dd = document.getElementById('model-dropdown');
              if (dd && !dd.classList.contains('hidden')) {
                dd.classList.add('hidden');
              }
            });
          };

          function loadState() {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              if (raw) {
                const parsed = JSON.parse(raw);
                state.threads = parsed.threads || [];
                state.activeThreadId = parsed.activeThreadId || null;
                state.viewMode = parsed.viewMode || 'detailed';
              }
            } catch (e) { console.warn(e); }
            updateViewModeCheckmarks();
          }

          function saveState() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({
                threads: state.threads,
                activeThreadId: state.activeThreadId,
                viewMode: state.viewMode
              }));
            } catch (e) { console.warn(e); }
          }

          async function checkHealth() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            try {
              const r = await fetch('/health');
              const d = await r.json();
              state.health = d;
              if (d.status === 'ok') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
                const inflight = d.inflight || 0;
                txt.textContent = `${d.loaded_models.length}/5 مدل · ${inflight} در حال پردازش`;
              } else if (d.status === 'loading') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
                txt.textContent = `بارگذاری مدل‌ها (${(d.loaded || []).length}/5)…`;
              } else {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
                txt.textContent = 'خطا در بارگذاری';
              }
              const cfgC = document.getElementById('cfg-concurrency');
              if (cfgC && d.concurrency) {
                cfgC.textContent = `${d.concurrency} همزمان (Peak: ${d.peak || 0})`;
              }
              const cfgM = document.getElementById('cfg-models');
              if (cfgM && d.loaded_models) {
                cfgM.innerHTML = d.loaded_models.map(m => `<div class="flex items-center justify-between py-0.5"><span>${m}</span><span class="text-emerald-500">● Ready</span></div>`).join('') +
                  (d.errors && Object.keys(d.errors).length
                    ? `<div class="text-rose-500 pt-1">خطا: ${Object.keys(d.errors).join(', ')}</div>`
                    : '');
              }
            } catch (e) {
              dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
              txt.textContent = 'سرور آفلاین';
            }
          }

          function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('mobile-backdrop');
            const openBtn = document.getElementById('open-sidebar-btn');
            const newChatTopBtn = document.getElementById('new-chat-top-btn');
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
              const hidden = sidebar.classList.contains('translate-x-full');
              if (hidden) {
                sidebar.classList.remove('translate-x-full');
                backdrop.classList.remove('hidden');
              } else {
                sidebar.classList.add('translate-x-full');
                backdrop.classList.add('hidden');
              }
            } else {
              state.sidebarOpen = !state.sidebarOpen;
              if (state.sidebarOpen) {
                sidebar.classList.remove('md:-mr-[260px]');
                openBtn.classList.add('md:hidden');
                newChatTopBtn.classList.add('md:hidden');
              } else {
                sidebar.classList.add('md:-mr-[260px]');
                openBtn.classList.remove('md:hidden');
                newChatTopBtn.classList.remove('md:hidden');
              }
            }
          }

          function toggleSearchInput() {
            const box = document.getElementById('sidebar-search-box');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
              document.getElementById('search-threads').focus();
            }
          }

          function createNewThread() {
            if (state.isAnalyzing) return;
            state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            if (window.innerWidth < 768) {
              const sidebar = document.getElementById('sidebar');
              if (!sidebar.classList.contains('translate-x-full')) toggleSidebar();
            }
            document.getElementById('prompt-input').focus();
          }

          function selectThread(id) {
            if (state.isAnalyzing) return;
            state.activeThreadId = id;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            if (window.innerWidth < 768) toggleSidebar();
          }

          function deleteThread(event, id) {
            event.stopPropagation();
            state.threads = state.threads.filter(t => t.id !== id);
            if (state.activeThreadId === id) state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            showToast('گفتگو حذف شد');
          }

          function clearAllHistory() {
            if (!confirm('آیا تمام تاریخچه گفتگوها پاک شود؟')) return;
            state.threads = [];
            state.activeThreadId = null;
            saveState();
            renderSidebarThreads();
            renderActiveThread();
            closeSettingsModal();
            showToast('تاریخچه پاکسازی شد');
          }

          function renderSidebarThreads() {
            const container = document.getElementById('threads-list');
            const query = (document.getElementById('search-threads')?.value || '').toLowerCase().trim();

            const filtered = state.threads
              .filter(t => {
                if (!query) return true;
                const inTitle = (t.title || '').toLowerCase().includes(query);
                const inMsgs = (t.messages || []).some(m => (m.text || '').toLowerCase().includes(query));
                return inTitle || inMsgs;
              })
              .sort((a, b) => b.updatedAt - a.updatedAt);

            if (!filtered.length) {
              container.innerHTML = `
                <div class="px-3 py-8 text-center text-xs text-token-tertiary">
                  ${query ? 'موردی یافت نشد' : 'هنوز گفتگویی ثبت نشده است'}
                </div>`;
              return;
            }

            const now = Date.now();
            const oneDay = 86400000;
            const groups = { 'امروز': [], '۷ روز گذشته': [], 'قدیمی‌تر': [] };
            filtered.forEach(t => {
              const age = now - (t.updatedAt || t.createdAt || now);
              if (age < oneDay) groups['امروز'].push(t);
              else if (age < oneDay * 7) groups['۷ روز گذشته'].push(t);
              else groups['قدیمی‌تر'].push(t);
            });

            let html = '';
            for (const [label, items] of Object.entries(groups)) {
              if (!items.length) continue;
              html += `<div class="space-y-0.5">
                <div class="px-2.5 py-1 text-[11px] font-medium text-token-tertiary">${label}</div>`;
              items.forEach(t => {
                const isActive = t.id === state.activeThreadId;
                const lastMsg = t.messages?.[t.messages.length - 1];
                const badgeDot = lastMsg?.result?.decision === 'TOXIC'
                  ? 'bg-rose-500'
                  : lastMsg?.result?.decision === 'SUSPECT'
                  ? 'bg-amber-400'
                  : 'bg-emerald-500';
                html += `
                  <div onclick="selectThread('${t.id}')"
                       class="group flex items-center justify-between px-2.5 py-2 rounded-lg cursor-pointer text-[13px] transition-colors ${isActive ? 'bg-token-hover text-token-primary font-medium' : 'text-token-secondary hover:bg-token-hover/60 hover:text-token-primary'}">
                    <div class="flex items-center gap-2 truncate pl-1">
                      <span class="w-1.5 h-1.5 rounded-full ${badgeDot} shrink-0"></span>
                      <span class="truncate">${escapeHtml(t.title || 'تحلیل جدید')}</span>
                    </div>
                    <button onclick="deleteThread(event, '${t.id}')"
                            class="opacity-0 group-hover:opacity-100 text-token-tertiary hover:text-rose-500 px-1 transition-opacity"
                            title="حذف گفتگو">
                      <i class="fa-regular fa-trash-can text-xs"></i>
                    </button>
                  </div>`;
              });
              html += `</div>`;
            }
            container.innerHTML = html;
          }

          function renderActiveThread() {
            const welcome = document.getElementById('welcome-screen');
            const stream = document.getElementById('chat-stream');
            const thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread || !thread.messages.length) {
              welcome.classList.remove('hidden');
              stream.classList.add('hidden');
              stream.innerHTML = '';
              return;
            }
            welcome.classList.add('hidden');
            stream.classList.remove('hidden');
            stream.innerHTML = thread.messages.map(m => buildTurnHTML(m)).join('');
            scrollToBottom();
          }

          function buildTurnHTML(msg) {
            const userHTML = `
              <div class="flex justify-start w-full animate-fadeIn">
                <div class="max-w-[85%] sm:max-w-[75%] bg-token-surface text-token-primary px-4 py-2.5 rounded-3xl text-[15px] leading-relaxed whitespace-pre-wrap break-words" dir="auto">${escapeHtml(msg.text)}</div>
              </div>`;

            const r = msg.result;
            if (!r || r.error) {
              return `
                <article class="space-y-4">
                  ${userHTML}
                  <div class="flex items-start gap-3.5 animate-fadeIn">
                    <div class="w-7 h-7 rounded-full border border-token-border bg-token-surface flex items-center justify-center text-xs shrink-0 mt-0.5">
                      <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="bg-rose-500/10 border border-rose-500/20 text-rose-500 px-4 py-3 rounded-2xl text-sm">
                        خطا در پردازش: ${escapeHtml(r?.error || 'پاسخی از سرور دریافت نشد')}
                      </div>
                    </div>
                  </div>
                </article>`;
            }

            const decisionMeta = {
              TOXIC: {
                badgeBg: 'bg-rose-500/15 text-rose-500 border-rose-500/30',
                title: 'محتوای سمی شناسایی شد (TOXIC)',
                summary: 'بر اساس رأی‌گیری اجماعی، این متن حاوی الفاظ توهین‌آمیز یا سمی تشخیص داده شد.'
              },
              SUSPECT: {
                badgeBg: 'bg-amber-500/15 text-amber-500 border-amber-500/30',
                title: 'محتوای مشکوک — نیازمند بازبینی (SUSPECT)',
                summary: 'برخی مدل‌ها احتمال سمیت متوسطی را تشخیص داده‌اند اما اجماع کامل وجود ندارد.'
              },
              SAFE: {
                badgeBg: 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30',
                title: 'محتوای سالم و محترمانه (SAFE)',
                summary: 'هیچ‌یک از مدل‌های ensemble نشانه‌ای از توهین یا سمیت در این متن نیافتند.'
              }
            }[r.decision];

            const scriptLabel = r.script === 'fa' ? 'فارسی' : r.script === 'en' ? 'انگلیسی' : 'چندزبانه / مختلط';

            const modelRows = Object.keys(r.raw_scores || {}).map(key => {
              const raw = r.raw_scores[key];
              const weightScore = r.weighted_scores[key];
              const voted = r.votes[key];
              const label = r.labels?.[key] || key;
              const pct = Math.min(100, (raw * 100)).toFixed(1);
              const barColor = voted ? 'bg-rose-500' : (raw >= 0.35 ? 'bg-amber-500' : 'bg-emerald-500');
              const badge = voted
                ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-rose-500/15 text-rose-500">رأی سمی</span>`
                : `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/15 text-emerald-500">سالم</span>`;
              return `
                <div class="py-2.5 border-b border-token-border last:border-0">
                  <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="flex items-center gap-2 min-w-0">
                      ${badge}
                      <span class="text-xs font-medium text-token-primary truncate">${escapeHtml(label)}</span>
                    </div>
                    <div class="flex items-center gap-2.5 text-[11px] font-mono shrink-0">
                      <span class="text-token-tertiary">خام: ${pct}%</span>
                      <span class="text-token-primary font-semibold">وزنی: ${(weightScore * 100).toFixed(1)}%</span>
                    </div>
                  </div>
                  <div class="w-full h-1.5 bg-token-main rounded-full overflow-hidden">
                    <div class="${barColor} h-full score-bar" style="width: ${pct}%"></div>
                  </div>
                </div>`;
            }).join('');

            const skippedNotice = (r.skipped_models && r.skipped_models.length)
              ? `<div class="mt-2.5 pt-2 border-t border-token-border text-[11px] text-token-tertiary flex items-center gap-1.5">
                   <i class="fa-solid fa-filter text-[10px]"></i>
                   <span>فیلتر هوشمند زبان (${scriptLabel}): مدل‌های <code class="font-mono">${r.skipped_models.join(', ')}</code> نادیده گرفته شدند.</span>
                 </div>`
              : '';

            const fingilishNotice = (r.fingilish_detected && r.fingilish_text)
              ? `<div class="mb-2 p-2.5 rounded-xl bg-sky-500/10 border border-sky-500/25 text-[11px] text-sky-500 flex items-start gap-2">
                   <i class="fa-solid fa-language text-[11px] mt-0.5"></i>
                   <div>
                     <div class="font-semibold">فینگیلیش شناسایی و ترنسلیت شد</div>
                     <div class="font-mono mt-0.5 opacity-90" dir="rtl">${escapeHtml(r.fingilish_text)}</div>
                   </div>
                 </div>`
              : '';

            const detailsSection = state.viewMode === 'detailed' ? `
              <div class="mt-3 bg-token-surface/70 border border-token-border rounded-2xl p-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold text-token-secondary">ریز نمرات ۵ مدل (Ensemble Breakdown)</span>
                  <span class="text-[11px] font-mono text-token-tertiary">${r.latency_ms ? r.latency_ms + 'ms' : ''}</span>
                </div>
                ${modelRows}
                ${skippedNotice}
              </div>` : '';

            return `
              <article class="space-y-4 animate-fadeIn">
                ${userHTML}
                <div class="flex items-start gap-3.5">
                  <div class="w-7 h-7 rounded-full border border-token-border bg-token-surface text-token-primary flex items-center justify-center text-xs shrink-0 mt-0.5">
                    <i class="fa-solid fa-shield-halved"></i>
                  </div>
                  <div class="flex-1 min-w-0 space-y-2">
                    <div class="border border-token-border bg-token-surface/40 rounded-2xl p-4">
                      ${fingilishNotice}
                      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${decisionMeta.badgeBg}">
                          ${decisionMeta.title}
                        </span>
                        <span class="text-xs font-mono text-token-secondary">
                          اطمینان: <strong>${(r.confidence * 100).toFixed(1)}%</strong>
                        </span>
                      </div>
                      <p class="text-[13.5px] text-token-secondary leading-relaxed mb-3">
                        ${decisionMeta.summary}
                      </p>
                      <div class="grid grid-cols-3 gap-2 text-center bg-token-main/60 p-2.5 rounded-xl border border-token-border">
                        <div>
                          <div class="text-[10px] text-token-tertiary">آرای سمیت</div>
                          <div class="text-xs font-mono font-bold text-token-primary mt-0.5">${r.votes_count} از ${r.total_models}</div>
                        </div>
                        <div>
                          <div class="text-[10px] text-token-tertiary">بیشترین نمره خام</div>
                          <div class="text-xs font-mono font-bold text-token-primary mt-0.5">${(r.max_raw * 100).toFixed(1)}%</div>
                        </div>
                        <div>
                          <div class="text-[10px] text-token-tertiary">زبان تشخیص‌داده‌شده</div>
                          <div class="text-xs font-semibold text-token-primary mt-0.5">${scriptLabel}</div>
                        </div>
                      </div>
                    </div>
                    ${detailsSection}
                    <div class="flex items-center gap-1 pt-0.5 text-token-tertiary">
                      <button onclick="copyReport('${msg.id}')"
                              class="p-1.5 rounded-lg hover:bg-token-hover hover:text-token-primary transition-colors text-xs flex items-center gap-1"
                              title="کپی گزارش">
                        <i class="fa-regular fa-copy"></i>
                      </button>
                      <button onclick="copyMessageJSON('${msg.id}')"
                              class="p-1.5 rounded-lg hover:bg-token-hover hover:text-token-primary transition-colors text-xs flex items-center gap-1"
                              title="کپی JSON خام">
                        <i class="fa-solid fa-code"></i>
                      </button>
                      <button onclick="reAnalyze('${msg.id}')"
                              class="p-1.5 rounded-lg hover:bg-token-hover hover:text-token-primary transition-colors text-xs"
                              title="تحلیل مجدد">
                        <i class="fa-solid fa-rotate-right"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </article>`;
          }

          async function analyze(overrideText) {
            const input = document.getElementById('prompt-input');
            const text = (typeof overrideText === 'string' ? overrideText : input.value).trim();
            if (!text || state.isAnalyzing) return;

            state.isAnalyzing = true;
            document.getElementById('send-btn').disabled = true;
            if (typeof overrideText !== 'string') {
              input.value = '';
              autoResize(input);
            }

            let thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread) {
              thread = {
                id: 'th_' + Date.now(),
                title: text.slice(0, 34) + (text.length > 34 ? '…' : ''),
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: []
              };
              state.threads.unshift(thread);
              state.activeThreadId = thread.id;
            }

            appendPendingTurn(text);

            try {
              const r = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
              });
              const result = await r.json();

              const msgObj = {
                id: 'msg_' + Date.now(),
                text,
                result,
                ts: Date.now()
              };
              thread.messages.push(msgObj);
              thread.updatedAt = Date.now();

              saveState();
              renderSidebarThreads();
              renderActiveThread();
            } catch (e) {
              showToast('خطا در ارتباط با سرور');
              renderActiveThread();
            } finally {
              state.isAnalyzing = false;
              autoResize(document.getElementById('prompt-input'));
              document.getElementById('prompt-input').focus();
            }
          }

          function appendPendingTurn(text) {
            const welcome = document.getElementById('welcome-screen');
            const stream = document.getElementById('chat-stream');
            welcome.classList.add('hidden');
            stream.classList.remove('hidden');
            const pendingDiv = document.createElement('div');
            pendingDiv.id = 'pending-turn';
            pendingDiv.className = 'space-y-4 animate-fadeIn';
            pendingDiv.innerHTML = `
              <div class="flex justify-start w-full">
                <div class="max-w-[85%] sm:max-w-[75%] bg-token-surface text-token-primary px-4 py-2.5 rounded-3xl text-[15px] leading-relaxed whitespace-pre-wrap" dir="auto">${escapeHtml(text)}</div>
              </div>
              <div class="flex items-center gap-3.5">
                <div class="w-7 h-7 rounded-full border border-token-border bg-token-surface text-token-primary flex items-center justify-center text-xs shrink-0">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="flex items-center gap-1.5 py-2">
                  <span class="w-2 h-2 rounded-full bg-token-secondary typing-dot"></span>
                  <span class="w-2 h-2 rounded-full bg-token-secondary typing-dot"></span>
                  <span class="w-2 h-2 rounded-full bg-token-secondary typing-dot"></span>
                </div>
              </div>`;
            stream.appendChild(pendingDiv);
            scrollToBottom();
          }

          function reAnalyze(msgId) {
            const thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread) return;
            const msg = thread.messages.find(m => m.id === msgId);
            if (!msg) return;
            analyze(msg.text);
          }

          function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 176) + 'px';
            const v = el.value;
            const counter = document.getElementById('char-counter');
            if (v.length > 0) {
              counter.textContent = v.length;
              counter.classList.remove('hidden');
            } else {
              counter.classList.add('hidden');
            }
            document.getElementById('send-btn').disabled = !v.trim() || state.isAnalyzing;
          }

          function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              analyze();
            }
          }

          function useStarter(text) {
            analyze(text);
          }

          async function pasteClipboard() {
            try {
              const t = await navigator.clipboard.readText();
              if (t) {
                const input = document.getElementById('prompt-input');
                input.value = t;
                autoResize(input);
                input.focus();
              }
            } catch (e) {
              showToast('دسترسی به کلیپ‌بورد امکان‌پذیر نیست');
            }
          }

          function toggleModelDropdown(e) {
            e.stopPropagation();
            document.getElementById('model-dropdown').classList.toggle('hidden');
          }

          function setViewMode(mode) {
            state.viewMode = mode;
            saveState();
            updateViewModeCheckmarks();
            renderActiveThread();
            document.getElementById('model-dropdown').classList.add('hidden');
          }

          function updateViewModeCheckmarks() {
            const d = document.getElementById('check-detailed');
            const c = document.getElementById('check-compact');
            if (!d || !c) return;
            if (state.viewMode === 'detailed') {
              d.classList.remove('hidden');
              c.classList.add('hidden');
            } else {
              d.classList.add('hidden');
              c.classList.remove('hidden');
            }
          }

          function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
          }

          function findMessage(msgId) {
            for (const t of state.threads) {
              const found = t.messages.find(m => m.id === msgId);
              if (found) return found;
            }
            return null;
          }

          function copyMessageJSON(msgId) {
            const msg = findMessage(msgId);
            if (!msg) return;
            navigator.clipboard.writeText(JSON.stringify(msg.result, null, 2));
            showToast('JSON در کلیپ‌بورد کپی شد');
          }

          function copyReport(msgId) {
            const msg = findMessage(msgId);
            if (!msg || !msg.result) return;
            const r = msg.result;
            const txt = `متن: "${msg.text}"\nنتیجه: ${r.decision} (اطمینان: ${(r.confidence * 100).toFixed(1)}% | آرا: ${r.votes_count}/${r.total_models})`;
            navigator.clipboard.writeText(txt);
            showToast('گزارش کپی شد');
          }

          function exportCurrentThread() {
            const thread = state.threads.find(t => t.id === state.activeThreadId);
            if (!thread) {
              showToast('گفتگویی برای خروجی گرفتن انتخاب نشده است');
              return;
            }
            const blob = new Blob([JSON.stringify(thread, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `polyguard_${thread.id}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('فایل JSON دانلود شد');
          }

          function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.className = root.classList.contains('dark') ? 'fa-regular fa-sun text-sm' : 'fa-regular fa-moon text-sm';
          }

          function openSettingsModal() {
            const m = document.getElementById('settings-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
          }

          function openModelsModal() {
            openSettingsModal();
          }

          function closeSettingsModal() {
            const m = document.getElementById('settings-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
          }

          function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('hidden');
            t.classList.add('flex');
            setTimeout(() => {
              t.classList.add('hidden');
              t.classList.remove('flex');
            }, 2200);
          }

          function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
          }
          JSEOF

          echo "✔ All app files created"
          ls -R app

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start FastAPI server (concurrent, 4 workers)
        run: |
          nohup gunicorn app.main:app \
              --workers 4 \
              --worker-class uvicorn.workers.UvicornWorker \
              --bind 0.0.0.0:8000 \
              --timeout 120 \
              --graceful-timeout 30 \
              --keep-alive 5 \
              > server.log 2>&1 &

          echo "Waiting for models to load (~120-300s)…"
          STATUS=""
          for i in $(seq 1 300); do
            STATUS=$(curl -fs http://localhost:8000/health 2>/dev/null || true)
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "✔ Ready after ${i} checks (~$((i*2))s)"
              break
            fi
            if echo "$STATUS" | grep -q '"status":"error"'; then
              echo "❌ Models failed:"
              echo "$STATUS"
              tail -n 80 server.log || true
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "  ... still loading (${i}/300) — $STATUS"
            fi
            sleep 2
          done
          echo "$STATUS"
          if ! echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "❌ Models never became healthy"
            tail -n 100 server.log || true
            exit 1
          fi

      - name: Fingilish + concurrency smoke test
        run: |
          echo "--- Fingilish detection test ---"
          curl -s -X POST http://localhost:8000/api/check \
            -H 'Content-Type: application/json' \
            -d '{"text":"kir"}' | head -c 500
          echo
          echo "--- firing 8 parallel requests ---"
          time (
            for n in $(seq 1 8); do
              curl -s -X POST http://localhost:8000/api/check \
                -H 'Content-Type: application/json' \
                -d '{"text":"You are crazy"}' \
                -o /tmp/resp_$n.json &
            done
            wait
          )
          echo "--- health after load ---"
          curl -s http://localhost:8000/health | head -c 500

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          echo "Waiting for trycloudflare URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "❌ Could not obtain tunnel URL"
            cat tunnel.log
            exit 1
          fi
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "### 🌐 PolyGuard Ensemble is live at: $URL" >> $GITHUB_STEP_SUMMARY
          echo "🔗 $URL"

      - name: Keep service alive
        run: |
          echo "Service running at: $PUBLIC_URL"
          echo "Will self-terminate after ~5 hours."
          for i in $(seq 1 300); do
            sleep 60
            pgrep -f "gunicorn app.main:app" >/dev/null || {
              echo "⚠ Gunicorn died, restarting…"
              MODELS_ROOT="$MODELS_ROOT" \
                nohup gunicorn app.main:app \
                  --workers 4 \
                  --worker-class uvicorn.workers.UvicornWorker \
                  --bind 0.0.0.0:8000 \
                  --timeout 120 \
                  --graceful-timeout 30 \
                  --keep-alive 5 \
                  >> server.log 2>&1 &
            }
            pgrep -f "cloudflared tunnel" >/dev/null || {
              echo "⚠ Cloudflared died, restarting…"
              nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate >> tunnel.log 2>&1 &
            }
          done
