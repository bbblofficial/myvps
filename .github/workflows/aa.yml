                if(S.curId === el.dataset.id) newChat(); else renderConvList();
                break;
              }
              case 'copy-code': {
                const box = el.closest('.codebox'); const ok = await copyText($('code', box).textContent);
                el.classList.toggle('ok', ok); el.innerHTML = (ok ? icon('check') + '<span>Copied</span>' : icon('copy') + '<span>Failed</span>');
                setTimeout(() => { el.classList.remove('ok'); el.innerHTML = icon('copy') + COPY_LABEL; }, 1600);
                break;
