          .composer-wrap{padding:0 24px calc(18px + env(safe-area-inset-bottom,0px));flex-shrink:0}
          .composer{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:10px 10px 10px 20px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
          .composer:focus-within{border-color:var(--border2);box-shadow:0 6px 30px rgba(31,30,29,.09)}
