name: PolyGuard Ensemble Web + Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: polyguard-deploy
  cancel-in-progress: true

env:
  PERSIAN_MODEL_ID:      HamidRezaei/Persian-Offensive-Language-Detection
  TEXTDETOX_LARGE_ID:    textdetox/twitter-xlmr-toxicity-classifier
  TEXTDETOX_BASE_ID:     textdetox/xlmr-base-toxicity-classifier
  MULTILINGUAL_MODEL_ID: unitary/multilingual-toxic-xlm-roberta
  TWITTER_OFFENSIVE_ID:  cardiffnlp/twitter-roberta-base-offensive

  MODELS_ROOT: ${{ github.workspace }}/models

  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet fastapi "uvicorn[standard]" gunicorn transformers sentencepiece protobuf huggingface_hub anyio

      - name: Download all models to local folders
        run: |
          mkdir -p "$MODELS_ROOT/persian" "$MODELS_ROOT/textdetox_large" "$MODELS_ROOT/textdetox_base" "$MODELS_ROOT/multilingual" "$MODELS_ROOT/twitter_offensive"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          jobs = [
              ("PERSIAN_MODEL_ID",      "persian"),
              ("TEXTDETOX_LARGE_ID",    "textdetox_large"),
              ("TEXTDETOX_BASE_ID",     "textdetox_base"),
              ("MULTILINGUAL_MODEL_ID", "multilingual"),
              ("TWITTER_OFFENSIVE_ID",  "twitter_offensive"),
          ]
          root = os.environ["MODELS_ROOT"]
          for env_key, sub in jobs:
              repo_id = os.environ[env_key]
              target = os.path.join(root, sub)
              print(f"Downloading {repo_id} -> {target}", flush=True)
              snapshot_download(
                  repo_id=repo_id,
                  local_dir=target,
                  ignore_patterns=["*.h5", "*.msgpack", "*.onnx", "*.tflite", "*.ot", "*.mlmodelc"],
              )
              print(f"Done {repo_id}", flush=True)
          PY
          echo "--- model sizes ---"
          du -sh "$MODELS_ROOT"/*

      - name: Create PolyGuard app files
        run: |
          mkdir -p app/static
          touch app/__init__.py

          cat > app/fingilish.py << 'FINGEOF'
          """
          Fingilish -> Persian (letters only, no dictionary for transliteration) plus a
          detector that decides whether a Latin-script text is really Fingilish or just
          ordinary English.  The detector is the important part: without it every English
          sentence was "transliterated" into Persian gibberish and the Persian model
          flagged the gibberish as toxic.
          """
          import re

          # ------------------------------------------------------------------
          # Transliteration
          # - digraphs and long vowels first
          # - middle short vowels (a, e, o) are DROPPED (Persian writing convention)
          # - i / u in the middle -> ی / و (treated as long)
          # - word-initial / word-final vowels are always written
          # ------------------------------------------------------------------
          FINGILISH_DIGRAPHS = [
              ('kh', 'خ'), ('gh', 'ق'), ('ch', 'چ'), ('sh', 'ش'), ('zh', 'ژ'),
              ('ph', 'ف'), ('th', 'ت'), ('ck', 'ک'),
              ('aa', 'آ'), ('ee', 'ی'), ('oo', 'و'), ('ou', 'و'),
              ('ei', 'ی'), ('ey', 'ی'), ('ay', 'ی'), ('ai', 'ی'), ('oy', 'ی'),
          ]

          FINGILISH_CONSONANTS = {
              'b': 'ب', 'p': 'پ', 't': 'ت', 's': 'س', 'j': 'ج', 'h': 'ه',
              'd': 'د', 'z': 'ز', 'r': 'ر', 'f': 'ف', 'q': 'ق', 'k': 'ک',
              'g': 'گ', 'l': 'ل', 'm': 'م', 'n': 'ن', 'v': 'و', 'w': 'و',
              'y': 'ی', 'x': 'کس', 'c': 'ک',
          }

          _INITIAL_VOWELS = {'a': 'ا', 'e': 'ا', 'o': 'ا', 'i': 'ای', 'u': 'او'}
          _FINAL_VOWELS   = {'a': 'ا', 'e': 'ه', 'i': 'ی', 'o': 'و', 'u': 'و'}
          _MIDDLE_VOWELS  = {'a': '',  'e': '',  'i': 'ی', 'o': '',  'u': 'و'}

          _DOUBLE_CONSONANT = re.compile(r'([bcdfghjklmnpqrstvwxyz])\1+')


          def _transliterate_word(w: str) -> str:
              if not w:
                  return ''
              w = _DOUBLE_CONSONANT.sub(r'\1', w)
              out = []
              i, n = 0, len(w)
              while i < n:
                  matched = False
                  for src, dst in FINGILISH_DIGRAPHS:
                      if w.startswith(src, i):
                          out.append(dst)
                          i += len(src)
                          matched = True
                          break
                  if matched:
                      continue

                  ch = w[i]
                  if ch in FINGILISH_CONSONANTS:
                      out.append(FINGILISH_CONSONANTS[ch])
                      i += 1
                      continue

                  if ch in 'aeiou':
                      if i == 0:
                          out.append(_INITIAL_VOWELS[ch])
                      elif i == n - 1:
                          out.append(_FINAL_VOWELS[ch])
                      else:
                          out.append(_MIDDLE_VOWELS[ch])
                      i += 1
                      continue

                  out.append(ch)
                  i += 1
              return ''.join(out)


          def _normalize(text: str) -> str:
              t = text.lower().strip()
              # decorations between letters: k.i.r -> kir
              t = re.sub(r'[.\-_*^•]+', '', t)
              # spaced letters: "k i r" -> "kir"
              tokens = t.split()
              if len(tokens) > 1 and all(len(tok) == 1 and tok.isalpha() for tok in tokens):
                  t = ''.join(tokens)
              return t


          def fingilish_to_persian(text: str) -> str:
              return ' '.join(_transliterate_word(w) for w in _normalize(text).split())


          # ------------------------------------------------------------------
          # Detection: is this Latin text Fingilish, or just English?
          # ------------------------------------------------------------------
          ENGLISH_WORDS = set("""
          the a an and or but if then than so because as of in on at to for from by with without about into over under
          after before between through during up down out off again further once here there when where why how all any both
          each few more most other some such only own same too very can will just should now
          i you he she it we they me him her us them my your his its our their mine yours this that these those
          am is are was were be been being have has had having do does did doing would could shall may might must
          not no yes ok okay please thanks thank sorry hello hi hey bye goodbye welcome
          what who whom which whose
          good bad great nice wonderful awesome amazing terrible horrible awful beautiful ugly happy sad angry
          day days night morning evening today tomorrow yesterday week year time ahead
          people person man woman men women boy girl guy guys friend friends family life world thing things
          work works working productive useful useless stupid idiot idiots dumb crazy insane mad fool foolish
          like love hate want need know think say said see look make made get got go going come came take give
          tell ask use find help try call feel leave put keep let begin seem show hear play run move live believe
          bring happen write provide sit stand lose pay meet include continue set learn change lead understand watch
          follow stop create speak read allow add spend grow open walk win offer remember consider appear buy wait serve
          die send expect build stay fall cut reach kill remain
          completely totally really actually always never ever maybe perhaps still even also already
          fuck fucking fucker shit shitty bitch damn dumbass asshole ass bastard crap dick suck sucks loser trash
          moron jerk scum garbage pathetic worthless disgusting
          one two three four five six seven eight nine ten first second last next new old big small long short high low
          many much little less own right left well back way
          free best better worse worst hard easy fast slow
          text message words word name email number page site website
          """.split())

          # Words that are valid English but are also very common Fingilish words.
          # They tell us nothing either way, so they are ignored by the detector.
          NEUTRAL_WORDS = {
              'to', 'man', 'in', 'an', 'be', 'do', 'me', 'am', 'so', 'no', 'are', 'at',
              'as', 'on', 'or', 'bad', 'ham', 'dad', 'mad', 'male', 'mi', 'ta', 'na',
              'por', 'dare', 'kon', 'din', 'beh', 'ye', 'ya', 'shot', 'pas', 'mal', 'ham',
          }

          _ENGLISH_SUFFIX = re.compile(r'(ing|tion|sion|ness|ment|able|ible|ful|less|ous|ally|ight|ould|ough|ly|ed)$')


          def _is_english_token(tok: str) -> bool:
              if tok in ENGLISH_WORDS:
                  return True
              if len(tok) >= 5 and _ENGLISH_SUFFIX.search(tok):
                  return True
              return False


          def looks_like_fingilish(text: str) -> bool:
              """True only when Latin text is dominated by non-English tokens."""
              if len(text) > 600:
                  return False
              tokens = re.findall(r"[a-z]+", _normalize(text))
              if not tokens:
                  return False
              english = unknown = 0
              for tok in tokens:
                  if tok in NEUTRAL_WORDS:
                      continue
                  if _is_english_token(tok):
                      english += 1
                  else:
                      unknown += 1
              if english + unknown == 0:
                  return True           # only neutral tokens, e.g. "to man"
              return english / (english + unknown) < 0.6
          FINGEOF

          cat > app/main.py << 'PYEOF'
          import os

          os.environ.setdefault("TOKENIZERS_PARALLELISM", "false")
          os.environ.setdefault("OMP_NUM_THREADS", "1")
          os.environ.setdefault("MKL_NUM_THREADS", "1")
          os.environ.setdefault("OPENBLAS_NUM_THREADS", "1")
          os.environ.setdefault("NUMEXPR_NUM_THREADS", "1")
          os.environ.setdefault("HF_HUB_OFFLINE", "1")
          os.environ.setdefault("TRANSFORMERS_OFFLINE", "1")

          import re
          import time
          import traceback
          import threading
          from pathlib import Path
          from typing import Dict

          import torch
          torch.set_num_threads(1)

          from anyio import to_thread
          from fastapi import FastAPI
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import FileResponse
          from pydantic import BaseModel
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          from app.fingilish import fingilish_to_persian, looks_like_fingilish

          # ------------------------------------------------------------------
          # Concurrency control
          # ------------------------------------------------------------------
          CPU_COUNT = os.cpu_count() or 4
          MAX_CONCURRENT_INFERENCES = max(2, CPU_COUNT)
          MAX_THREADPOOL_TOKENS = 200

          _infer_sem = threading.Semaphore(MAX_CONCURRENT_INFERENCES)
          _counter_lock = threading.Lock()

          BASE_DIR = Path(__file__).resolve().parent
          MODELS_ROOT = Path(os.environ["MODELS_ROOT"])


          class TextIn(BaseModel):
              text: str   # no length limit


          state = {"models": {}, "errors": {}, "ready": False, "inflight": 0, "peak": 0}

          MODEL_SPECS = {
              "persian":      {"dir": MODELS_ROOT / "persian",           "mode": "multilabel", "weight": 2.0, "lang": "fa",    "label": "Persian ParsBERT (تخصصی فارسی)",      "label_en": "Persian ParsBERT"},
              "textdetox_lg": {"dir": MODELS_ROOT / "textdetox_large",   "mode": "binary",     "weight": 2.0, "lang": "multi", "label": "TextDetox XLM-R Large (۱۵ زبان)",     "label_en": "TextDetox XLM-R Large"},
              "textdetox_sm": {"dir": MODELS_ROOT / "textdetox_base",    "mode": "binary",     "weight": 1.5, "lang": "multi", "label": "TextDetox XLM-R Base (۱۵ زبان)",      "label_en": "TextDetox XLM-R Base"},
              "multilingual": {"dir": MODELS_ROOT / "multilingual",      "mode": "multilabel", "weight": 1.0, "lang": "multi", "label": "Unitary XLM-R (چندزبانه ۱۰۰+)",       "label_en": "Unitary XLM-R"},
              "twitter_off":  {"dir": MODELS_ROOT / "twitter_offensive", "mode": "binary",     "weight": 1.0, "lang": "en",    "label": "Twitter RoBERTa Offensive (انگلیسی)", "label_en": "Twitter RoBERTa Offensive"},
          }

          # ---------- consensus rules ----------
          PER_MODEL_VOTE_THRESHOLD = 0.50
          MIN_VOTES_FOR_TOXIC = 2
          STRONG_SINGLE_MODEL = 0.90
          WEAK_SUSPECT_THRESHOLD = 0.60
          # A transliterated (Fingilish) reading is a guess, so a single model needs
          # more certainty before it may declare TOXIC on its own.
          FINGILISH_STRONG_SINGLE = 0.95


          # ------------------------------------------------------------------
          # Model loading - at import time, so it works with gunicorn --preload
          # ------------------------------------------------------------------
          def _load_one(name, spec):
              try:
                  print(f"[Ensemble] Loading '{name}'...", flush=True)
                  tok = AutoTokenizer.from_pretrained(str(spec["dir"]), local_files_only=True)
                  mdl = AutoModelForSequenceClassification.from_pretrained(
                      str(spec["dir"]), local_files_only=True
                  )
                  mdl.eval()
                  state["models"][name] = (
                      mdl, tok, spec["mode"], spec["weight"],
                      spec["lang"], spec["label"], spec["label_en"],
                  )
                  print(f"[Ensemble] OK '{name}' loaded", flush=True)
              except Exception as exc:
                  state["errors"][name] = str(exc)
                  print(f"[Ensemble] FAILED '{name}': {exc}", flush=True)


          def _bootstrap():
              print("[Ensemble] Bootstrap starting...", flush=True)
              for name, spec in MODEL_SPECS.items():
                  _load_one(name, spec)
              state["ready"] = True
              print(f"[Ensemble] Ready. Loaded: {list(state['models'].keys())} "
                    f"Errors: {list(state['errors'].keys())}", flush=True)


          _bootstrap()


          # ------------------------------------------------------------------
          # Scoring
          # ------------------------------------------------------------------
          def _score_multilabel(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.inference_mode():
                  logits = model(**inputs).logits
              return float(torch.sigmoid(logits).squeeze(0).max().item())


          def _score_binary(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.inference_mode():
                  logits = model(**inputs).logits
              probs = torch.softmax(logits, dim=-1).squeeze(0)
              if probs.numel() == 1:
                  return float(probs.item())
              return float(probs[1].item())


          def _detect_script(text: str) -> str:
              fa = len(re.findall(r'[؀-ۿ]', text))
              en = len(re.findall(r'[A-Za-z]', text))
              total = fa + en
              if total == 0:
                  return "mixed"
              if fa / total >= 0.6:
                  return "fa"
              if en / total >= 0.6:
                  return "en"
              return "mixed"


          # ------------------------------------------------------------------
          # Ensemble voting - pure function, returns a fresh dict
          # ------------------------------------------------------------------
          def _run_ensemble(text: str, script: str, strict: bool = False) -> Dict:
              models_snapshot = list(state["models"].items())

              raw, weighted, weights, labels, labels_en, skipped = {}, {}, {}, {}, {}, []
              for name, (mdl, tok, mode, weight, lang, label, label_en) in models_snapshot:
                  if script == "fa" and lang == "en":
                      skipped.append(name)
                      continue
                  if script == "en" and lang == "fa":
                      skipped.append(name)
                      continue

                  try:
                      s = _score_binary(mdl, tok, text) if mode == "binary" \
                          else _score_multilabel(mdl, tok, text)
                  except Exception as exc:
                      print(f"[Ensemble] inference error in {name}: {exc}", flush=True)
                      s = 0.0

                  raw[name] = round(s, 4)
                  weighted[name] = round(s * weight, 4)
                  weights[name] = weight
                  labels[name] = label
                  labels_en[name] = label_en

              if not raw:
                  return {"error": "no models applicable", "details": dict(state["errors"])}

              votes = {name: (s >= PER_MODEL_VOTE_THRESHOLD) for name, s in raw.items()}
              votes_count = sum(votes.values())
              max_raw = max(raw.values())
              max_weighted = max(weighted.values())
              strong = FINGILISH_STRONG_SINGLE if strict else STRONG_SINGLE_MODEL

              if votes_count >= MIN_VOTES_FOR_TOXIC:
                  decision = "TOXIC"
              elif votes_count == 1 and max_raw >= strong:
                  decision = "TOXIC"
              elif max_raw >= WEAK_SUSPECT_THRESHOLD:
                  decision = "SUSPECT"
              else:
                  decision = "SAFE"

              top2 = sorted(raw.values(), reverse=True)[:2]
              confidence = round(sum(top2) / len(top2), 4) if top2 else 0.0

              return {
                  "decision": decision,
                  "max_weighted": round(max_weighted, 4),
                  "max_raw": round(max_raw, 4),
                  "confidence": confidence,
                  "votes_count": votes_count,
                  "votes": votes,
                  "raw_scores": raw,
                  "weighted_scores": weighted,
                  "weights": weights,
                  "labels": labels,
                  "labels_en": labels_en,
                  "total_models": len(raw),
                  "skipped_models": skipped,
                  "script": script,
                  "vote_threshold": PER_MODEL_VOTE_THRESHOLD,
                  "min_votes": MIN_VOTES_FOR_TOXIC,
                  "errors": dict(state["errors"]),
              }


          # ------------------------------------------------------------------
          # Dual analysis: original text + (only if it really is Fingilish) the
          # transliterated text.  Plain English is NEVER transliterated.
          # ------------------------------------------------------------------
          _ORDER = {"SAFE": 0, "SUSPECT": 1, "TOXIC": 2}


          def _summary_of(result):
              """Small flat copy - must never contain the parent dict."""
              if not result or "decision" not in result:
                  return {"error": result.get("error") if result else "no result"}
              return {
                  "decision": result["decision"],
                  "confidence": result["confidence"],
                  "max_raw": result["max_raw"],
                  "votes_count": result["votes_count"],
                  "total_models": result["total_models"],
                  "script": result["script"],
              }


          def ensemble_predict(text: str) -> Dict:
              t0 = time.perf_counter()

              script_original = _detect_script(text)

              has_fingilish = False
              persian_text = ""
              if script_original == "en" and looks_like_fingilish(text):
                  persian_text = fingilish_to_persian(text)
                  has_fingilish = (
                      persian_text.strip() != ""
                      and _detect_script(persian_text) == "fa"
                  )

              result_original = _run_ensemble(text, script_original)

              result_fingilish = None
              if has_fingilish:
                  result_fingilish = _run_ensemble(persian_text, "fa", strict=True)

              candidates = [r for r in (result_original, result_fingilish) if r and "decision" in r]
              if not candidates:
                  return {"error": "no models applicable", "details": dict(state["errors"])}

              final_decision = max(candidates, key=lambda r: _ORDER.get(r["decision"], 0))["decision"]
              primary = next((r for r in candidates if r["decision"] == final_decision), candidates[0])

              response = dict(primary)
              response["decision"] = final_decision
              response["fingilish_detected"] = has_fingilish
              response["fingilish_text"] = persian_text if has_fingilish else None
              response["decided_by"] = "fingilish" if (result_fingilish is not None and primary is result_fingilish) else "original"
              response["analysis"] = {
                  "original": _summary_of(result_original),
                  "fingilish": _summary_of(result_fingilish) if result_fingilish else None,
              }
              response["latency_ms"] = round((time.perf_counter() - t0) * 1000)
              return response


          # ------------------------------------------------------------------
          # FastAPI
          # ------------------------------------------------------------------
          app = FastAPI(title="PolyGuard Ensemble")


          @app.on_event("startup")
          async def _on_startup():
              to_thread.current_default_thread_limiter().total_tokens = MAX_THREADPOOL_TOKENS
              print(f"[Ensemble] Worker ready. cpu={CPU_COUNT} "
                    f"parallel_inferences={MAX_CONCURRENT_INFERENCES} "
                    f"threadpool={MAX_THREADPOOL_TOKENS}", flush=True)


          @app.get("/health")
          def health():
              return {
                  "status": "ok" if state["ready"] and state["models"] else
                            ("loading" if not state["ready"] else "error"),
                  "loaded_models": list(state["models"].keys()),
                  "errors": dict(state["errors"]),
                  "inflight": state["inflight"],
                  "peak": state["peak"],
                  "concurrency": MAX_CONCURRENT_INFERENCES,
              }


          @app.post("/api/check")
          def check(data: TextIn):
              try:
                  if not state["ready"] or not state["models"]:
                      return {"error": state["errors"] or "no models loaded yet"}

                  with _infer_sem:
                      with _counter_lock:
                          state["inflight"] += 1
                          if state["inflight"] > state["peak"]:
                              state["peak"] = state["inflight"]
                      try:
                          return ensemble_predict(data.text)
                      finally:
                          with _counter_lock:
                              state["inflight"] -= 1
              except Exception as exc:
                  print(f"[Ensemble] /api/check EXC:\n{traceback.format_exc()}", flush=True)
                  return {"error": f"{type(exc).__name__}: {exc}"}


          @app.get("/")
          def index():
              return FileResponse(BASE_DIR / "static" / "index.html",
                                  headers={"Cache-Control": "no-cache"})


          app.mount("/static", StaticFiles(directory=str(BASE_DIR / "static")), name="static")
          PYEOF

          cat > app/static/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl" class="dark">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <title>PolyGuard</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="/static/style.css">
            <script>
              try { if (localStorage.getItem('polyguard_theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
            </script>
          </head>
          <body>
          <div class="app" id="app">

            <!-- ============ SIDEBAR ============ -->
            <aside id="sidebar" class="sidebar">
              <div class="sidebar-inner">
                <div class="sb-top">
                  <button class="icon-btn logo-btn" onclick="createNewThread()" title="PolyGuard"><i data-i="shield"></i></button>
                  <button class="icon-btn" onclick="toggleSidebar()" title="بستن نوار کناری"><i data-i="sidebar"></i></button>
                </div>

                <nav class="sb-nav">
                  <button class="sb-item" onclick="createNewThread()"><i data-i="edit"></i><span>گفتگوی جدید</span></button>
