          .sb-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
          .status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text3)}
          .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s}
