name: Ollama Web Panel via TryCloudflare (Same-Origin)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model to pull (e.g., qwen2.5:7b, llama3.1:8b)'
        required: true
        default: 'qwen2.5:7b'

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Max 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget python3

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Ollama installed."
          ollama --version

      - name: Start Ollama server with CORS enabled
        run: |
          # Allow all origins. Since the browser will now talk to the proxy (same origin),
          # this is less critical, but it helps if you ever test directly.
          export OLLAMA_ORIGINS='*'
          export OLLAMA_HOST='0.0.0.0:11434'
          ollama serve > ollama.log 2>&1 &
          echo "Waiting for Ollama to start..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 2
          done
          curl -s http://localhost:11434/api/tags || echo "health check failed"

      - name: Pull model
        run: |
          echo "Pulling model: ${{ github.event.inputs.model }}"
          ollama pull ${{ github.event.inputs.model }}
          echo "Model pulled."
          ollama list

      - name: Create same-origin proxy server and web panel
        run: |
          mkdir -p web
          # The proxy server serves the HTML and forwards /api/* calls to Ollama.
          cat > web/server.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Simple same-origin proxy server.
          - Serves the chat UI at /
          - Forwards /api/* and /v1/* requests to the local Ollama instance.
          """
          import http.server
          import socketserver
          import urllib.request
          import urllib.error
          import json
          import os

          OLLAMA_BASE = "http://localhost:11434"

          class ProxyHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/api/") or self.path.startswith("/v1/"):
                      self.proxy_request()
                  else:
                      # Serve static files (index.html)
                      super().do_GET()

              def do_POST(self):
                  if self.path.startswith("/api/") or self.path.startswith("/v1/"):
                      self.proxy_request()
                  else:
                      self.send_error(405, "Method Not Allowed")

              def proxy_request(self):
                  target_url = OLLAMA_BASE + self.path
                  content_length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(content_length) if content_length > 0 else None

                  req = urllib.request.Request(
                      target_url,
                      data=body,
                      method=self.command,
                      headers={
                          "Content-Type": self.headers.get("Content-Type", "application/json"),
                          "Host": "localhost:11434",
                      }
                  )

                  try:
                      with urllib.request.urlopen(req) as resp:
                          self.send_response(resp.status)
                          for k, v in resp.headers.items():
                              if k.lower() not in ["transfer-encoding", "connection"]:
                                  self.send_header(k, v)
                          self.end_headers()
                          self.wfile.write(resp.read())
                  except urllib.error.HTTPError as e:
                      self.send_response(e.code)
                      self.end_headers()
                      self.wfile.write(e.read())
                  except Exception as e:
                      self.send_error(502, f"Proxy error: {e}")

              def log_message(self, format, *args):
                  # Quieter logging
                  pass

          PORT = 3000
          os.chdir(os.path.dirname(os.path.abspath(__file__)))
          with socketserver.ThreadingTCPServer(("", PORT), ProxyHandler) as httpd:
              print(f"Proxy server running on port {PORT}")
              httpd.serve_forever()
          PYEOF

          # Create the web panel HTML (it talks to /api/chat on the same origin).
          cat > web/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Ollama Web Panel</title>
            <style>
              * { box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                max-width: 860px; margin: 2rem auto; padding: 0 1rem;
                background: #f5f5f5; color: #222;
              }
              h1 { font-size: 1.4rem; margin-bottom: .25rem; }
              .sub { color: #666; font-size: .85rem; margin-bottom: 1rem; }
              #log {
                background: #fff; border: 1px solid #ddd; border-radius: 10px;
                padding: 1rem; min-height: 380px; max-height: 60vh;
                overflow-y: auto; white-space: pre-wrap; line-height: 1.5;
                font-size: .95rem;
              }
              .msg { margin-bottom: .8rem; }
              .msg.user { color: #0b5; }
              .msg.ai { color: #222; }
              .msg.err { color: #b00; }
              textarea {
                width: 100%; height: 70px; margin-top: .75rem; padding: .6rem;
                border: 1px solid #ccc; border-radius: 8px;
                font-family: inherit; font-size: .95rem; resize: vertical;
              }
              .row { display: flex; gap: .5rem; margin-top: .5rem; }
              button {
                padding: .55rem 1.2rem; border: 0; border-radius: 8px;
                background: #222; color: #fff; font-size: .95rem; cursor: pointer;
              }
              button:disabled { opacity: .5; cursor: not-allowed; }
              .status { font-size: .8rem; color: #888; margin-left: auto; align-self: center; }
            </style>
          </head>
          <body>
            <h1>Ollama Web Panel</h1>
            <div class="sub">Model: ${{ github.event.inputs.model }} · CPU inference</div>
            <div id="log"></div>
            <textarea id="q" placeholder="Ask something... (Ctrl+Enter to send)"></textarea>
            <div class="row">
              <button id="send" onclick="send()">Send</button>
              <button onclick="clearLog()" style="background:#888">Clear</button>
              <span class="status" id="status">Ready</span>
            </div>
          <script>
            // Since the proxy serves this page, we can use a same-origin relative URL.
            const API_BASE = "";
            const MODEL   = "${{ github.event.inputs.model }}";

            const log = document.getElementById('log');
            const qEl = document.getElementById('q');
            const btn = document.getElementById('send');
            const status = document.getElementById('status');

            function append(text, cls) {
              const div = document.createElement('div');
              div.className = 'msg ' + (cls || '');
              div.textContent = text;
              log.appendChild(div);
              log.scrollTop = log.scrollHeight;
            }
            function clearLog() { log.innerHTML = ''; }

            async function send() {
              const q = qEl.value.trim();
              if (!q) return;
              append('You: ' + q, 'user');
              qEl.value = '';
              btn.disabled = true;
              status.textContent = 'Thinking...';
              try {
                // Call the same-origin proxy endpoint.
                const r = await fetch(API_BASE + '/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: MODEL,
                    messages: [{ role: 'user', content: q }],
                    stream: false
                  })
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const j = await r.json();
                const reply = j.message?.content ?? j.choices?.[0]?.message?.content ?? '(empty response)';
                append('AI: ' + reply, 'ai');
                status.textContent = 'Ready';
              } catch (e) {
                append('Error: ' + e.message, 'err');
                status.textContent = 'Error';
              } finally {
                btn.disabled = false;
                qEl.focus();
              }
            }
            qEl.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
            });
            qEl.focus();
          </script>
          </body>
          </html>
          EOF

          echo "Proxy server and web panel created."
          ls -lh web/

      - name: Start proxy server
        run: |
          cd web
          python3 server.py > ../proxy.log 2>&1 &
          sleep 2
          curl -s http://localhost:3000/ > /dev/null && echo "Proxy server is running on port 3000."

      - name: Install cloudflared and start tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

          # ONE tunnel for everything (panel + API).
          ./cloudflared tunnel --url http://localhost:3000 \
            --http-host-header localhost:3000 \
            --no-autoupdate > cf.log 2>&1 &

          echo "Waiting for Cloudflare tunnel URL..."
          PUBLIC_URL=""
          for i in {1..40}; do
            PUBLIC_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log 2>/dev/null | head -n 1)
            if [ -n "$PUBLIC_URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Failed to get URL."
            cat cf.log
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_ENV

          {
            echo "### 🚀 Ollama Web Panel is live!"
            echo ""
            echo "**Access URL:** $PUBLIC_URL"
            echo ""
            echo "This single URL serves both the chat UI and the API proxy."
            echo "No CORS issues, no separate API endpoint needed."
            echo ""
            echo "Links expire when the job stops (max 6 hours)."
          } >> $GITHUB_STEP_SUMMARY

      - name: Keep job alive (6 hours)
        run: |
          echo "Web panel: ${{ env.PUBLIC_URL }}"
          echo "Job will run for 6 hours. Cancel to stop early."
          sleep 21600
