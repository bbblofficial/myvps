          .gen-art::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 100%;animation:shimmer 1.8s ease-in-out infinite}
          @keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
          .gen-art .i{width:54px;height:54px;color:var(--accent);stroke-width:2;animation:spin 5s linear infinite}
          @keyframes spin{to{transform:rotate(360deg)}}
          .gen-text{font-weight:500;color:var(--text2);text-align:center}
          .gen-sub{font-size:12.5px;color:var(--text3);font-variant-numeric:tabular-nums;text-align:center}
          .gen .bar{width:100%}
          .hint{font-size:13px;color:var(--text3);line-height:1.5}
          .hint a,.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

          .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:200;animation:rise .25s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}

          @media (max-width:860px){
            .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);margin-left:0!important;box-shadow:none}
