              <button class="icon-btn" id="sbOpen" data-act="toggle-sb" title="Toggle sidebar"><svg class="i"><use href="#i-panel"/></svg></button>
              <div class="model-wrap" id="pillWrap">
                <button class="pill" id="modelPill" data-act="model-menu"><span id="modelPillText">No model installed</span><svg class="i"><use href="#i-chev"/></svg></button>
                <div class="menu" id="modelMenu" hidden></div>
              </div>
              <div class="topbar-title" id="viewTitle" hidden></div>
              <div class="spacer"></div>
            </header>

            <section class="view active" id="view-chat">
              <div class="chat-scroll" id="chatScroll"><div class="chat-col" id="chatCol"></div></div>
              <div class="composer-wrap">
                <div class="composer">
                  <textarea id="chatInput" rows="1" placeholder="How can I help you today?"></textarea>
                  <button class="send" id="sendBtn" data-act="send" title="Send" disabled><svg class="i" id="sendIcon"><use href="#i-up"/></svg></button>
                </div>
                <div class="fine">Runs on a self-hosted model and can make mistakes. Markdown, code and LaTeX are supported.</div>
              </div>
            </section>

            <section class="view" id="view-image">
              <div class="page"><div class="page-in">
                <h2 class="h2">Image generation</h2>
                <p class="lead">Runs on the CPU, so expect a minute or two per image. Distilled models like SD-Turbo are much faster.</p>
                <div class="img-wrap">
                  <div class="card">
                    <div class="field"><label>Model</label>
                      <select id="imgModel"></select>
                      <div class="hint" id="imgModelHint"></div>
                    </div>
                    <div class="field"><label>Prompt</label><textarea id="imgPrompt" placeholder="Describe what you want to see…">A cozy reading nook by a rainy window, warm lamp light, detailed, cinematic</textarea></div>
                    <div class="field"><label>Negative prompt</label><textarea id="imgNeg" style="min-height:56px" placeholder="What to avoid (optional)"></textarea></div>
                    <div class="field"><label>Size</label>
                      <select id="imgSize">
                        <option value="512x512">512 × 512 · Square</option>
                        <option value="384x384">384 × 384 · Small, fastest</option>
                        <option value="512x768">512 × 768 · Portrait</option>
                        <option value="768x512">768 × 512 · Landscape</option>
                        <option value="768x768">768 × 768 · Large, slow</option>
                      </select>
                    </div>
                    <div class="f3">
                      <div class="field"><label>Steps</label><input type="number" id="imgSteps" value="15" min="1" max="50"></div>
                      <div class="field"><label>CFG</label><input type="number" id="imgCfg" value="7.5" min="0" max="20" step="0.5"></div>
                      <div class="field"><label>Seed</label><input type="number" id="imgSeed" value="-1"></div>
                    </div>
                    <button class="btn accent" id="genBtn" data-act="generate" style="width:100%;padding:12px"><svg class="i sm"><use href="#i-spark"/></svg><span>Generate</span></button>
                  </div>
                  <div class="card out" id="imgOut">
                    <div class="out-empty"><svg class="i"><use href="#i-image"/></svg><b>Your image will appear here</b>Pick a model, write a prompt and press Generate.</div>
                  </div>
                </div>
              </div></div>
            </section>

            <section class="view" id="view-models">
              <div class="page"><div class="page-in">
                <h2 class="h2">Models</h2>
                <p class="lead">Nothing is downloaded until you ask. Install what you need, then pick it from the model menu.</p>
                <div class="row">
                  <div class="seg"><button id="tabChat" class="on" data-tab="chat">Language</button><button id="tabImage" data-tab="image">Image</button></div>
                  <div class="disk" id="diskInfo"></div>
                </div>
                <div id="modelLists"></div>
                <div class="sec" id="customLabel">Install by name</div>
                <div class="custom">
                  <input id="customInput" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. llama3.2:3b">
                  <button class="btn" data-act="custom-install">Install</button>
                </div>
                <div class="hint" id="customHint" style="margin-top:8px"></div>
              </div></div>
            </section>
          </main>

          <script>
          (() => {
          'use strict';

          const SYSTEM_PROMPT = "You are a helpful, knowledgeable assistant. Give clear, accurate answers. Use Markdown (headings, lists, tables, bold) when it helps readability. Always put code in fenced code blocks with a language tag. Use LaTeX with $...$ for inline math and $$...$$ for display math.";

          const OLLAMA_LIBRARY = [
            { tag:'qwen2.5:7b-instruct', name:'Qwen2.5 7B Instruct', size:4.7, badges:['Recommended'], desc:'Strong all-rounder. A great default for this runner.' },
            { tag:'qwen2.5:3b-instruct', name:'Qwen2.5 3B Instruct', size:1.9, badges:['Fast'], desc:'Noticeably quicker on CPU, still very capable.' },
            { tag:'qwen2.5:1.5b-instruct', name:'Qwen2.5 1.5B Instruct', size:1.0, badges:['Fastest'], desc:'Tiny and instant. Good for quick tasks.' },
            { tag:'qwen2.5-coder:7b', name:'Qwen2.5 Coder 7B', size:4.7, badges:['Code'], desc:'Tuned for programming, debugging and code review.' },
            { tag:'qwen3:8b', name:'Qwen3 8B', size:5.2, badges:['Reasoning'], desc:'Newer generation with optional step-by-step thinking.' },
            { tag:'qwen3:4b', name:'Qwen3 4B', size:2.5, badges:['Reasoning','Fast'], desc:'Compact reasoning model.' },
            { tag:'llama3.2:3b', name:'Llama 3.2 3B', size:2.0, badges:['Fast'], desc:'Meta\u2019s small and speedy general model.' },
            { tag:'llama3.2:1b', name:'Llama 3.2 1B', size:1.3, badges:['Fastest'], desc:'Smallest Llama. Runs almost anywhere.' },
            { tag:'llama3.1:8b', name:'Llama 3.1 8B', size:4.9, badges:[], desc:'Well-rounded 8B with long context.' },
            { tag:'gemma3:4b', name:'Gemma 3 4B', size:3.3, badges:[], desc:'Google\u2019s efficient multilingual model.' },
            { tag:'gemma3:1b', name:'Gemma 3 1B', size:0.8, badges:['Fastest'], desc:'Very small, great for short answers.' },
            { tag:'mistral:7b', name:'Mistral 7B', size:4.1, badges:[], desc:'Reliable classic, concise answers.' },
            { tag:'phi3.5', name:'Phi 3.5 Mini', size:2.2, badges:['Fast'], desc:'Microsoft\u2019s small model, strong at reasoning for its size.' },
            { tag:'deepseek-r1:7b', name:'DeepSeek R1 7B', size:4.7, badges:['Reasoning'], desc:'Shows its thinking before answering. Slower, more careful.' },
            { tag:'deepseek-r1:1.5b', name:'DeepSeek R1 1.5B', size:1.1, badges:['Reasoning','Fastest'], desc:'Smallest reasoning model.' },
          ];

          const SUGGESTIONS = [
            'Explain how transformers work',
            'Write a Python script to rename files',
            'Summarize the pros and cons of Rust',
            'Solve x² − 5x + 6 = 0 step by step'
          ];

          const $ = (s, r=document) => r.querySelector(s);
          const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
          const store = {
            get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
            set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
          };
          function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
          function icon(name, cls){ return `<svg class="i ${cls||''}"><use href="#i-${name}"/></svg>`; }
          function fmtBytes(n){ if(!n) return '0 MB'; return n >= 1e9 ? (n/1e9).toFixed(2) + ' GB' : (n/1e6).toFixed(0) + ' MB'; }
          function fmtDur(s){ s = Math.max(0, Math.round(s)); const m = Math.floor(s/60); return m ? `${m}m ${s%60}s` : `${s}s`; }
          function toast(msg){
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
          }
          async function copyText(text){
            try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
            try{
              const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
              document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
            }catch(e){ return false; }
          }
          async function jfetch(url, opts){
            const r = await fetch(url, opts);
            let d = null; try{ d = await r.json(); }catch(e){}
            if(!r.ok) throw new Error((d && (d.error || d.detail)) || ('HTTP ' + r.status));
            return d;
          }
          const JSON_H = { 'Content-Type':'application/json' };

          const S = {
            view:'chat', tab:'chat',
            chatModel: store.get('ua_chat_model',''), imageModel: store.get('ua_image_model',''),
            installedChat:[], ollamaOk:false,
            imgCatalog:[], imgInstalled:[], imgInstalls:{}, imgOk:false, diskFree:null,
            pulls:{},
            convs: store.get('ua_convs', []), curId:null, history:[],
            streaming:false, abort:null, stick:true, genBusy:false
          };

          function applyTheme(t){
            document.documentElement.dataset.theme = t;
            $('#themeIcon use').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
          }
          applyTheme(store.get('ua_theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
          const mobile = () => matchMedia('(max-width:860px)').matches;
          function toggleSidebar(){ document.body.classList.toggle(mobile() ? 'sb-open' : 'sb-collapsed'); }
          if(mobile()) document.body.classList.remove('sb-open');

          function showView(name){
            S.view = name;
            $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
            $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === name));
            $('#pillWrap').hidden = name !== 'chat';
            const tt = $('#viewTitle'); tt.hidden = name === 'chat';
            tt.textContent = name === 'image' ? 'Images' : name === 'models' ? 'Models' : '';
            document.body.classList.remove('sb-open');
            closeMenu();
            if(name === 'models'){ refreshAll(); renderModels(); }
            if(name === 'image'){ refreshImage(); }
            if(name === 'chat') setTimeout(() => $('#chatInput').focus(), 50);
          }

          const HAS_MD = !!(window.marked && window.DOMPurify);
          if(HAS_MD){
            try{ marked.setOptions({ gfm:true, breaks:false, headerIds:false, mangle:false }); }catch(e){}
            DOMPurify.addHook('afterSanitizeAttributes', n => {
              if(n.tagName === 'A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer'); }
            });
          }

          function extractMath(src){
            const maths = [];
            const put = (tex, display) => { maths.push({ tex, display }); return '\u27E6M' + (maths.length - 1) + '\u27E7'; };
            const parts = src.split(/(```[\s\S]*?(?:```|$)|~~~[\s\S]*?(?:~~~|$)|`[^`\n]*`)/g);
            for(let i = 0; i < parts.length; i += 2){
              parts[i] = parts[i]
                .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => put(m, true))
                .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => put(m, true))
                .replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => put(m, false))
                .replace(/\$(?!\s)([^$\n]*[^$\s\\])\$(?![\d$])/g, (_, m) => put(m, false));
            }
            return { text: parts.join(''), maths };
          }

          const COPY_LABEL = '<span>Copy</span>';
          function enhanceCode(root, final){
            $$('pre', root).forEach(pre => {
              const code = pre.querySelector('code');
              const raw = (code || pre).textContent.replace(/\n$/, '');
              const m = /language-([\w#+.-]+)/.exec(code ? code.className : '');
              const lang = m ? m[1].toLowerCase() : '';
              let inner = esc(raw);
              if(window.hljs){
                try{
                  if(lang && hljs.getLanguage(lang)) inner = hljs.highlight(raw, { language: lang, ignoreIllegals: true }).value;
                  else if(final && raw.length < 20000) inner = hljs.highlightAuto(raw).value;
                }catch(e){}
              }
              const box = document.createElement('div');
              box.className = 'codebox';
              box.innerHTML = `<div class="codebox-head"><span class="codebox-lang"></span><button class="code-btn" type="button" data-act="copy-code">${icon('copy')}${COPY_LABEL}</button></div><pre><code class="hljs"></code></pre>`;
              $('.codebox-lang', box).textContent = lang || 'code';
              $('code', box).innerHTML = inner;
              pre.replaceWith(box);
            });
            $$('table', root).forEach(t => {
              if(t.parentElement.classList.contains('table-wrap')) return;
              const w = document.createElement('div'); w.className = 'table-wrap';
              t.replaceWith(w); w.appendChild(t);
            });
          }

          function mdInto(el, src, final){
            if(!HAS_MD){ el.textContent = src; el.style.whiteSpace = 'pre-wrap'; return; }
            const { text, maths } = extractMath(src || '');
            let html = '';
            try{ html = DOMPurify.sanitize(marked.parse(text)); }catch(e){ html = '<p>' + esc(text) + '</p>'; }
            html = html.replace(/\u27E6M(\d+)\u27E7/g, (_, i) => {
              const m = maths[+i]; if(!m) return '';
              try{ return window.katex ? katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false }) : esc(m.tex); }
              catch(e){ return esc(m.tex); }
            });
            el.innerHTML = html;
            enhanceCode(el, final);
          }

          function splitThink(t){
            const m = /^\s*<think>([\s\S]*?)(<\/think>|$)/.exec(t);
            if(!m) return { think:null, answer:t, done:true };
            return { think:m[1].trim(), answer:t.slice(m[0].length).replace(/^\s+/, ''), done: m[2] !== '' };
          }
          function stripThink(t){ return t.replace(/^\s*<think>[\s\S]*?(<\/think>|$)\s*/, ''); }

          function paintAssistant(turn, text, streaming){
            const { think, answer, done } = splitThink(text);
            const slot = $('.think-slot', turn), md = $('.md', turn);
            if(think !== null){
              let d = $('details', slot);
              if(!d){
                slot.innerHTML = '<details class="think"><summary></summary><div class="think-body"></div></details>';
                d = $('details', slot); d.open = streaming && !done;
              }
              $('.think-body', d).textContent = think;
              $('summary', d).textContent = done ? 'Thought process' : 'Thinking…';
              if(done && !d.dataset.closed){ d.dataset.closed = '1'; if(streaming) d.open = false; }
            } else slot.innerHTML = '';
            if(!answer && streaming && think === null){
              md.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
              return;
            }
            if(!answer && think !== null && !done){ md.innerHTML = ''; return; }
            mdInto(md, answer, !streaming);
            if(streaming){
              let t = md, c;
              while((c = t.lastElementChild) && /^(UL|OL|LI|BLOCKQUOTE|P|H[1-6])$/.test(c.tagName)) t = c;
              const caret = document.createElement('span'); caret.className = 'caret'; t.appendChild(caret);
            }
          }

          const chatCol = $('#chatCol'), chatScroll = $('#chatScroll'), chatInput = $('#chatInput'), sendBtn = $('#sendBtn');

          chatScroll.addEventListener('scroll', () => {
            S.stick = chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 90;
          }, { passive:true });
          function scrollDown(force){ if(force || S.stick) chatScroll.scrollTop = chatScroll.scrollHeight; }

          function heroHTML(){
            const none = !S.installedChat.length;
            return `<div class="hero">
              ${icon('spark','hero-logo')}
              <h1>${none ? 'Let\u2019s get you a model' : 'How can I help you today?'}</h1>
              ${none
                ? `<div class="notice"><div><b>No language model installed yet.</b><br>Pick one from the library — it downloads straight to this runner.</div><button class="btn accent" data-act="goto-models">Install</button></div>`
                : `<p>Ask anything, paste code, or work through some math.</p><div class="chips">${SUGGESTIONS.map(s => `<button class="chip" data-act="chip" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
            </div>`;
          }

          function addTurn(role, content, isLast){
            const t = document.createElement('div');
            if(role === 'user'){
              t.className = 'turn u';
              const b = document.createElement('div'); b.className = 'u-bubble'; b.textContent = content; t.appendChild(b);
            } else {
              t.className = 'turn a' + (isLast ? ' last' : '');
              t.innerHTML = `<div class="a-body"><div class="think-slot"></div><div class="md"></div></div><div class="a-actions"><button class="icon-btn" data-act="copy-msg" title="Copy">${icon('copy','sm')}</button>${isLast ? `<button class="icon-btn" data-act="retry" title="Regenerate">${icon('refresh','sm')}</button>` : ''}</div>`;
              paintAssistant(t, content, false);
            }
            chatCol.appendChild(t);
            return t;
          }

          function renderChat(){
            chatCol.innerHTML = '';
            if(!S.history.length){ chatCol.innerHTML = heroHTML(); return; }
            const lastA = S.history.map(m => m.role).lastIndexOf('assistant');
            S.history.forEach((m, i) => addTurn(m.role, m.content, i === lastA && i === S.history.length - 1));
            S.stick = true; scrollDown(true);
          }

          function updateSend(){
            const empty = !chatInput.value.trim();
            sendBtn.disabled = !S.streaming && empty;
            sendBtn.classList.toggle('stop', S.streaming);
            $('#sendIcon use').setAttribute('href', S.streaming ? '#i-stop' : '#i-up');
            sendBtn.title = S.streaming ? 'Stop' : 'Send';
          }
          chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 220) + 'px';
            updateSend();
          });
          chatInput.addEventListener('keydown', e => {
            if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMessage(); }
          });

          async function sendMessage(override){
            if(S.streaming) return;
            const text = (override != null ? override : chatInput.value).trim();
            if(!text) return;
            if(!S.chatModel){ toast('Install a language model first'); showView('models'); return; }
            if(!S.history.length) chatCol.innerHTML = '';
            S.history.push({ role:'user', content:text });
            addTurn('user', text);
            chatInput.value = ''; chatInput.style.height = 'auto';
            S.stick = true; scrollDown(true);
            await streamReply();
          }

          async function streamReply(){
            $$('.turn.a.last').forEach(t => t.classList.remove('last'));
            const turn = document.createElement('div');
            turn.className = 'turn a';
            turn.innerHTML = `<div class="a-body"><div class="think-slot"></div><div class="md"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
            chatCol.appendChild(turn);
            scrollDown(true);

            S.streaming = true; updateSend();
            const ctrl = new AbortController(); S.abort = ctrl;
            let content = '', thinking = '', raf = 0, last = 0;
            const combined = () => (thinking ? '<think>' + thinking + '</think>' : '') + content;
            const paint = () => { raf = 0; paintAssistant(turn, combined(), true); scrollDown(); last = performance.now(); };
            const schedule = () => { if(raf) return; const wait = Math.max(0, 50 - (performance.now() - last)); raf = setTimeout(() => requestAnimationFrame(paint), wait); };

            let errMsg = '';
            try{
              const msgs = [{ role:'system', content:SYSTEM_PROMPT }].concat(
                S.history.map(m => ({ role:m.role, content: m.role === 'assistant' ? stripThink(m.content) : m.content })));
              const res = await fetch('/api/chat', { method:'POST', headers:JSON_H, signal:ctrl.signal,
                body: JSON.stringify({ model:S.chatModel, messages:msgs, stream:true }) });
              if(!res.ok){ let d = ''; try{ d = (await res.json()).error; }catch(e){} throw new Error(d || ('HTTP ' + res.status)); }
              const reader = res.body.getReader(), dec = new TextDecoder();
              let buf = '';
              for(;;){
                const { done, value } = await reader.read();
                if(done) break;
                buf += dec.decode(value, { stream:true });
                let nl;
                while((nl = buf.indexOf('\n')) >= 0){
                  const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
                  if(!line) continue;
                  let p; try{ p = JSON.parse(line); }catch(e){ continue; }
                  if(p.error) throw new Error(p.error);
                  if(p.message){
                    if(p.message.thinking) thinking += p.message.thinking;
                    if(p.message.content) content += p.message.content;
                    schedule();
                  }
                }
              }
            }catch(err){
              if(err.name !== 'AbortError') errMsg = err.message || 'Something went wrong';
            }finally{
              clearTimeout(raf); raf = 0;
              S.streaming = false; S.abort = null; updateSend();
            }

            const full = combined();
            if(full.trim()){
              paintAssistant(turn, full, false);
              S.history.push({ role:'assistant', content:full });
              turn.classList.add('last');
              turn.insertAdjacentHTML('beforeend', `<div class="a-actions"><button class="icon-btn" data-act="copy-msg" title="Copy">${icon('copy','sm')}</button><button class="icon-btn" data-act="retry" title="Regenerate">${icon('refresh','sm')}</button></div>`);
            } else if(!errMsg){
              turn.remove();
            }
            if(errMsg){
              $('.md', turn).innerHTML = '';
              const e = document.createElement('div'); e.className = 'err';
              e.innerHTML = `<span>${esc(errMsg)}</span><button class="btn ghost" data-act="retry-error">Try again</button>`;
              turn.appendChild(e);
            }
            scrollDown();
            saveConv();
            chatInput.focus();
          }

          function stopStream(){ if(S.abort) S.abort.abort(); }

          async function regenerate(){
            if(S.streaming) return;
            if(S.history.length && S.history[S.history.length - 1].role === 'assistant') S.history.pop();
            renderChat();
            if(S.history.length) await streamReply();
          }

          function saveConv(){
            if(!S.history.length) return;
            let c = S.convs.find(x => x.id === S.curId);
            if(!c){
              const first = S.history.find(m => m.role === 'user');
              c = { id:String(Date.now()), title:(first ? first.content : 'New chat').replace(/\s+/g,' ').slice(0, 44), messages:S.history, ts:Date.now() };
              S.curId = c.id; S.convs.unshift(c);
            } else {
              c.messages = S.history; c.ts = Date.now();
              S.convs = [c].concat(S.convs.filter(x => x !== c));
            }
            store.set('ua_convs', S.convs);
            renderConvList();
          }
          function renderConvList(){
            const q = $('#search').value.trim().toLowerCase();
            const now = new Date(), day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const groups = { 'Today':[], 'Previous 7 days':[], 'Older':[] };
            S.convs.forEach(c => {
              if(q && !c.title.toLowerCase().includes(q)) return;
              (c.ts >= day0 ? groups['Today'] : c.ts >= day0 - 6*864e5 ? groups['Previous 7 days'] : groups['Older']).push(c);
            });
            let h = '';
            Object.keys(groups).forEach(g => {
              if(!groups[g].length) return;
              h += `<div class="sb-label">${g}</div>` + groups[g].map(c =>
                `<div class="conv${c.id === S.curId ? ' active' : ''}" data-act="open-conv" data-id="${c.id}"><span class="conv-t">${esc(c.title)}</span><button class="conv-x" data-act="del-conv" data-id="${c.id}" title="Delete">${icon('x','sm')}</button></div>`).join('');
            });
            $('#convList').innerHTML = h;
          }
          function newChat(){
            if(S.streaming) stopStream();
            S.history = []; S.curId = null; renderChat(); renderConvList(); showView('chat');
            chatInput.value = ''; chatInput.style.height = 'auto'; updateSend();
          }
          $('#search').addEventListener('input', renderConvList);

          function closeMenu(){ $('#modelMenu').hidden = true; }
          function openMenu(){
            const m = $('#modelMenu');
            let h = S.installedChat.map(x => `<button class="menu-item" data-act="use-chat" data-name="${esc(x.name)}"><div class="grow">${esc(x.name)}<small>${[x.params, x.quant, fmtBytes(x.size)].filter(Boolean).join(' · ')}</small></div>${x.name === S.chatModel ? icon('check','chk') : ''}</button>`).join('');
            if(h) h += '<div class="menu-sep"></div>';
            h += `<button class="menu-item" data-act="goto-models"><div class="grow">Install more models…</div>${icon('cube','sm')}</button>`;
            m.innerHTML = h; m.hidden = false;
          }
          function updatePill(){
            $('#modelPillText').textContent = S.chatModel || 'No model installed';
            updateSend();
          }

          async function refreshChat(){
            try{
              const d = await jfetch('/api/tags');
              S.ollamaOk = true;
              S.installedChat = (d.models || []).map(m => ({ name:m.name, size:m.size, params:m.details && m.details.parameter_size, quant:m.details && m.details.quantization_level }));
            }catch(e){ S.ollamaOk = false; }
            if(!S.installedChat.some(m => m.name === S.chatModel)){
              S.chatModel = S.installedChat.length ? S.installedChat[0].name : '';
              store.set('ua_chat_model', S.chatModel);
            }
            updatePill(); updateStatus();
            if(!S.history.length && S.view === 'chat') chatCol.innerHTML = heroHTML();
          }
          function isInstalled(tag){ return S.installedChat.some(m => m.name === tag || m.name === tag + ':latest'); }

          async function pullModel(tag){
            tag = (tag || '').trim();
            if(!tag) return;
            if(S.pulls[tag] && S.pulls[tag].active) return;
            const ctrl = new AbortController();
            const st = S.pulls[tag] = { active:true, status:'Starting…', layers:{}, completed:0, total:0, ctrl, t0:Date.now(), error:null };
            renderModels();
            try{
              const res = await fetch('/api/pull', { method:'POST', headers:JSON_H, signal:ctrl.signal, body:JSON.stringify({ model:tag, stream:true }) });
              if(!res.ok){ let d = ''; try{ d = (await res.json()).error; }catch(e){} throw new Error(d || ('HTTP ' + res.status)); }
              const reader = res.body.getReader(), dec = new TextDecoder();
              let buf = '', lastUi = 0;
              for(;;){
                const { done, value } = await reader.read();
                if(done) break;
                buf += dec.decode(value, { stream:true });
                let nl;
                while((nl = buf.indexOf('\n')) >= 0){
                  const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
                  if(!line) continue;
                  let p; try{ p = JSON.parse(line); }catch(e){ continue; }
                  if(p.error) throw new Error(p.error);
                  if(p.status) st.status = p.status;
                  if(p.digest && p.total){ st.layers[p.digest] = { t:p.total, c:p.completed || 0 }; }
                  let T = 0, C = 0; Object.values(st.layers).forEach(l => { T += l.t; C += l.c; });
                  st.total = T; st.completed = C;
                  const now = performance.now();
                  if(now - lastUi > 250){ lastUi = now; tickProgress(); }
                }
              }
              delete S.pulls[tag];
              toast('Installed ' + tag);
            }catch(e){
              st.active = false;
              st.error = e.name === 'AbortError' ? 'Cancelled' : e.message;
            }
            await refreshChat();
            renderModels();
          }

          let imgPoll = null;
          async function refreshImage(){
            try{
              const d = await jfetch('/image/models');
              S.imgOk = !!d.ready;
              S.imgCatalog = d.catalog || []; S.imgInstalled = d.installed || []; S.imgInstalls = d.installs || {};
              S.diskFree = d.disk_free_gb;
            }catch(e){ S.imgOk = false; }
            if(!S.imgInstalled.some(m => m.file === S.imageModel)){
              S.imageModel = S.imgInstalled.length ? S.imgInstalled[0].file : '';
              store.set('ua_image_model', S.imageModel);
            }
            fillImgSelect();
            const active = Object.values(S.imgInstalls).some(i => i.status === 'starting' || i.status === 'downloading');
            if(active && !imgPoll) imgPoll = setInterval(refreshImageTick, 1000);
            if(!active && imgPoll){ clearInterval(imgPoll); imgPoll = null; }
          }
          let lastImgSig = '';
          async function refreshImageTick(){
            await refreshImage();
            const sig = JSON.stringify([S.imgInstalled.map(m => m.file), Object.entries(S.imgInstalls).map(([k, v]) => k + v.status + (v.error || ''))]);
            if(sig !== lastImgSig){ lastImgSig = sig; renderModels(); } else tickProgress();
          }
          function fillImgSelect(){
            const sel = $('#imgModel');
            sel.innerHTML = S.imgInstalled.length
              ? S.imgInstalled.map(m => `<option value="${esc(m.file)}"${m.file === S.imageModel ? ' selected' : ''}>${esc(m.name)}</option>`).join('')
              : '<option value="">No image model installed</option>';
            $('#imgModelHint').innerHTML = S.imgInstalled.length ? '' : 'Install one first — <a data-act="goto-models-image">open the model library</a>.';
          }
          $('#imgModel').addEventListener('change', e => {
            S.imageModel = e.target.value; store.set('ua_image_model', S.imageModel);
            const m = S.imgInstalled.find(x => x.file === S.imageModel);
            if(m){ $('#imgSteps').value = m.steps; $('#imgCfg').value = m.cfg; }
          });

          async function installImage(body){
            try{
              await jfetch('/image/models/install', { method:'POST', headers:JSON_H, body:JSON.stringify(body) });
              await refreshImage(); renderModels();
            }catch(e){ toast(e.message); }
          }

          function genLoader(){
            return `<div class="gen"><div class="gen-art">${icon('spark')}</div><div class="gen-text" id="genText">Submitting…</div><div class="bar indet" id="genBar"><i></i></div><div class="gen-sub" id="genSub">0s</div></div>`;
          }
          async function generateImage(){
            if(S.genBusy) return;
            const prompt = $('#imgPrompt').value.trim();
            if(!prompt){ toast('Please enter a prompt'); return; }
            if(!S.imageModel){ toast('Install an image model first'); S.tab = 'image'; showView('models'); return; }
            const btn = $('#genBtn'), out = $('#imgOut');
            S.genBusy = true; btn.disabled = true; btn.querySelector('span').textContent = 'Generating…';
            out.innerHTML = genLoader();
            const t0 = Date.now();
            const tick = setInterval(() => { const s = $('#genSub'); if(s && !s.dataset.p) s.textContent = fmtDur((Date.now() - t0) / 1000); }, 1000);
            const [w, h] = $('#imgSize').value.split('x').map(Number);
            const done = () => { clearInterval(tick); S.genBusy = false; btn.disabled = false; btn.querySelector('span').textContent = 'Generate'; };
            const fail = (title, detail) => {
              done();
              out.innerHTML = `<div class="out-empty"><b style="color:var(--danger)">${esc(title)}</b>${esc(detail || '')}</div>`;
            };
            let id;
            try{
              const d = await jfetch('/image/generate', { method:'POST', headers:JSON_H, body:JSON.stringify({
                prompt, negative_prompt:$('#imgNeg').value.trim(), model:S.imageModel, width:w, height:h,
                steps:parseInt($('#imgSteps').value) || 15, guidance_scale:parseFloat($('#imgCfg').value) || 7.5,
                seed:isNaN(parseInt($('#imgSeed').value)) ? -1 : parseInt($('#imgSeed').value) }) });
              id = d.job_id;
            }catch(e){ return fail('Could not start', e.message); }

            const poll = async () => {
              try{
                const s = await jfetch('/image/status/' + id, { cache:'no-store' });
                if(s.status === 'error') return fail('Generation failed', s.error);
                if(s.status === 'done'){
                  const r = await jfetch('/image/result/' + id, { cache:'no-store' });
                  done();
                  const src = 'data:image/png;base64,' + r.image;
                  out.innerHTML = `<img src="${src}" alt="Generated image"><div class="out-actions"><a class="btn ghost" style="background:var(--surface);text-decoration:none" download="image-${Date.now()}.png" href="${src}">${icon('down','sm')}Save</a></div>`;
                  return;
                }
                const txt = $('#genText'), bar = $('#genBar'), sub = $('#genSub');
                if(txt){
                  if(s.status === 'queued'){ txt.textContent = 'Waiting for the engine…'; bar.classList.add('indet'); }
                  else if(s.progress){
                    const p = s.progress, pct = p.cur / p.tot * 100;
                    txt.textContent = p.cur >= p.tot ? 'Decoding image…' : `Sampling · step ${p.cur} of ${p.tot}`;
                    bar.classList.remove('indet'); $('i', bar).style.width = pct + '%';
                    const el = (Date.now() / 1000 - s.started);
                    const eta = p.cur > 0 ? el / p.cur * (p.tot - p.cur) : 0;
                    sub.dataset.p = '1'; sub.textContent = `${fmtDur(Date.now() / 1000 - s.created)} elapsed` + (p.cur > 0 && p.cur < p.tot ? ` · ~${fmtDur(eta)} left` : '');
                  } else { txt.textContent = 'Loading model & encoding prompt…'; bar.classList.add('indet'); }
                }
                setTimeout(poll, 1500);
              }catch(e){ setTimeout(poll, 3000); }
            };
            poll();
          }

          function progText(st){
            if(st.total){
              const el = (Date.now() - (st.t0 || Date.now())) / 1000, sp = el > 1 ? st.completed / el : 0;
              return `${fmtBytes(st.completed)} / ${fmtBytes(st.total)}` + (sp ? ` · ${fmtBytes(sp)}/s` : '') + ` · ${Math.floor(st.completed / st.total * 100)}%`;
            }
            return st.status || 'Starting…';
          }
          function progHTML(key, st){
            const pct = st.total ? Math.min(100, st.completed / st.total * 100) : 0;
            return `<div class="prog" data-key="${esc(key)}"><div class="bar${st.total ? '' : ' indet'}"><i style="width:${pct}%"></i></div><div class="prog-text">${esc(progText(st))}</div></div>`;
          }
          function card(o){
            return `<div class="mcard${o.sel ? ' sel' : ''}"><div class="mcard-main">
              <div class="mcard-title">${esc(o.title)}${(o.badges || []).map(b => `<span class="badge${b === 'Recommended' || b === 'Selected' ? '' : ' gray'}">${esc(b)}</span>`).join('')}</div>
              <div class="mcard-sub">${esc(o.sub)}</div>
              ${o.desc ? `<div class="mcard-desc">${esc(o.desc)}</div>` : ''}
              ${o.prog || ''}${o.error ? `<div class="prog-err">${esc(o.error)}</div>` : ''}
            </div><div class="mcard-act">${o.actions || ''}</div></div>`;
          }
          const sec = (t, inner) => `<div class="sec">${t}</div><div class="grid">${inner}</div>`;

          function chatLists(){
            let h = '';
            const inst = S.installedChat.map(m => card({
              title:m.name, sub:[m.params, m.quant, fmtBytes(m.size)].filter(Boolean).join(' · '),
              sel:m.name === S.chatModel, badges:m.name === S.chatModel ? ['Selected'] : [],
              actions:(m.name === S.chatModel ? '' : `<button class="btn" data-act="use-chat" data-name="${esc(m.name)}">Use</button>`) +
                      `<button class="btn danger" data-act="del-chat" data-name="${esc(m.name)}" title="Delete">${icon('trash','sm')}</button>`
            })).join('');
            h += sec('Installed', inst || '<div class="empty-note">Nothing installed yet. Choose a model below.</div>');

            const lib = new Set(OLLAMA_LIBRARY.map(m => m.tag));
            const extra = Object.keys(S.pulls).filter(t => !lib.has(t) && !isInstalled(t));
            const items = OLLAMA_LIBRARY.filter(m => !isInstalled(m.tag)).map(m => ({ tag:m.tag, name:m.name, size:m.size, badges:m.badges, desc:m.desc }))
              .concat(extra.map(t => ({ tag:t, name:t, size:0, badges:['Custom'], desc:'' })));
            const libH = items.map(m => {
              const st = S.pulls[m.tag], active = st && st.active;
              return card({
                title:m.name, sub:m.tag + (m.size ? ` · ${m.size.toFixed(1)} GB` : ''), badges:m.badges, desc:m.desc,
                prog: active ? progHTML('pull:' + m.tag, st) : '', error: st && st.error,
                actions: active ? `<button class="btn ghost" data-act="cancel-pull" data-tag="${esc(m.tag)}">Cancel</button>`
                                : `<button class="btn accent" data-act="pull" data-tag="${esc(m.tag)}">${icon('down','sm')}Install</button>`
              });
            }).join('');
            h += sec('Library', libH || '<div class="empty-note">Everything in the library is installed.</div>');
            return h;
          }

          function imageLists(){
            if(!S.imgOk) return '<div class="empty-note" style="margin-top:20px">The image engine isn\u2019t reachable yet. It may still be starting — reopen this tab in a moment.</div>';
            const inst = S.imgInstalled.map(m => card({
              title:m.name, sub:m.file + ' · ' + fmtBytes(m.size), sel:m.file === S.imageModel, badges:m.file === S.imageModel ? ['Selected'] : [],
              actions:(m.file === S.imageModel ? '' : `<button class="btn" data-act="use-img" data-file="${esc(m.file)}">Use</button>`) +
                      `<button class="btn danger" data-act="del-img" data-file="${esc(m.file)}" title="Delete">${icon('trash','sm')}</button>`
            })).join('');
            let h = sec('Installed', inst || '<div class="empty-note">Nothing installed yet. Choose a model below.</div>');
            const have = new Set(S.imgInstalled.map(m => m.file));
            const rows = S.imgCatalog.filter(m => !have.has(m.file)).map(m => ({ key:m.id, title:m.name, sub:`${m.file} · ${m.size_gb.toFixed(1)} GB`, badges:m.badges, desc:m.desc, id:m.id }));
            Object.keys(S.imgInstalls).filter(k => k.startsWith('custom:') && !have.has(S.imgInstalls[k].file)).forEach(k => {
              rows.push({ key:k, title:S.imgInstalls[k].file, sub:'Custom download', badges:['Custom'], desc:'', id:null });
            });
            const libH = rows.map(m => {
              const st = S.imgInstalls[m.key], active = st && (st.status === 'starting' || st.status === 'downloading');
              const view = st ? { total:st.total, completed:st.downloaded, t0:st.started * 1000, status:'Starting…' } : null;
              return card({
                title:m.title, sub:m.sub, badges:m.badges, desc:m.desc,
                prog: active ? progHTML('img:' + m.key, view) : '', error: st && st.status === 'error' ? st.error : '',
                actions: active ? `<button class="btn ghost" data-act="cancel-img" data-key="${esc(m.key)}">Cancel</button>`
                                : (m.id ? `<button class="btn accent" data-act="img-install" data-id="${esc(m.id)}">${icon('down','sm')}Install</button>` : '')
              });
            }).join('');
            h += sec('Library', libH || '<div class="empty-note">Everything in the library is installed.</div>');
            return h;
          }

          function renderModels(){
            if(S.view !== 'models') return;
            $('#tabChat').classList.toggle('on', S.tab === 'chat');
            $('#tabImage').classList.toggle('on', S.tab === 'image');
            $('#modelLists').innerHTML = S.tab === 'chat' ? chatLists() : imageLists();
            $('#customLabel').textContent = S.tab === 'chat' ? 'Install by name' : 'Install from a direct link';
            $('#customInput').placeholder = S.tab === 'chat' ? 'e.g. llama3.2:3b' : 'https://huggingface.co/…/resolve/main/model.safetensors';
            $('#customHint').innerHTML = S.tab === 'chat'
              ? 'Any model from <a href="https://ollama.com/library" target="_blank" rel="noopener">ollama.com/library</a> works — type its name and tag.'
              : 'Paste a direct download link to a Stable Diffusion 1.x / 2.x / Turbo checkpoint (.safetensors or .ckpt), for example from Hugging Face.';
            $('#diskInfo').textContent = S.diskFree != null ? `${S.diskFree} GB free disk` : '';
          }
          function tickProgress(){
            let miss = false;
            Object.keys(S.pulls).forEach(t => {
              const st = S.pulls[t]; if(!st.active) return;
              if(!patch('pull:' + t, st)) miss = true;
            });
            Object.keys(S.imgInstalls).forEach(k => {
              const st = S.imgInstalls[k]; if(st.status !== 'downloading' && st.status !== 'starting') return;
              if(!patch('img:' + k, { total:st.total, completed:st.downloaded, t0:st.started * 1000, status:'Starting…' })) miss = true;
            });
            if(miss && S.view === 'models') renderModels();
          }
          function patch(key, st){
            const el = $(`.prog[data-key="${CSS.escape(key)}"]`);
            if(!el) return false;
            const pct = st.total ? Math.min(100, st.completed / st.total * 100) : 0;
            const bar = $('.bar', el);
            bar.classList.toggle('indet', !st.total);
            $('i', bar).style.width = pct + '%';
            $('.prog-text', el).textContent = progText(st);
